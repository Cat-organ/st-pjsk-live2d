  <!-- 开发版剧情快照 story-data.js：发布版不含，剧情读世界书 -->
  <script>
/* ---- player/story.core.js ---- */
/* 由 tools/gen_story_kit.py 从 剧情模块/story-select-demo.html 生成，别手改核心块。
   工厂：window.PJSKStoryCore(host) -> { init }
   host: { isOpen(), onConfirm(rec, ctx) }
   —— 组合图标复用 index.html 里的 ps-* symbol，这里不再输出 sprite。 */
window.PJSKStoryCore = function (host) {

/* ============================================================
   剧情数据：来自世界书里以「📖剧情_」开头的条目
     · 酒馆内   → 酒馆助手 getWorldbook 实时读取（新增条目即时生效）
     · 本地预览 → 退回 pjsk-story.js 快照
   头像 / 背景：宿主按 gen() 规则拼成绝对地址
   ============================================================ */

const D = window.PJSK;

const STORY_PREFIX = '📖剧情_';
const STORY_BOOKS  = (host && host.storyBooks) || ['【live2d-pjsk】_1106'];   // 由 story.js 传入

/* 酒馆助手 API（不在酒馆里就取不到） */
function thApi(name){
  try {
    if (typeof window[name] === 'function') return window[name];
    if (window.TavernHelper && typeof window.TavernHelper[name] === 'function')
      return window.TavernHelper[name].bind(window.TavernHelper);
  } catch (e) {}
  try {
    const p = window.parent;
    if (p && p !== window && p.TavernHelper && typeof p.TavernHelper[name] === 'function')
      return p.TavernHelper[name].bind(p.TavernHelper);
  } catch (e) {}
  return null;
}
let IN_TAVERN = !!thApi('getWorldbook');   // 在 loadStory 里会再确认一次，防止助手晚于本脚本注入

/* ---------- 图片地址：绝对地址原样用，相对路径补 raw 前缀 ---------- */
function assetUrl(p){
  const s = String(p || '');
  return /^(https?:|data:|blob:)/i.test(s) ? s : D.imgBase + s.replace(/^\/+/, '');
}
function assetAlt(p){ return assetUrl(p); }
function setImgSrc(img, p){ if (p) img.src = assetUrl(p); }

/* ---------- 组合定义 ---------- */
const UNITS = [
  { id:'ln',  key:'ln',  icon:'ps-ln',   name:'Leo/need',             sub:'校园乐队 · 4 人',
    color:'#4555DC', rgb:'69,85,220',   members:['hnm','ick','saki','shiho'] },
  { id:'mmj', key:'mmj', icon:'ps-mmj',  name:'MORE MORE JUMP!',      sub:'偶像组合 · 4 人',
    color:'#88DD44', rgb:'136,221,68',  members:['airi','hrk','mnr','szk'] },
  { id:'vbs', key:'vbs', icon:'ps-vbs',  name:'Vivid BAD SQUAD',       sub:'街头音乐 · 4 人',
    color:'#EE1166', rgb:'238,17,102',  members:['akt','an','khn','toya'] },
  { id:'wxs', key:'ws',  icon:'ps-wxs',  name:'Wonderlands×Showtime',  sub:'主题乐园剧团 · 4 人',
    color:'#FF9900', rgb:'255,153,0',   members:['emu','nene','rui','tks'] },
  { id:'j25', key:'25',  icon:'ps-25ji', name:'25时，Nightcord见。',    sub:'线上音乐社团 · 4 人',
    color:'#884499', rgb:'136,68,153',  members:['ena','knd','mfy','mzk'] }
];

/* 混活 / 升学的活动按组合归属（数字取自 event_story_N）
   未列入任何组合的会被自动归到「其它」，新增活动不会丢 */
const EVENT_MAP = {
  mix: {
    ws:   [1, 17, 19, 22, 27, 33],
    ln:   [4, 5, 6, 10, 28, 30, 32, 36],
    mmj:  [11, 12, 15, 16, 26, 31, 34],
    vbs:  [8, 9, 13, 20, 25, 29, 37],
    '25': [2, 7, 14, 21, 23, 24]
  },
  mix3: {
    ws:   [39, 48, 50, 52, 58, 64],
    ln:   [38, 51, 55, 56, 57],
    mmj:  [40, 45, 49, 63, 74],
    vbs:  [42, 44, 46, 53, 61],
    '25': [41, 43, 54, 62, 65, 68]
  }
};

/* ============================================================
   解析世界书条目
   ============================================================ */
function storyKeyOf(name){
  if (typeof name !== 'string' || !name) return null;
  if (name.startsWith(STORY_PREFIX)) return name.slice(STORY_PREFIX.length).trim();
  const m = name.match(/📖\uFE0F?\s*剧情_\s*/);
  return m ? name.slice(m.index + m[0].length).trim() : null;
}

/* 宽容解析：JSON → 二次编码的 JSON → 截取方括号范围 → 去掉尾随逗号 */
function parseStoryContent(raw){
  if (raw == null) return null;
  if (Array.isArray(raw)) return raw;
  const text = String(raw).replace(/^\uFEFF/, '').trim();
  if (!text) return null;
  const loose = t => t.replace(/,\s*([\]}])/g, (m, p1) => p1);
  const asArr = t => { try { const v = JSON.parse(loose(t)); return Array.isArray(v) ? v : null; } catch (e) { return null; } };

  let v = asArr(text);
  if (v) return v;
  try { const twice = JSON.parse(JSON.parse(text)); if (Array.isArray(twice)) return twice; } catch (e) {}
  const s = text.indexOf('['), e = text.lastIndexOf(']');
  if (s >= 0 && e > s) v = asArr(text.slice(s, e + 1));
  return v;
}

/* 从图片地址拆出目录（组合）与文件名 */
function parseImg(url){
  const s = String(url || '');
  const m = s.match(/\/image\/(.+)$/);
  const rel = m ? m[1] : s;
  const parts = rel.split('/');
  const file = parts.pop() || '';
  const folder = parts.length ? parts[parts.length - 1] : '';
  return { file, folder };
}

/* “二箱：『标题』 - 序章” → { box:'二箱', name:'标题', tail:'序章' } */
function splitTitle(title){
  let s = String(title || '').trim();
  let box = '', tail = '';
  const pre = s.match(/^([^：:]{1,24})[：:]\s*(.+)$/);
  if (pre) { box = pre[1].trim(); s = pre[2].trim(); }
  const q = s.match(/『([^』]*)』/);
  if (q) {
    tail = s.slice(s.indexOf('』') + 1).replace(/^[\s\-—–－]+/, '').trim();
    s = q[1].trim();
  }
  return { box, name: s, tail };
}

const numOfFile = f => {
  const m = String(f).match(/(\d+)(?=\.[a-z0-9]+$)/i);
  return m ? Number(m[1]) : NaN;
};

function makeRec(raw){
  const info = parseImg(raw.image);
  const t = splitTitle(raw.title);
  return {
    title: String(raw.title || ''),
    name:  t.name, box: t.box, tail: t.tail,
    desc:  String(raw.description || raw.desc || '').replace(/\r\n/g, '\n'),
    img:   String(raw.image || ''),
    file:  info.file,
    folder: info.folder,
    num:   numOfFile(info.file)
  };
}

/* 判断一个条目属于哪一类 */
function classify(key, arr){
  if (/混活/.test(key)) return { t: 'event', kind: /升学/.test(key) ? 'mix3' : 'mix' };
  if (/电影|剧场版/.test(key)) return { t: 'event', kind: 'movie' };

  const first = arr.find(it => it && !it.separator && it.image) || arr.find(it => it && !it.separator) || {};
  const info = parseImg(first.image);
  const unitKey = info.folder;
  if (!UNITS.some(u => u.key === unitKey)) return null;

  const mm = info.file.match(/^([a-z0-9]+)_banner_event/i);
  const mk = mm ? mm[1].toLowerCase() : '';
  const u = UNITS.find(x => x.key === unitKey);
  if (mk && u.members.includes(mk)) return { t: 'member', unit: unitKey, member: mk };
  return { t: 'extra', unit: unitKey };
}

/* 把条目列表整理成「成员 / 其它 / 活动」三套 */
function buildIndex(entries){
  const idx = { member:{}, label:{}, extra:{}, event:{ mix:[], mix3:[], movie:[] }, count:0, src:'' };
  UNITS.forEach(u => {
    idx.member[u.key] = {};
    u.members.forEach(m => { idx.member[u.key][m] = []; });
    idx.extra[u.key] = [];
  });

  entries.forEach(entry => {
    const key = storyKeyOf(entry && entry.name);
    if (!key) return;
    const arr = parseStoryContent(entry.content);
    if (!arr || !arr.length) return;
    const cls = classify(key, arr);
    if (!cls) return;

    const out = [];
    arr.forEach(raw => {
      if (!raw || typeof raw !== 'object') return;
      const isSep = raw.separator || (!raw.title && !raw.image);
      if (isSep) {
        const label = String(raw.label || '').trim();
        if (label && out.length) out.push({ sep:true, label });
        return;
      }
      out.push(makeRec(raw));
    });
    if (!out.length) return;

    if (cls.t === 'member') {
      idx.member[cls.unit][cls.member] = idx.member[cls.unit][cls.member].concat(out);
      idx.label[cls.member] = key;      // 世界书里的角色名，用于 tooltip
    } else if (cls.t === 'extra') {
      idx.extra[cls.unit] = idx.extra[cls.unit].concat(out);
    } else {
      idx.event[cls.kind] = idx.event[cls.kind].concat(out.filter(r => !r.sep));
    }
  });

  ['mix','mix3','movie'].forEach(k => {
    idx.event[k].sort((a, b) => (isNaN(a.num) ? 1e9 : a.num) - (isNaN(b.num) ? 1e9 : b.num));
  });
  idx.count = UNITS.reduce((n, u) =>
      n + Object.values(idx.member[u.key]).reduce((m, l) => m + l.length, 0) + idx.extra[u.key].length, 0)
    + idx.event.mix.length + idx.event.mix3.length + idx.event.movie.length;
  return idx;
}

/* 读世界书；失败/为空则用快照 */
async function loadStory(){
  IN_TAVERN = !!thApi('getWorldbook');
  let entries = [];
  let src = 'worldbook';

  if (IN_TAVERN) {
    const getWb = thApi('getWorldbook');
    const getNames = thApi('getWorldbookNames');
    // 只认 STORY_BOOKS 里的名字，不做模糊匹配：
    // 名字不对就在这里加一行 warn，改了名直接改文件顶部那行
    const names = STORY_BOOKS.slice();
    if (getNames) {
      try {
        const all = await getNames();
        if (Array.isArray(all) && all.length) {
          const miss = names.filter(n => all.includes(n) === false);
          if (miss.length) console.warn('[剧情] 世界书里没有', miss.join(' / '), '；现有：', all.join(' / '));
        }
      } catch (e) { /* 拿不到清单就直接按名字读 */ }
    }
    const seen = new Set();
    for (const n of names) {
      try {
        const wb = await getWb(n);
        (wb || []).forEach(e => {
          if (!e || !e.name || seen.has(e.name) || !storyKeyOf(e.name)) return;
          seen.add(e.name);
          entries.push(e);
        });
      } catch (e) { console.warn('[剧情] 读取世界书失败：', n, e); }
    }
  }

  if (!entries.length && Array.isArray(window.PJSK_STORY)) {
    entries = window.PJSK_STORY;
    src = 'snapshot';
  }

  STORY = buildIndex(entries);
  STORY.src = src;
  console.log(`[剧情] 数据源 ${src}｜条目 ${entries.length}｜剧情 ${STORY.count} 段`);
}

/* ============================================================
   状态
   ============================================================ */
const state = {
  unitId:'ln',
  member:null,      // 当前成员缩写
  view:'member',    // member | event | extra
  kind:'mix',       // mix | mix3 | movie
  eventUnit:null    // 混活/升学下按组合筛选：ln | mmj | vbs | ws | 25 | other
};

let STORY = { member:{}, label:{}, extra:{}, event:{ mix:[], mix3:[], movie:[] }, count:0, src:'' };
let currentItems = [];   // 当前横幅列表（含分隔项）
let selIndex = -1;       // 选中项在 currentItems 中的下标

const unit = () => UNITS.find(u => u.id === state.unitId);
const assets = () => D.units[unit().key];
const memberKey = () => (state.member || '').toLowerCase();
const isEventFilter = () => state.view === 'event' && state.kind !== 'movie';

/* 当前背景池 */
function bgPool(){
  if (state.view === 'event') {
    if (state.kind === 'movie') return ['pc-bg/Default/pjsk-PC-21.png'];
    const eu = state.eventUnit && state.eventUnit !== 'other'
      ? UNITS.find(x => x.key === state.eventUnit) : null;
    return eu ? D.units[eu.key].allBg : D.defaultBg;
  }
  const a = assets();
  if (state.view === 'extra') return a.allBg;
  return a.bg[memberKey()] || a.allBg;
}

/* 活动：按组合编号挑；没被任何组合登记的 → 其它 */
function eventList(kind, eu){
  const all = STORY.event[kind] || [];
  if (eu === 'other') {
    const taken = new Set();
    Object.values(EVENT_MAP[kind] || {}).forEach(list => list.forEach(n => taken.add(n)));
    return all.filter(r => !taken.has(r.num));
  }
  const nums = (EVENT_MAP[kind] || {})[eu] || [];
  const byNum = new Map(all.map(r => [r.num, r]));
  return nums.map(n => byNum.get(n)).filter(Boolean);
}

/* 当前横幅列表 */
function bannerList(){
  if (state.view === 'event') {
    if (state.kind === 'movie') return STORY.event.movie || [];
    return eventList(state.kind, state.eventUnit);
  }
  if (state.view === 'extra') return STORY.extra[unit().key] || [];
  return (STORY.member[unit().key] || {})[memberKey()] || [];
}

/* 活动筛选里的组合名 */
function eventUnitName(key){
  if (!key || key === 'other') return '其它';
  const u = UNITS.find(x => x.key === key);
  return u ? u.name : key;
}

/* 成员显示名（取自头像文件名） */
function memberName(key){
  const zh = (STORY.label || {})[key] || (STORY.label || {})[String(key).toLowerCase()];
  if (zh) return zh;
  const p = assets().profile[key] || assets().profile[key.toLowerCase()];
  if (!p) return key;
  return decodeURIComponent(p.split('/').pop().replace(/\.\w+$/, ''));
}

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* ============================================================
   DOM
   ============================================================ */
const screenEl    = document.getElementById('pjsk-story-screen');
const qs  = sel => screenEl.querySelector(sel);
const qsa = sel => [...screenEl.querySelectorAll(sel)];
const bgEl        = qs('#bg');

const railEl      = qs('#rail');

const storyTailEl = qs('#storyTail');

const storyLogoEl = qs('#storyLogo');

let flashTimer;

/* 背景：两层交叉淡入 */
bgEl.innerHTML = '<div class="bg__layer"></div><div class="bg__layer"></div>';
const bgLayers = [...bgEl.children];
let bgTop = 0;

function setBg(src, instant){
  if (!src) return;
  const primary = assetUrl(src), alt = assetAlt(src);
  const apply = u => {
    const next = bgLayers[1 - bgTop];
    next.style.backgroundImage = `url("${u}")`;
    next.classList.add('is-on');
    bgLayers[bgTop].classList.remove('is-on');
    bgTop = 1 - bgTop;
  };
  if (instant) {
    const probe = new Image();
    probe.onload = () => apply(primary);
    probe.onerror = () => {
      const probe2 = new Image();
      probe2.onload = () => apply(alt);
      probe2.onerror = () => apply(primary);
      probe2.src = alt;
    };
    probe.src = primary;
    return;
  }
  const img = new Image();
  img.onload = () => apply(primary);
  img.onerror = () => {
    const img2 = new Image();
    img2.onload = () => apply(alt);
    img2.onerror = () => apply(primary);
    img2.src = alt;
  };
  img.src = primary;
}

/* 随机抽一张：尽量避免和当前重复 */
let lastBg = '';
function randomBg(){
  const pool = bgPool();
  if (!pool || !pool.length) return null;
  if (pool.length === 1) return pool[0];
  let pick = lastBg;
  for (let i = 0; i < 8 && pick === lastBg; i++) {
    pick = pool[Math.floor(Math.random() * pool.length)];
  }
  lastBg = pick;
  return pick;
}

/* ============================================================
   渲染
   ============================================================ */
function renderBanners(){
  const list = bannerList();
  currentItems = list;
  selIndex = -1;
  listEl.innerHTML = '';

  let n = 0;
  list.forEach((rec, i) => {
    if (rec.sep) {
      const d = document.createElement('div');
      d.className = 'banner-sep';
      d.textContent = rec.label || '';
      listEl.appendChild(d);
      return;
    }
    const b = document.createElement('button');
    b.className = 'banner anim-b';
    b.style.setProperty('--i', Math.min(n++, 8));
    b.type = 'button';
    b.dataset.i = String(i);
    b.setAttribute('role', 'option');
    b.setAttribute('aria-label', rec.name || '剧情');
    b.title = rec.title || rec.name || '';

    const img = document.createElement('img');
    setImgSrc(img, rec.img);
    img.alt = rec.name || '剧情横幅';
    img.draggable = false;
    img.loading = i < 6 ? 'eager' : 'lazy';
    img.decoding = 'async';
    b.appendChild(img);

    b.addEventListener('click', () => pickBanner(i, false, true));
    listEl.appendChild(b);
  });

  if (!n) {
    const d = document.createElement('div');
    d.className = 'banner-empty';
    d.textContent = '该分类暂无剧情条目';
    listEl.appendChild(d);
  }

  listEl.scrollTop = 0;
  const first = list.findIndex(r => !r.sep);
  if (first >= 0) pickBanner(first, true);
  else renderStory();
}

function pickBanner(i, silent, withBg){
  const rec = currentItems[i];
  if (!rec || rec.sep) return;
  selIndex = i;

  [...listEl.children].forEach(el => {
    if (!el.dataset.i) return;
    const on = el.dataset.i === String(i);
    el.classList.toggle('is-active', on);
    el.setAttribute('aria-selected', on ? 'true' : 'false');
  });

  /* 切横幅顺手换一张背景：成员视图取该角色池，混活/升学取当前组合池
     （电影只有一张固定图，不参与） */
  if (withBg && !(state.view === 'event' && state.kind === 'movie')) {
    setBg(randomBg());
  }

  renderStory();

  if (!silent) {
    const el = listEl.querySelector(`[data-i="${i}"]`);
    if (el) setTimeout(() => el.scrollIntoView({ block:'nearest', behavior:'smooth' }), 120);
  }
}

/* STORY 面板：显示当前选中条目的标题与简介 */
function renderStory(){
  const rec = currentItems[selIndex];
  if (!rec) {
    storyChipEl.hidden = true;
    storyNameEl.textContent = '';
    storyTailEl.hidden = true;
    storyEl.textContent = '';
    return;
  }

  /* STORY 行：箱数标签 + 标题 + 尾注，同一行；过长时标题省略 */
  storyChipEl.textContent = rec.box || '';
  storyChipEl.hidden = !rec.box;
  storyChipEl.title = rec.box || '';

  storyNameEl.textContent = rec.name || '';
  storyNameEl.title = rec.name || '';
  storyTailEl.textContent = rec.tail || '';
  storyTailEl.hidden = !rec.tail;

  storyEl.classList.remove('swap-in');
  void storyEl.offsetWidth;
  storyEl.innerHTML = esc(rec.desc).replace(/\n/g, '<br>');
  storyEl.classList.add('swap-in');
  storyEl.scrollTop = 0;
}

function renderRail(){
  const a = assets();
  railEl.innerHTML = '';

  if (isEventFilter()) {
    /* 混活 / 升学：rail 换成五个组合 logo，点击即按组合筛选活动 */
    UNITS.forEach(u => {
      const b = document.createElement('button');
      b.className = 'uava' + (state.eventUnit === u.key ? ' is-active' : '');
      b.type = 'button';
      b.style.setProperty('--uc', u.color);
      b.setAttribute('aria-label', u.name);
      b.title = u.name;
      b.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#${u.icon}"/></svg>`;
      b.addEventListener('click', () => selectEventUnit(u.key));
      railEl.appendChild(b);
    });
  } else {
    unit().members.forEach(key => {
      const b = document.createElement('button');
      b.className = 'ava' + (state.view === 'member' && key === state.member ? ' is-active' : '');
      b.type = 'button';
      b.setAttribute('aria-label', memberName(key));
      b.title = memberName(key);
      const img = document.createElement('img');
      const p = a.profile[key] || a.profile[key.toLowerCase()];
      if (p) setImgSrc(img, p);
      img.alt = memberName(key);
      img.draggable = false;
      b.appendChild(img);
      b.addEventListener('click', () => selectMember(key));
      railEl.appendChild(b);
    });
  }

  const other = document.createElement('button');
  const otherOn = isEventFilter() ? state.eventUnit === 'other' : state.view === 'extra';
  other.className = 'other' + (otherOn ? ' is-active' : '');
  other.type = 'button';
  other.textContent = '其它';
  other.title = isEventFilter() ? '不属于单一组合的活动剧情' : '组合主线 / Memories';
  other.addEventListener('click', () => isEventFilter() ? selectEventUnit('other') : selectExtra());
  railEl.appendChild(other);
}

function renderChrome(){
  const u = unit();
  screenEl.style.setProperty('--accent', u.color);
  screenEl.style.setProperty('--accent-rgb', u.rgb);
  storyLogoEl.querySelector('use').setAttribute('href', '#' + u.icon);

  qsa('.unit').forEach(b =>
    b.classList.toggle('is-active', b.dataset.unit === u.id));
  qsa('.mode').forEach(b =>
    b.classList.toggle('is-active', state.view === 'event' && b.dataset.mode === state.kind));

  /* 电影：没有筛选对象，收起 rail */
  screenEl.classList.toggle('no-rail', state.view === 'event' && state.kind === 'movie');
}

function renderAll(withBg){
  renderChrome();
  renderBanners();
  renderRail();
  if (withBg) setBg(randomBg());
}

/* ============================================================
   交互
   ============================================================ */
function selectUnit(id){
  if (id === state.unitId && state.view === 'member') return;
  state.unitId = id;
  state.member = unit().members[0];
  state.view = 'member';
  renderAll(true);
}

function selectMember(key){
  if (state.view === 'member' && key === state.member) {
    setBg(randomBg());
    return;
  }
  state.member = key;
  state.view = 'member';
  renderAll(true);
}

function selectMode(kind){
  if (state.view === 'event' && state.kind === kind) {
    setBg(randomBg());
    return;
  }
  const wasEvent = state.view === 'event';
  state.kind = kind;
  state.view = 'event';
  if (kind !== 'movie' && !wasEvent) state.eventUnit = unit().key;
  renderAll(true);
}

/* 混活/升学里点组合 logo：既筛活动，也同步底栏与主题色 */
function selectEventUnit(key){
  if (state.eventUnit === key) { setBg(randomBg()); return; }
  state.eventUnit = key;
  if (key !== 'other') {
    const u = UNITS.find(x => x.key === key);
    if (u) state.unitId = u.id;
  }
  renderAll(true);
}

function selectExtra(){
  if (state.view === 'extra') { setBg(randomBg()); return; }
  state.view = 'extra';
  renderAll(true);
}

qsa('.unit').forEach(btn => {
  btn.addEventListener('click', () => selectUnit(btn.dataset.unit));
});

qsa('.mode').forEach(btn => {
  btn.addEventListener('click', () => selectMode(btn.dataset.mode));
});

qs('#confirmBtn').addEventListener('click', () => {
  const rec = currentItems[selIndex];
  if (!rec) { showToast('先选一段剧情', 1400); return; }
  flashEl.classList.remove('is-on');
  void flashEl.offsetWidth;
  flashEl.classList.add('is-on');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => flashEl.classList.remove('is-on'), 620);
  host.onConfirm(rec, {
    unit: unit(),
    member: state.member,
    memberName: state.view === 'member' ? memberName(state.member) : '',
    view: state.view,
    kind: state.kind,
  });
});

/* 键盘：1-5 切组合，↑↓ 切横幅，Enter 确定 */
document.addEventListener('keydown', e => {
  /* 面板没开就完全不碰键盘（播放器还要用 Esc/空格） */
  if (!host.isOpen()) return;
  /* 宿主页里可能有输入框：在输入状态下不接管按键 */
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;

  if (e.key >= '1' && e.key <= '5') {
    const u = UNITS[Number(e.key) - 1];
    if (isEventFilter()) selectEventUnit(u.key);
    else selectUnit(u.id);
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const order = currentItems.map((r, i) => (r.sep ? -1 : i)).filter(i => i >= 0);
    if (!order.length) return;
    e.preventDefault();
    const pos = Math.max(0, order.indexOf(selIndex));
    const next = order[(pos + (e.key === 'ArrowDown' ? 1 : -1) + order.length) % order.length];
    pickBanner(next, true, true);
    return;
  }
  if (e.key === 'Enter' && document.activeElement === document.body) {
    qs('#confirmBtn').click();
  }
});

/* 吐司 */
let toastTimer;
function showToast(msg, ms = 1500){
  toastEl.textContent = msg;
  toastEl.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('is-on'), ms);
}

/* 首屏：由宿主在第一次打开时调用 */
async function init(){
  await loadStory();

  const target = UNITS[0];
  state.unitId = target.id;
  state.member = target.members[0];
  state.view = 'member';

  renderChrome();
  renderBanners();
  renderRail();
  setBg(randomBg(), true);
}

return {
  init: init,
  showToast: showToast,
  getState: function () {
    return {
      unit: state.unitId, member: state.member, view: state.view, kind: state.kind,
      eventUnit: state.eventUnit, count: STORY.count, src: STORY.src,
      items: currentItems.length, selected: currentItems[selIndex] || null,
    };
  },
};
};

</script>
  <script>
/* ---- player/story.js ---- */
/**
 * 剧情面板：把 `剧情模块/` 里那套「剧情选择」搬进播放器。
 *
 * 核心逻辑在 `story.core.js`（由 tools/gen_story_kit.py 从 story-select-demo.html 生成），
 * 这个文件只管宿主这边的事：
 *   · 挂载 / 开关（点菜单「剧情」，Esc 或右上角 ✕ 关）
 *   · 剧情：酒馆里用 getWorldbook 实时读世界书；本地预览用 index.html 引入的
 *     story-data.js 快照（只是开发用的兜底，发布版不打包）
 *   · 头像 / PC 壁纸：按命名规则现场拼地址（见 buildAssets），不再存资源清单
 *   · 「确定」→ 弹一张小单子填额外要求 → 发一条【剧情启动】指令给 AI
 *
 * 依赖：boot.js 已经建好 PJSK_APP（player.root / player.setAuto / sendIntent）。
 */
(function (global) {
  'use strict';

  var app = global.PJSK_APP;

  /* 世界书名写死在这里：改名只改这一行，不用重新生成 core */
  var STORY_BOOKS = ['【live2d-pjsk】_1106'];
  // 给 boot.js 的「更多功能 → 学年人设」开关用：世界书名只留这一处
  global.PJSK_STORY_BOOKS = STORY_BOOKS;

  var wrap = null;          // .pjsdk-story（挂在 .pjsk-stage 里，1280x720 坐标系）
  var core = null;          // PJSKStoryCore 的实例
  var loadingEl = null;
  var sheet = null;
  var sheetTitle = null;
  var sheetInput = null;
  var picked = null;        // { rec, ctx }
  var openFlag = false;
  var bootP = null;         // 核心 init 的 Promise

  function stageEl() {
    return app && app.player && app.player.root.querySelector('.pjsk-stage');
  }

  /* ---------------- 资源：按命名规则现场拼，不存路径清单 ----------------
     image/pc-bg/<组合>/<组合>-<成员>-PC.png
     image/pc-bg/<组合>/<组合>-<成员>-PC-1.png … -<count>.<ext>
     头像：image/Profile/<组合>/<英文名>.webp
     数量/后缀照 剧情模块/mvu前端.txt 的 gen() 表（PC 端） */
  var IMG_BASE = 'https://raw.githubusercontent.com/Cat-organ/my-image-pjsk/refs/heads/main/image/';
  var MEMBERS = {
    ln:  { hnm: ['Honami', 14, { 12: 'webp', 13: 'webp', 14: 'webp' }], ick: ['Ichika', 21, { 20: 'webp', 21: 'webp' }],
           saki: ['Saki', 16, { 15: 'webp', 16: 'webp' }], shiho: ['Shiho', 13] },
    mmj: { airi: ['Airi', 20, { 19: 'webp', 20: 'webp' }], hrk: ['Haruka', 23],
           mnr: ['Minori', 20, { 19: 'webp', 20: 'webp' }], szk: ['Shizuku', 21, { 20: 'webp', 21: 'webp' }] },
    vbs: { akt: ['Akito', 16, { 16: 'webp' }], an: ['An', 14], khn: ['Kohane', 16], toya: ['Toya', 13] },
    ws:  { emu: ['Emu', 18], nene: ['Nene', 11], rui: ['Rui', 16], tks: ['Tsukasa', 12] },
    '25': { ena: ['Ena', 19, { 19: 'webp' }], knd: ['Kanade', 16, { 16: 'webp' }],
            mfy: ['Mafuyu', 17, { 17: 'webp' }], mzk: ['Mizuki', 22, { 22: 'webp' }] }
  };

  /** prefix.png + prefix-1.png … prefix-count.png（个别编号是 webp） */
  function gen(dir, prefix, count, exts) {
    exts = exts || {};
    var out = [IMG_BASE + dir + '/' + prefix + '.' + (exts[0] || 'png')];
    for (var i = 1; i <= count; i++) {
      out.push(IMG_BASE + dir + '/' + prefix + '-' + i + '.' + (exts[i] || 'png'));
    }
    return out;
  }

  /** core 要的 D.units[组合] = { profile, bg, allBg }，外加 defaultBg */
  function buildAssets() {
    var units = {};
    Object.keys(MEMBERS).forEach(function (u) {
      var profile = {}, bg = {}, all = [];
      Object.keys(MEMBERS[u]).forEach(function (m) {
        var row = MEMBERS[u][m];
        profile[m] = IMG_BASE + 'Profile/' + u + '/' + row[0] + '.webp';
        bg[m] = gen('pc-bg/' + u, u + '-' + m + '-PC', row[1], row[2]);
        all = all.concat(bg[m]);
      });
      units[u] = { profile: profile, bg: bg, allBg: all };
    });
    var def = [IMG_BASE + 'pc-bg/Default/pjsk-PC.jpg'];
    for (var i = 1; i <= 38; i++) def.push(IMG_BASE + 'pc-bg/Default/pjsk-PC-' + i + '.' + (i >= 33 ? 'webp' : 'png'));
    return { units: units, defaultBg: def, imgBase: IMG_BASE };
  }

  // core 只认 window.PJSK；这张表二十来行，比原来 38 KB 的路径清单小得多
  global.PJSK = buildAssets();

  /* ---------------- 挂载 ---------------- */
  function ensure() {
    if (wrap) return wrap;
    var stage = stageEl();
    if (!stage) return null;

    var tpl = document.getElementById('pjsdk-story-tpl');
    if (!tpl) {
      console.error('[pjsdk] 缺少 #pjsdk-story-tpl');
      return null;
    }

    wrap = document.createElement('div');
    wrap.className = 'pjsdk-story';

    loadingEl = document.createElement('div');
    loadingEl.className = 'pjsdk-story-loading';
    loadingEl.textContent = '正在读取剧情…';
    wrap.appendChild(loadingEl);

    wrap.appendChild(tpl.content.cloneNode(true));

    var close = document.createElement('div');
    close.className = 'pjsdk-story-close';
    close.setAttribute('role', 'button');
    close.setAttribute('tabindex', '0');
    close.setAttribute('aria-label', '关闭');
    close.title = '关闭（Esc）';
    close.addEventListener('click', function (e) {
      e.stopPropagation();
      closeStory();
    });
    wrap.appendChild(close);

    sheet = document.createElement('div');
    sheet.className = 'pjsdk-story-send';
    sheet.innerHTML =
      '<div class="pjsdk-story-send-card">'
      + '<div class="pjsdk-story-send-tip">开始剧情</div>'
      + '<div class="pjsdk-story-send-title"></div>'
      + '<textarea rows="2" placeholder="还想做些什么…（可留空，直接开始）"></textarea>'
      + '<div class="pjsdk-story-send-ops">'
      + '<button type="button" class="pjsdk-story-send-cancel">取消</button>'
      + '<button type="button" class="pjsdk-story-send-go">发送指令</button>'
      + '</div></div>';
    sheetTitle = sheet.querySelector('.pjsdk-story-send-title');
    sheetInput = sheet.querySelector('textarea');
    sheet.querySelector('.pjsdk-story-send-cancel').addEventListener('click', function (e) {
      e.stopPropagation();
      closeSheet();
    });
    sheet.querySelector('.pjsdk-story-send-go').addEventListener('click', function (e) {
      e.stopPropagation();
      launch();
    });
    // 点卡片外面也收起来
    sheet.addEventListener('click', function (e) {
      e.stopPropagation();
      if (e.target === sheet) closeSheet();
    });
    wrap.appendChild(sheet);

    // 面板自己的点击不要冒到舞台上（否则会推进剧情）
    wrap.addEventListener('click', function (e) { e.stopPropagation(); });

    stage.appendChild(wrap);
    return wrap;
  }

  function bootCore() {
    if (core) return Promise.resolve(core);
    if (bootP) return bootP;
    bootP = Promise.resolve()
      .then(function () {
        if (typeof global.PJSKStoryCore !== 'function') {
          throw new Error('story.core.js 没加载');
        }
        core = global.PJSKStoryCore({
          storyBooks: STORY_BOOKS,
          isOpen: function () { return openFlag; },
          onConfirm: showSheet,
        });
        return core.init();
      })
      .then(function () {
        if (wrap) wrap.classList.add('ready');
        return core;
      })
      .catch(function (err) {
        console.error('[pjsdk] 剧情面板初始化失败', err);
        if (loadingEl) {
          loadingEl.textContent = '剧情面板没打开：' + ((err && err.message) || err);
        }
        bootP = null;
        throw err;
      });
    return bootP;
  }

  /* ---------------- 开 / 关 ---------------- */
  function openStory() {
    if (openFlag) return;
    if (!app || !app.player) return;
    if (!ensure()) return;

    openFlag = true;
    wrap.classList.add('open');

    // 打开时暂停自动播放：一边看面板一边推进剧情没意义。
    // 不写回 localStorage，关掉面板后也不会自己恢复。
    try {
      if (app.player.auto) app.player.setAuto(false);
    } catch (e) {}

    bootCore().catch(function () {
      /* 错误已经写到 loadingEl 上了 */
    });
  }

  function closeStory() {
    if (!openFlag) return;
    openFlag = false;
    closeSheet();
    if (wrap) {
      wrap.classList.remove('open');
      // 输入框留着内容也没用，关掉就清干净
      if (sheetInput) sheetInput.value = '';
      var active = document.activeElement;
      if (active && wrap.contains(active) && active.blur) active.blur();
    }
  }

  /* ---------------- 「确定」之后的确认单 ---------------- */
  function showSheet(rec, ctx) {
    if (!rec || !sheet) return;
    picked = { rec: rec, ctx: ctx };
    sheetTitle.textContent = titleOf(rec, ctx);
    sheetInput.value = '';
    sheet.classList.add('open');
    setTimeout(function () { sheetInput.focus(); }, 30);
  }

  function closeSheet() {
    if (!sheet) return;
    sheet.classList.remove('open');
    picked = null;
  }

  /** 拼一个给 AI 看的完整剧情名：组合 + 成员 + 箱数 + 标题 */
  function titleOf(rec, ctx) {
    var box = rec.box ? rec.box + '「' + rec.name + '」' : rec.name;
    if (ctx && ctx.view === 'member' && ctx.memberName) {
      return ctx.unit.name + ' ' + ctx.memberName + '：' + box;
    }
    if (ctx && ctx.view === 'extra') {
      return ctx.unit.name + '：' + box;
    }
    return rec.box ? rec.box + '：' + rec.name : rec.name;
  }

  /** 和 mvu 前端一致的那段系统指令 */
  var SYSTEM_NOTE = '<!-- 系统指令：现在正式开始上面指定的剧情章节。请根据角色设定和剧情背景展开叙事。'
    + '在下一回合的输出中将情节导向剧情线并按照事件推进。 并在story标签内正确填写本次剧情的'
    + '[角色罗马音]+[箱数]：[指定剧情名]; [话数/集数]：[本话名字] ,部分特殊活动如主线故事或混活等，'
    + '则直接填写[活动类型]：[指定剧情名]; [话数/集数]：[本话名字] -->';

  function intentText(title, desc, extra) {
    var lines = ['【剧情启动】', '指定剧情【' + title + '】'];
    if (extra) lines.push('用户行动："' + extra + '"');
    lines.push('');
    if (desc) lines.push('【剧情简介】', desc, '');
    lines.push(SYSTEM_NOTE);
    return lines.join('\n');
  }

  function launch() {
    if (!picked) return;
    var extra = (sheetInput.value || '').trim();
    var text = intentText(titleOf(picked.rec, picked.ctx), picked.rec.desc, extra);
    var btn = sheet.querySelector('.pjsdk-story-send-go');
    btn.disabled = true;

    var done = function (ok) {
      btn.disabled = false;
      if (!ok) return;
      closeSheet();
      closeStory();
    };

    if (app && typeof app.sendIntent === 'function') {
      app.sendIntent(text).then(done, function () { done(false); });
      return;
    }
    // 兜底：极老的宿主没有 sendIntent
    if (typeof global.triggerSlash === 'function') {
      global.triggerSlash('/send ' + text.replace(/\|/g, '｜') + ' | /trigger');
      done(true);
      return;
    }
    btn.disabled = false;
    if (core) core.showToast('本地预览：没接酒馆，这条指令没有发出去', 2200);
  }

  global.PJSK_STORY_UI = {
    open: openStory,
    close: closeStory,
    isOpen: function () { return openFlag; },
    /** Esc：先收确认单，再关面板。返回 true 表示这一下被吃掉了 */
    escape: function () {
      if (!openFlag) return false;
      if (sheet && sheet.classList.contains('open')) {
        closeSheet();
        return true;
      }
      closeStory();
      return true;
    },
    debug: function () {
      return {
        open: openFlag,
        ready: !!(wrap && wrap.classList.contains('ready')),
        core: core ? core.getState() : null,
        picked: picked ? titleOf(picked.rec, picked.ctx) : '',
      };
    },
  };
})(window);

</script>
