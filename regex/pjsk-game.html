  /** 事件头像（Profile 圆图）；万一挂了自己摘掉，别留空壳挡在地点上 */
  function eventAvatar(n) {
    var c = app.charByNum[n];
    var img = document.createElement('img');
    img.src = profileUrl(n);
    img.alt = c.name;
    img.title = c.name;
    img.addEventListener('error', function () { img.remove(); });
    return img;
  }

  /** 把本轮掷出的事件画出来：主地图的胶囊 + 面板行右侧的白块（先清掉上一轮的） */
  function renderMapEvents() {
    mapEventByPlace = {};
    Array.prototype.forEach.call(mapEl.querySelectorAll('.pjsdk-map-event-anchor'), function (el) {
      el.remove();
    });
    Array.prototype.forEach.call(mapEl.querySelectorAll('.pjsdk-place-row__faces'), function (el) {
      el.textContent = '';
    });
    var roll = rollMapEvents();
    app.mapEvents = roll;       // 调试 / 测试直接看 PJSK_APP.mapEvents（含面板地点）
    roll.forEach(function (ev) {
      mapEventByPlace[ev.id] = ev.chars;
      if (ev.extra) {
        // 面板行：头像填进行右侧的白块
        var row = mapEl.querySelector('.pjsdk-place-row[data-place-id="' + ev.id + '"]');
        if (!row) return;
        var faces = row.querySelector('.pjsdk-place-row__faces');
        ev.chars.forEach(function (n) { faces.appendChild(eventAvatar(n)); });
        return;
      }
      var place = mapEl.querySelector('.pjsdk-map-place[data-place-id="' + ev.id + '"]');
      if (!place) return;
      // 外层 anchor 负责居中（flex），内层才是胶囊——结构原因见 index.html 的注释
      var anchor = document.createElement('div');
      anchor.className = 'pjsdk-map-event-anchor';
      var bubble = document.createElement('div');
      bubble.className = 'pjsdk-map-event';
      ev.chars.forEach(function (n) { bubble.appendChild(eventAvatar(n)); });
      anchor.appendChild(bubble);
      place.appendChild(anchor);
    });
  }

  /* ── 前往弹窗 ──
   * 输入「去这里做什么」，确认后发一条用户消息：
   *   <!--用户决定前往【地点】区域 -->
   *   （用户输入，可空）
   * 带事件的地点多一段「(A)和(B)也在这里，设计一个随机偶遇事件」。
   * 酒馆助手环境走 createChatMessages + /trigger；本地预览没有这些全局函数，
   * 只弹提示不发送——app.onMapPlace / pjsdk:place 照样触发，功能层不受影响。
   */
  function ensurePlaceDialog() {
    if (mapDialog) return mapDialog;
    mapDialog = document.createElement('div');
    mapDialog.className = 'pjsdk-map-modal';

    var dialog = document.createElement('div');
    dialog.className = 'pjsdk-map-dialog';

    mapDialogTitle = document.createElement('div');
    mapDialogTitle.className = 'pjsdk-map-dialog-title';

    mapDialogWho = document.createElement('div');
    mapDialogWho.className = 'pjsdk-map-dialog-who';

    mapDialogInput = document.createElement('input');
    mapDialogInput.type = 'text';
    mapDialogInput.className = 'pjsdk-map-dialog-input';
    mapDialogInput.placeholder = '要去这里做什么？（可以不填）';
    mapDialogInput.addEventListener('keydown', function (e) {
      e.stopPropagation();
      if (e.key === 'Enter') confirmPlaceDialog();
    });

    var actions = document.createElement('div');
    actions.className = 'pjsdk-map-dialog-actions';

    var cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'pjsdk-map-dialog-cancel';
    cancel.textContent = '取消';
    cancel.addEventListener('click', function (e) {
      e.stopPropagation();
      closePlaceDialog();
    });

    var go = document.createElement('button');
    go.type = 'button';
    go.className = 'pjsdk-map-dialog-go';
    go.textContent = '出发';
    go.addEventListener('click', function (e) {
      e.stopPropagation();
      confirmPlaceDialog();
    });

    actions.appendChild(cancel);
    actions.appendChild(go);
    dialog.appendChild(mapDialogTitle);
    dialog.appendChild(mapDialogWho);
    dialog.appendChild(mapDialogInput);
    dialog.appendChild(actions);
    mapDialog.appendChild(dialog);

    // 点背景 = 取消；弹窗里其它点击都拦住，别漏到地图/舞台上
    mapDialog.addEventListener('click', function (e) {
      e.stopPropagation();
      if (e.target === mapDialog) closePlaceDialog();
    });

    mapEl.appendChild(mapDialog);
    return mapDialog;
  }

  function openPlaceDialog(p) {
    ensurePlaceDialog();
    var chars = mapEventByPlace[p.id] || [];
    var names = chars.map(function (n) { return app.charByNum[n].name; });
    mapDialogCtx = { place: p, names: names };
    mapDialogTitle.textContent = p.name;
    if (names.length) {
      mapDialogWho.textContent = '';
      chars.forEach(function (n) { mapDialogWho.appendChild(eventAvatar(n)); });
      var line = document.createElement('span');
      line.textContent = joinNames(names) + ' 也正在这个区域';
      mapDialogWho.appendChild(line);
      mapDialogWho.classList.add('show');
    } else {
      mapDialogWho.classList.remove('show');
    }
    mapDialogInput.value = '';
    mapDialog.classList.add('open');
    setTimeout(function () { mapDialogInput.focus(); }, 0);
  }

  function closePlaceDialog() {
    if (mapDialog) mapDialog.classList.remove('open');
    mapDialogCtx = null;
  }

  function confirmPlaceDialog() {
    if (!mapDialogCtx) return;
    var ctx = mapDialogCtx;
    var text = mapDialogInput.value.trim();
    var msg = mapIntentPrompt(ctx.place.name, ctx.names);
    if (text) msg += '\n' + text;
    var detail = {
      id: ctx.place.id,
      name: ctx.place.name,
      file: ctx.place.file,
      text: text,
      chars: ctx.names.length ? ctx.names : null,
    };
    // 功能层入口：确认了才算「决定前往」，点开弹窗不算
    mapEl.dispatchEvent(new CustomEvent('pjsdk:place', { detail: detail, bubbles: true }));
    if (typeof app.onMapPlace === 'function') app.onMapPlace(detail.name, detail);
    sendMapIntent(msg);
    closePlaceDialog();
    closeMap();
  }

  /**
   * 发进酒馆：写入一条用户消息并触发生成。地图的「前往」和剧情的「开始剧情」共用。
   * 返回 Promise<boolean>：发出去了 true，本地预览/失败 false（失败会自己 toast）。
   */
  function sendIntent(text, okMsg) {
    // 酒馆助手：createChatMessages 建用户楼层（字段是 message，不是 content——
    // 写成 content 会建出空楼层，2026-11-02 实测踩过）+ /trigger 触发生成
    if (typeof global.createChatMessages === 'function' && typeof global.triggerSlash === 'function') {
      return Promise.resolve()
        .then(function () { return global.createChatMessages([{ role: 'user', message: text }]); })
        .then(function () { return global.triggerSlash('/trigger'); })
        .then(function () {
          mapToast(okMsg || '已发送，等 AI 演下一轮…');
          return true;
        })
        .catch(function (err) {
          console.error('[pjsdk] 指令发送失败', err);
          mapToast('发送失败：' + ((err && err.message) || err));
          return false;
        });
    }
    // 老环境兜底（【前端】开场白.html 的用法）：只有 triggerSlash 就走斜杠管线。
    // 管线按 | 切分，文本里的半角竖线换成全角，避免把指令切断
    if (typeof global.triggerSlash === 'function') {
      global.triggerSlash('/send ' + text.replace(/\|/g, '｜') + ' | /trigger');
      mapToast(okMsg || '已发送，等 AI 演下一轮…');
      return Promise.resolve(true);
    }
    console.warn('[pjsdk] 不在酒馆环境，这条指令没有发送：', text);
    mapToast('本地预览：未接入酒馆，这条指令没有发送');
    return Promise.resolve(false);
  }

  function sendMapIntent(text) {
    sendIntent(text);
  }

  /** 舞台顶部的小气泡提示（挂在舞台层，地图关掉也看得见） */
  function mapToast(text) {
    var stage = app.player && app.player.root.querySelector('.pjsk-stage');
    if (!stage) return;
    var el = document.createElement('div');
    el.className = 'pjsdk-toast';
    el.textContent = text;
    stage.appendChild(el);
    setTimeout(function () { el.classList.add('gone'); }, 2400);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2900);
  }

  function ensureMap(player) {
    if (mapEl) return mapEl;

      if (p.y < 220) place.classList.add('hi');

      place.addEventListener('click', function (e) {

    // ── 更多地点：右下角按钮 + 模糊背景 + 右侧面板（两组选项卡，行=地点+头像白块）──

    moreBtn = document.createElement('button');

    moreBtn.innerHTML =
      '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
      '<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>' +
      '<span>更多地点</span>';
    moreBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleMore();

    morePanel = document.createElement('div');
    morePanel.className = 'pjsdk-map-more-panel';
    var tabs = document.createElement('div');
    tabs.className = 'pjsdk-map-more-tabs';
    var listWrap = document.createElement('div');
    listWrap.className = 'pjsdk-map-more-lists';
    var flat = 0;   // EXTRA_PLACE_LIST 与 EXTRA_PLACES 同序，顺手取摊平项
    EXTRA_PLACES.forEach(function (g, gi) {
      var tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'pjsdk-map-more-tab' + (gi === 0 ? ' on' : '');
      tab.dataset.group = String(gi);
      tab.textContent = g.group;
      tab.addEventListener('click', function (e) {
        e.stopPropagation();
        Array.prototype.forEach.call(tabs.querySelectorAll('.pjsdk-map-more-tab'), function (t) {
          t.classList.toggle('on', t === tab);
        });
        Array.prototype.forEach.call(morePanel.querySelectorAll('.pjsdk-map-more-list'), function (l) {
          l.classList.toggle('on', l.dataset.group === tab.dataset.group);
        });
      });
      tabs.appendChild(tab);

      var list = document.createElement('div');
      list.className = 'pjsdk-map-more-list' + (gi === 0 ? ' on' : '');
      list.dataset.group = String(gi);
      g.names.forEach(function (name, ni) {
        var p = EXTRA_PLACE_LIST[flat++];
        var row = document.createElement('button');
        row.type = 'button';
        row.className = 'pjsdk-place-row';
        row.dataset.placeId = p.id;
        row.dataset.place = p.name;
        row.setAttribute('aria-label', '前往' + p.name);
        var tape = document.createElement('span');
        tape.className = 'pjsdk-place-row__tape';
        tape.textContent = p.name;
        var faces = document.createElement('span');
        faces.className = 'pjsdk-place-row__faces';
        row.appendChild(tape);
        row.appendChild(faces);
        row.addEventListener('click', function (e) {
          e.stopPropagation();
          openPlaceDialog(p);
        });
        list.appendChild(row);
      });
      listWrap.appendChild(list);
    });
    morePanel.appendChild(tabs);
    morePanel.appendChild(listWrap);

    mapEl.appendChild(canvas);
    mapEl.appendChild(close);
    mapEl.appendChild(moreBackdrop);
    mapEl.appendChild(moreBtn);
    mapEl.appendChild(morePanel);
    // 地图上的点击一律不往下传，否则会顺手推进剧情
    mapEl.addEventListener('click', function (e) { e.stopPropagation(); });

    // Esc：先关前往弹窗，再收更多地点面板，最后关地图（菜单/记录有自己的 Esc 处理）
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' || !mapEl.classList.contains('open')) return;
      if (mapDialog && mapDialog.classList.contains('open')) {
        e.stopPropagation();
        closePlaceDialog();
      } else if (morePanel.classList.contains('open')) {
        e.stopPropagation();
        closeMore();
      } else {
        closeMap();
      }
    });

    player.root.querySelector('.pjsk-stage').appendChild(mapEl);
    return mapEl;
  }

  /* ---------------- 好感面板（螺旋记事本） ----------------
   * 菜单第四个按钮。打开时：
   *   1. 对话框收起来（连 AUTO 一起，面板是模态的）
   *   2. 背景走播放器原生的 BackGroundBlur(44) —— 只糊背景，人还是清楚的
   *   3. 台上的人清空，左侧换成本轮登场过的**随机一个**角色（大图、站在左边）
   *   4. 右侧滑出一本螺旋笔记本，纸上写四个成员的头像 / 名字 / 好感条 / 数值
   * 关掉时按打开前的快照把台上的人还原（见 affRestoreStage）。
   *
   * 好感数据来自 MVU 变量，读法照工作区根目录的 mvu-1029：
   *   当前楼层的 message.data.stat_data → Mvu.getMvuData() → getVariables()
   * 认得的形状（从前往后找，先命中的先用）：
   *   stat_data.affection      = { 一歌: 60, 遥: 65 }      ← 最常见
   *   stat_data.team.members   = { 一歌: 60, ... }
   *   stat_data.角色.一歌.好感度 = 60                       ← 嵌套一层也行
   *   stat_data.好感度          = "一歌:60; 遥:65"          ← 紧凑字符串
   * 值可以带说明（"65/100"、"65（今天涨了）"、[65, '备注'] 都只取前面的数字）。
   */

  // 组合：编号段直接复用 PROFILE_UNITS 的分法（1-4 ln、5-8 mmj …），
  // 颜色是游戏的应援色，图标在 index.html 的 <!-- @aff-kit --> 里（ps-* symbol）
  var AFF_UNITS = [
    { sym: 'ps-ln',  color: '#4455dd', name: 'Leo/need',             from: 1,  to: 4  },
    { sym: 'ps-mmj', color: '#88dd44', name: 'MORE MORE JUMP!',      from: 5,  to: 8  },
    { sym: 'ps-vbs', color: '#ee1166', name: 'Vivid BAD SQUAD',      from: 9,  to: 12 },
    { sym: 'ps-wxs', color: '#ff9900', name: 'Wonderlands×Showtime', from: 13, to: 16 },
    { sym: 'ps-25ji', color: '#884499', name: '25時、ナイトコードで。', from: 17, to: 20 },
  ];
  var AFF_KEY = /好感|亲密度|affection|favor|lik(e|ing)/i;   // 「这一层就是 名字->好感」
  var AFF_MAP_KEY = /^(members?|成员|角色|chars?|characters?)$/i;

  var affEl = null;
  var affUnit = 0;
  var affData = {};          // charId -> 数值
  var affSource = '';        // 数据从哪儿读到的（调试/提示用）
  var affMsg = '';           // 纸上那句提示
  var affRound = {};         // 本轮登场过的 charId（名字前点个小圆点）
  var affPick = 0;           // 左侧站着的角色
  var affAutoBefore = false; // 打开前是不是自动播放
  var affDlgHidden = false;  // 打开前对话框是不是本来就收着
  var affBlurBefore = false; // 打开前背景本来就是模糊的
  var affCloseTimer = 0;
  var affSeq = 0;            // 每次开关 +1：异步登场回来时先对一下票
  var affSnap = [];          // 打开前台上亮着的人（关掉时按这个还原）

  /** 酒馆助手的函数可能在 window 上，也可能挂在 TavernHelper 上 */
  function thApi(name) {
    try {
      if (typeof global[name] === 'function') return global[name];
      if (global.TavernHelper && typeof global.TavernHelper[name] === 'function') {
        return global.TavernHelper[name].bind(global.TavernHelper);
      }
    } catch (e) {}
    return null;
  }

  /** MVU 的叶子可能是 [值, 说明] / {value: 值} / "65" / 65，统一取个数字出来 */
  function affNum(v) {
    if (Array.isArray(v)) v = v[0];
    if (v && typeof v === 'object') {
      if (v.value != null) v = v.value;
      else if (v.好感 != null) v = v.好感;
      else if (v.好感度 != null) v = v.好感度;
    }
    if (v === null || v === undefined || v === '') return null;
    var m = String(v).replace(/[，,]/g, '').match(/-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }

  /** "一歌:60; 遥:65" / "一歌：60、遥 65" 这种紧凑写法 */
  function affFromText(text, out) {
    String(text).split(/[;；\n]/).forEach(function (item) {
      var m = item.split(/[:：]/);
      if (m.length < 2) return;
      var n = affNum(m.slice(1).join(':'));
      if (n !== null && !(m[0].trim() in out)) out[m[0].trim()] = n;
    });
  }

  /** 从一个「角色对象」里挖好感：{ 好感度: 60 } / { affection: [60, '说明'] } */
  function affValueOf(node) {
    if (!node || typeof node !== 'object' || Array.isArray(node)) return affNum(node);
    var keys = Object.keys(node);
    for (var i = 0; i < keys.length; i++) {
      if (!AFF_KEY.test(keys[i])) continue;
      var n = affNum(node[keys[i]]);
      if (n !== null) return n;
    }
    return null;
  }

  /**
   * 在变量树里找「名字 -> 好感」，深度最多 3 层（再深就不像好感表了）：
   *   · 键名带好感 / members / 角色 → 这一层的子键就是人名
   *   · 子键的值是对象且自己带好感键 → 这个子键就是人名
   *   · 键名带好感、值是字符串 → 按 "一歌:60; 遥:65" 切
   */
  function affCollect(out, node, depth) {
    if (!node || typeof node !== 'object' || depth > 3) return;
    Object.keys(node).forEach(function (k) {
      var v = node[k];
      if (Array.isArray(v) && v.length === 1) v = v[0];      // MVU 叶子 [值]
      if (typeof v === 'string') {
        if (AFF_KEY.test(k)) affFromText(v, out);
        return;
      }
      if (!v || typeof v !== 'object') return;
      if (AFF_KEY.test(k) || AFF_MAP_KEY.test(k)) {
        // 这一层就是表：{ 一歌: 60, 遥: [65, '今天涨了'] }
        Object.keys(v).forEach(function (n) {
          var num = affValueOf(v[n]);
          if (num !== null && !(n in out)) out[n] = num;
        });
        return;
      }
      // 角色对象：{ 一歌: { 好感度: 60 } }，键就是人名
      var own = affValueOf(v);
      if (own !== null && !(k in out)) out[k] = own;
      affCollect(out, v, depth + 1);
    });
  }

  /** 名字 -> charId：走 config.js 的别名表（一歌 / 星乃一歌 / ichika 都认） */
  function affCharId(name) {
    var n = String(name || '')
      .replace(/[（(][^）)]*[）)]/g, '')        // 去掉括号备注
      .replace(/好感度?|亲密度/g, '')
      .trim();
    var dir = resolveDir(n);
    if (!dir && n !== String(name || '').trim()) dir = resolveDir(String(name || '').trim());
    var c = dir && app.charMap[dir];
    return c ? c.charId : 0;
  }

  /** 名字表 -> { charId: 数值 }（认不出的名字直接丢掉） */
  function affMapByName(names) {
    var out = {};
    Object.keys(names).forEach(function (n) {
      var id = affCharId(n);
      if (id && !(id in out)) out[id] = names[n];
    });
    return out;
  }

  /** 当前楼层号；拿不到就 -1（酒馆里 getChatMessages 认负数 = 从最后往前数） */
  function affFloor() {
    var id = null;
    try {
      var g = thApi('getCurrentMessageId');
      if (g) id = g();
    } catch (e) {}
    if (id === undefined || id === null || isNaN(id)) {
      try {
        var l = thApi('getLastMessageId');
        if (l) id = l();
      } catch (e) {}
    }
    return typeof id === 'number' ? id : -1;
  }

  /** 一层 stat_data -> { charId: 数值 } */
  function affMapOf(stat) {
    var names = {};
    if (stat) affCollect(names, stat, 0);
    return affMapByName(names);
  }

  /** 读某一层的 MVU 变量表：三层兜底，返回 stat_data（或整张表） */
  async function affReadStat(msgId) {
    if (msgId === undefined || msgId === null) msgId = affFloor();

    // 1) 当前楼层消息里的 data.stat_data（mvu-1029 的读法，最通用）
    var getMsgs = thApi('getChatMessages');
    if (getMsgs) {
      try {
        var msgs = await getMsgs(msgId);
        var d = msgs && msgs[0] && msgs[0].data;
        if (d && (d.stat_data || d.display_data)) {
          affSource = '楼层变量';
          return d.stat_data || d.display_data;
        }
      } catch (e) {}
    }

    // 2) mvu 变量框架自己的接口
    try {
      if (global.Mvu && typeof global.Mvu.getMvuData === 'function') {
        var mv = global.Mvu.getMvuData({ type: 'message', message_id: msgId });
        if (mv && mv.stat_data) { affSource = 'Mvu.getMvuData'; return mv.stat_data; }
      }
    } catch (e) {}

    // 3) 变量表（有的世界书直接把好感写在聊天变量里）
    var getVars = thApi('getVariables') || thApi('getAllVariables');
    if (getVars) {
      try {
        var v = await getVars({ type: 'message', message_id: msgId });
        if (!v) v = await getVars();
        if (v) { affSource = '变量表'; return v.stat_data || v; }
      } catch (e) {}
    }
    return null;
  }

  /**
   * 上一轮（= 当前楼层之前、最近一层带好感数据的楼层）的好感表。
   * 顺带说一句为什么不用「当前值 - 聊天变量」：MVU 的变量是按楼层存的快照，
   * 只有楼层之间做差才是「这一轮涨了多少」。
   */
  async function affPrevMap(curId) {
    if (curId > 0) {
      var getMsgs = thApi('getChatMessages');
      if (getMsgs) {
        try {
          var msgs = await getMsgs('0-' + (curId - 1));
          for (var i = (msgs || []).length - 1; i >= 0; i--) {
            var d = msgs[i] && msgs[i].data;
            var m = affMapOf(d && (d.stat_data || d.display_data));
            if (Object.keys(m).length) return m;
          }
        } catch (e) {}
      }
      // Mvu 框架兜底：一层层往前问
      if (global.Mvu && typeof global.Mvu.getMvuData === 'function') {
        for (var k = curId - 1; k >= Math.max(1, curId - 8); k--) {
          try {
            var mv = global.Mvu.getMvuData({ type: 'message', message_id: k });
            var m2 = affMapOf(mv && mv.stat_data);
            if (Object.keys(m2).length) return m2;
          } catch (e) {}
        }
      }
    }
    return {};
  }

  async function affLoad() {
    affSource = '';
    var stat = await affReadStat();
    var map = affMapOf(stat);
    var keys = Object.keys(map);
    if (!keys.length) {
      affMsg = stat
        ? '变量里还没有好感数据（stat_data.affection）。'
        : '没读到酒馆变量，好感是空的——本地预览时正常。';
    } else {
      affMsg = '';
    }
    affData = map;
    return map;
  }

  /** 本轮登场过的角色（登场记录里带服装和动作，够 left 那张大图用了） */
  function affRoundList() {
    var out = [];
    var seen = {};
    ((app.scenario && app.scenario.LayoutData) || []).forEach(function (l) {
      if (!l || l.Type !== 2 || !l.Character2dId || !l.CostumeType) return;
      if (seen[l.Character2dId]) return;
      seen[l.Character2dId] = 1;
      out.push({
        id: l.Character2dId,
        costume: l.CostumeType,
        motion: l.MotionName || '',
        facial: l.FacialName || '',
      });
    });
    return out;
  }

  function affUnitOf(num) {
    for (var i = 0; i < AFF_UNITS.length; i++) {
      if (num >= AFF_UNITS[i].from && num <= AFF_UNITS[i].to) return i;
    }
    return -1;
  }

  /** 头像：Profile 圆图；配角 / 虚拟歌手没有图就用首字 */
  function affFace(num, name) {
    var url = profileUrl(num);
    var el;
    if (url) {
      el = document.createElement('img');
      el.className = 'pjsdk-aff-face';
      el.alt = '';
      el.src = url;
      el.addEventListener('error', function () {
        var d = document.createElement('div');
        d.className = 'pjsdk-aff-face';
        d.style.cssText = 'display:flex;align-items:center;justify-content:center;'
          + 'font-size:40px;color:#8a879b;font-weight:700;';
        d.textContent = (name || '?').charAt(0);
        if (el.parentNode) el.parentNode.replaceChild(d, el);
      });
      return el;
    }
    el = document.createElement('div');
    el.className = 'pjsdk-aff-face';
    el.style.cssText = 'display:flex;align-items:center;justify-content:center;'
      + 'font-size:40px;color:#8a879b;font-weight:700;';
    el.textContent = (name || '?').charAt(0);
    return el;
  }

  function affRow(num, unit) {
    var c = app.charByNum[num] || { name: String(num) };
    var val = affData[num];
    var has = typeof val === 'number' && isFinite(val);

    var row = document.createElement('div');
    row.className = 'pjsdk-aff-row' + (has ? '' : ' is-empty');
    row.dataset.char = String(num);
    row.style.setProperty('--c', unit.color);
    row.appendChild(affFace(num, c.name));

    var main = document.createElement('div');
    main.className = 'pjsdk-aff-main';

    var head = document.createElement('div');
    head.className = 'pjsdk-aff-head';

    var name = document.createElement('div');
    name.className = 'pjsdk-aff-charname' + (affRound[num] ? ' is-round' : '');
    name.textContent = c.name;
    head.appendChild(name);

    var value = document.createElement('div');
    value.className = 'pjsdk-aff-val';
    value.textContent = has ? String(Math.round(val)) : '—';
    head.appendChild(value);

    var bar = document.createElement('div');
    bar.className = 'pjsdk-aff-bar';
    var fill = document.createElement('i');
    bar.appendChild(fill);
    // 下一帧再写宽度，CSS 过渡才会从 0 涨上来
    var pct = has ? Math.max(0, Math.min(100, val)) : 0;
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(function () { fill.style.width = pct + '%'; });
    } else {
      fill.style.width = pct + '%';
    }

    main.appendChild(head);
    main.appendChild(bar);
    row.appendChild(main);
    return row;
  }

  function renderAff() {
    if (!affEl) return;
    var unit = AFF_UNITS[affUnit] || AFF_UNITS[0];

    var btns = affEl.querySelectorAll('.pjsdk-aff-unit');
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', i === affUnit ? 'true' : 'false');
    }

    // 右侧竖排组合名：字体自动缩到放得下（最长的 25 时那行）
    var wm = affEl.querySelector('.pjsdk-aff-name');
    wm.textContent = unit.name;
    wm.classList.add('is-on');
    wm.style.fontSize = '92px';
    var avail = wm.clientHeight;
    var need = wm.scrollHeight;
    if (avail && need > avail) wm.style.fontSize = Math.max(40, 92 * avail / need) + 'px';

    var lines = affEl.querySelector('.pjsdk-aff-lines');
    while (lines.firstChild) lines.removeChild(lines.firstChild);
    for (var n = unit.from; n <= unit.to; n++) {
      if (!app.charByNum[n]) continue;
      lines.appendChild(affRow(n, unit));
    }

    var msg = affEl.querySelector('.pjsdk-aff-note-msg');
    msg.textContent = affMsg;
    msg.classList.toggle('show', !!affMsg);
  }

  function affSelect(idx) {
    if (idx === affUnit) return;
    affUnit = idx;
    renderAff();
  }

  /** 左侧那张大图：把某个模型钉在舞台左侧（大一点、露出上半身） */
  function affPinChar(stage, id) {
    if (!stage) return;
    var sc = null;
    try { sc = stage.chars && stage.chars.get(id); } catch (e) {}
    var d = sc ? sc.cm.display : null;
    if (!d) {
      var kids = stage.charLayer && stage.charLayer.children;
      if (!kids || !kids.length) return;
      d = kids[kids.length - 1];
    }
    var b = d.getLocalBounds && d.getLocalBounds();
    if (b && b.height) d.scale.set(stage.h * 2.06 / b.height);
    d.position.set(stage.w * 0.248, stage.h * 0.768);
  }

  /** 台上清空，把 pick 这位请到左边（openAff 已经挑好了） */
  async function affShowChar(pick) {
    var sess = app.player && app.player.session;
    if (!sess || !sess.stage) return;
    var stage = sess.stage;
    var seq = ++affSeq;
    stage.hideAll();
    if (!pick) return;

    try {
      // 先把模型建好再登场：否则 appear 里的 fitModel 要等异步加载完成，
      // 那一下会先按默认站位亮一帧再跳到左边
      await stage.loadCostume(pick.costume, pick.id);
    } catch (e) {}
    if (seq !== affSeq) return;   // 期间面板被关掉了

    var p = stage.appear(pick.id, pick.costume, 3, 0, pick.motion, pick.facial);
    // appear 对「已经建好的模型」是同步放好位置的，这里立刻改坐标；
    // 模型若是新建的，淡入那几帧里逐帧再钉一次，避免看到跳位
    affPinChar(stage, pick.id);
    var stop = false;
    (function tick() {
      if (stop) return;
      affPinChar(stage, pick.id);
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
    })();
    try { await p; } catch (e) {}
    stop = true;
    if (seq === affSeq) affPinChar(stage, pick.id);
  }

  /** 打开面板前先记一份快照：谁亮着、穿什么、站哪边 */
  function affSnapshot() {
    var stage = affStage();
    var out = [];
    if (!stage) return out;
    stage.chars.forEach(function (sc, id) {
      if (sc.cm.opacity > 0.05) out.push({ id: id, costume: sc.costume, side: sc.side });
    });
    return out;
  }

  /** 关掉面板时按快照把台上还原（先全收，再一个个请回来） */
  function affRestoreStage(snap) {
    var stage = affStage();
    if (!stage) return;
    stage.hideAll();
    (snap || []).forEach(function (c) {
      var info = app.charByNum[c.id];
      var motion = (info && info.defaultMotion) || '';
      try {
        // 用 defaultMotion 摆回中立站姿：比原样留着上一个动作更像「本来就站在这儿」
        stage.appear(c.id, c.costume, c.side, 0, motion, 'face_normal_01');
      } catch (e) {}
    });
  }

  function affStage() {
    return (app.player && app.player.session && app.player.session.stage) || null;
  }

  /**
   * 收/放对话框。隐藏时额外压一条行内样式：
   * 台词要是正好在这时候开演，DialogueBox.show() 会把 .hidden 摘掉，
   * 行内样式优先级更高，面板开着就一定看不到对话框。
   */
  function affSetDialogue(hidden) {
    var d = app.player && app.player.root.querySelector('.pjsk-dialogue');
    if (!d) return;
    if (hidden) {
      d.classList.add('hidden');
      d.style.opacity = '0';
    } else {
      d.style.opacity = '';
      d.classList.remove('hidden');
    }
  }

  function openAff() {
    closeMenu();
    closeMap();
    closeLog();
    closeStory();
    if (!app.player) return;
    if (affCloseTimer) { clearTimeout(affCloseTimer); affCloseTimer = 0; }

    ensureAff(app.player);

    // 本轮登场过的人（名字前的小圆点 + 默认选中他所在的组合）
    affRound = {};
    var list = affRoundList();
    list.forEach(function (c) { affRound[c.id] = 1; });
    // 左边站谁：本轮登场的人里随机挑一个（尽量别跟上次重复），
    // 默认打开的也是他所在的组合——纸上的人和纸上的人对得上
    var pool = list.length > 1 ? list.filter(function (c) { return c.id !== affPick; }) : list;
    var pick = pool.length ? pool[(Math.random() * pool.length) | 0] : null;
    affPick = pick ? pick.id : 0;
    var u = affUnitOf(affPick);
    affUnit = u >= 0 ? u : 0;

    // 面板是模态的：先把自动播放停掉，免得剧情在纸后面换人
    affAutoBefore = !!app.player.auto;
    if (affAutoBefore) app.player.setAuto(false);

    var dlg = app.player.root.querySelector('.pjsk-dialogue');
    affDlgHidden = !!(dlg && dlg.classList.contains('hidden'));
    affSetDialogue(true);

    favorHide();
    var stage = affStage();
    affSnap = affSnapshot();
    affBlurBefore = !!(stage && stage.bgBlur);
    if (stage) stage.setBackgroundBlur(true);

    affData = {};
    affMsg = '正在读取好感…';
    // 先 display:block 再画：纸上的字要量高度（竖排组合名要缩到放得下）
    affEl.classList.add('open');
    renderAff();
    // 下一帧再加 .in：display:none → block 的同一帧加过渡类，动画不会触发
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(function () {
        if (affEl.classList.contains('open')) affEl.classList.add('in');
      });
    } else {
      affEl.classList.add('in');
    }

    void affLoad().then(function () {
      if (affEl && affEl.classList.contains('open')) renderAff();
    });
    void affShowChar(pick);
  }

  function closeAff() {
    if (!affEl || !affEl.classList.contains('open')) return;
    affSeq++;
    affEl.classList.remove('in');
    affCloseTimer = setTimeout(function () {
      affCloseTimer = 0;
      if (affEl && !affEl.classList.contains('in')) affEl.classList.remove('open');
    }, 460);

    affRestoreStage(affSnap);
    var stage = affStage();
    if (stage && !affBlurBefore) stage.setBackgroundBlur(false);
    if (affDlgHidden) {
      var dlg = app.player.root.querySelector('.pjsk-dialogue');
      if (dlg) dlg.style.opacity = '';   // 本来就收着：保留 .hidden，只撤兜底样式
    } else {
      affSetDialogue(false);
    }
    if (affAutoBefore) app.player.setAuto(true);
    affAutoBefore = false;
  }

  function ensureAff(player) {
    if (affEl) return affEl;
    affEl = document.createElement('div');
    affEl.className = 'pjsdk-aff';

    var sheet = document.createElement('div');
    sheet.className = 'pjsdk-aff-sheet';

    var note = document.createElement('div');
    note.className = 'pjsdk-aff-note';

    var units = document.createElement('div');
    units.className = 'pjsdk-aff-units';
    AFF_UNITS.forEach(function (u, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pjsdk-aff-unit';
      b.dataset.unit = String(i);
      b.style.setProperty('--c', u.color);
      b.setAttribute('aria-label', u.name);
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true">'
        + '<use href="#' + u.sym + '"/></svg>';
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        affSelect(i);
      });
      units.appendChild(b);
    });

    var wm = document.createElement('span');
    wm.className = 'pjsdk-aff-name';
    wm.setAttribute('aria-hidden', 'true');

    var lines = document.createElement('div');

    var msg = document.createElement('div');
    msg.className = 'pjsdk-aff-note-msg';

    var close = document.createElement('div');
    close.className = 'pjsdk-aff-close';
    close.setAttribute('role', 'button');
    close.setAttribute('tabindex', '0');
    close.setAttribute('aria-label', '关闭好感面板');

    note.appendChild(units);
    note.appendChild(wm);
    note.appendChild(lines);

    note.appendChild(close);
    note.insertAdjacentHTML('beforeend',
      '<svg class="pjsdk-aff-rings" aria-hidden="true">'
      + '<rect width="105" height="100%" fill="url(#pjsdkNoteRing)"/></svg>');
    // 纸上的点击不往下传：舞台的「点一下进一句」不能被打断
    note.addEventListener('click', function (e) { e.stopPropagation(); });

    sheet.appendChild(note);
    affEl.appendChild(sheet);
    // 纸外面（左侧人物区）点一下 = 关掉
    affEl.addEventListener('click', function (e) {
      e.stopPropagation();
      closeAff();
    });

    player.root.querySelector('.pjsk-stage').appendChild(affEl);
    return affEl;
  }

  /* ---------------- 好感变更卡 ----------------
   * 这一轮的好感和「上一轮」不一样时，在轮到该角色说话的那一下，从对话区右边
   * 浮出一张小牌子：头像 + 爱心 + 「+3」（样式迁自工作区根目录 favor-demo.html）。
   *
   * 「上一轮」怎么算：MVU 的变量是按楼层存的快照，所以拿当前楼层往前找最近一层
   * 带好感数据的楼（affPrevMap）做差，而不是跟聊天变量比——后者已经是这一轮的值了。
   * 差值 0 的人不弹；本轮同一个人只弹一次（真弹过之后 favorShown 记一笔）。
   */
  var favorEl = null;
  var favorDeltas = {};      // charId -> 本轮变化量
  var favorShown = {};       // 本轮已经弹过的人
  var favorTimer = 0;        // 自动收起
  var favorOut = 0;          // 收完把 display 关掉
  var favorLoaded = false;

  /** 分身的 Character2dId（2101）折算回本体（21）；路人不算 */
  function favorBaseId(id) {
    if (!id) return 0;
    if (id >= 2100) return Math.floor(id / 100);
    if (id <= 26) return id;
    return 0;
  }

  function favorEnsure() {
    if (favorEl) return favorEl;
    favorEl = document.createElement('div');
    favorEl.className = 'pjsdk-favor';
    favorEl.innerHTML =
      '<svg class="pjsdk-favor__deco" viewBox="0 0 89 333" aria-hidden="true">'
      + '<circle cx="10" cy="21" r="10"/><circle cx="10" cy="56" r="10"/>'
      + '<circle cx="10" cy="100" r="10"/><circle cx="10" cy="146" r="10"/>'
      + '<circle cx="10" cy="192" r="10"/><circle cx="10" cy="234" r="10"/>'
      + '<circle cx="10" cy="282" r="10"/><circle cx="10" cy="323" r="10"/>'
      + '<circle cx="47.5" cy="17" r="15"/><circle cx="47.5" cy="67" r="15"/>'
      + '<circle cx="47.5" cy="117" r="15"/><circle cx="47.5" cy="166" r="15"/>'
      + '<circle cx="47.5" cy="211" r="15"/><circle cx="47.5" cy="262" r="15"/>'
      + '<circle cx="47.5" cy="315" r="15"/>'
      + '<circle cx="75.5" cy="39.5" r="13"/><circle cx="75.5" cy="90.5" r="13"/>'
      + '<circle cx="75.5" cy="140.5" r="13"/><circle cx="75.5" cy="192.5" r="13"/>'
      + '<circle cx="75.5" cy="240.5" r="13"/><circle cx="75.5" cy="292.5" r="13"/>'
      + '</svg>'
      + '<span class="pjsdk-favor__tab">好感增加</span>'
      + '<span class="pjsdk-favor__card">'
      + '<span class="pjsdk-favor__avatar"><img alt=""></span>'
      + '<svg class="pjsdk-favor__heart" viewBox="0 0 146 128" aria-hidden="true">'
      + '<path d="M73 12C66 2 54 0 44 0C22 0 0 16 0 44C0 74 28 96 73 127'
      + 'C118 96 146 74 146 44C146 16 124 0 102 0C92 0 80 2 73 12Z"/></svg>'
      + '<b class="pjsdk-favor__value">+1</b>'
      + '</span>';
    app.player.root.querySelector('.pjsk-stage').appendChild(favorEl);
    return favorEl;
  }

  /** 头像：Profile 圆图；没有（虚拟歌手）就退成首字 */
  function favorFace(el, id) {
    var av = el.querySelector('.pjsdk-favor__avatar');
    var url = profileUrl(id);
    var c = app.charByNum[id];
    var name = (c && c.name) || '';
    while (av.firstChild) av.removeChild(av.firstChild);
    if (!url) {
      var s = document.createElement('span');
      s.className = 'pjsdk-favor__initial';
      s.textContent = name ? name.charAt(0) : '?';
      av.appendChild(s);
      return;
    }
    var img = document.createElement('img');
    img.alt = '';
    img.src = url;
    img.addEventListener('error', function () {
      if (!img.parentNode) return;
      var d = document.createElement('span');
      d.className = 'pjsdk-favor__initial';
      d.textContent = name ? name.charAt(0) : '?';
      img.parentNode.replaceChild(d, img);
    });
    av.appendChild(img);
  }

  function favorHide() {
    if (favorTimer) { clearTimeout(favorTimer); favorTimer = 0; }
    if (!favorEl) return;
    favorEl.classList.remove('in');
    if (favorOut) clearTimeout(favorOut);
    favorOut = setTimeout(function () {
      favorOut = 0;
      if (favorEl && !favorEl.classList.contains('in')) favorEl.classList.remove('show');
    }, 300);
  }

  /** 弹一张：正数是「好感增加」，负数是「好感减少」 */
  function favorShow(id, delta) {
    if (!delta || !app.player) return;
    var el = favorEnsure();
    var up = delta > 0;
    var abs = Math.abs(delta);
    var num = (abs % 1 ? abs.toFixed(1) : String(abs));
    el.classList.toggle('down', !up);
    el.querySelector('.pjsdk-favor__tab').textContent = up ? '好感增加' : '好感减少';
    el.querySelector('.pjsdk-favor__value').textContent = (up ? '+' : '-') + num;
    favorFace(el, id);

    if (favorOut) { clearTimeout(favorOut); favorOut = 0; }
    el.classList.add('show');
    el.classList.remove('in');
    // 两帧后再加 .in：display:none → inline-flex 那一帧加过渡类不会触发动画
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        if (favorEl && favorEl.classList.contains('show')) favorEl.classList.add('in');
      });
    });
    if (favorTimer) clearTimeout(favorTimer);
    favorTimer = setTimeout(favorHide, 2600);
  }

  /** 轮到某人说话时调用：这一轮他涨了/掉了，而且还没弹过 → 弹一张 */
  function favorMaybeShow(id) {
    var base = favorBaseId(id);
    if (!base || !favorDeltas[base] || favorShown[base]) return;
    favorShown[base] = 1;
    favorShow(base, favorDeltas[base]);
  }

  /** 算出这一轮各角色的好感变化（当前楼层 - 上一轮楼层） */
  async function favorLoad() {
    var cur = affFloor();
    var now = affMapOf(await affReadStat(cur));
    var before = await affPrevMap(cur);
    var out = {};
    Object.keys(now).forEach(function (k) {
      if (!(k in before)) return;   // 上一轮还没有这个人：不当成「涨了」
      var d = Math.round((now[k] - before[k]) * 10) / 10;
      if (d) out[k] = d;
    });
    favorDeltas = out;
    favorShown = {};
    favorLoaded = true;
    // 读得慢、第一句已经在说了：补一张（这个人是刚开口的）
    if (app.speakingId) favorMaybeShow(app.speakingId);
    return out;
  }

  function favorReset() {
    favorShown = {};
    favorHide();
  }

  function openLog() {
    closeMenu();
    closeMap();
    closeAff();
    closeStory();
    if (!app.player) return;
    ensureLog(app.player);

    var list = logEl.querySelector('.pjsdk-log-list');
    while (list.firstChild) list.removeChild(list.firstChild);
    var rows = seenTalks();
    if (!rows.length) {
      var empty = document.createElement('div');
      empty.className = 'pjsdk-log-empty';
      empty.textContent = '还没有台词';
      list.appendChild(empty);
    } else {
      for (var i = 0; i < rows.length; i++) list.appendChild(logRow(rows[i], goToTalk));
    }

    logEl.classList.add('open');
    list.scrollTop = list.scrollHeight;   // 停在最新一句
  }

  /** 从记录里跳回某一句：面板先收起，再把时间轴倒回那句继续演 */
  function goToTalk(entry) {
    var p = app.player;
    if (!p || !entry || !(entry.snippet >= 0)) return;
    closeLog();
    closeMenu();
    closeMorePanel();
    p.jumpTo(entry.snippet);
  }

  function ensureLog(player) {
    if (logEl) return logEl;
    logEl = document.createElement('div');
    logEl.className = 'pjsdk-log';
    logEl.innerHTML = '<div class="pjsdk-log-close" role="button" aria-label="关闭"></div>'
      + '<div class="pjsdk-log-list"></div>';
    // 记录里的点击（选中文字、拖滚动条）不能冒到舞台的「推进」上
    logEl.addEventListener('click', function (e) { e.stopPropagation(); });
    logEl.querySelector('.pjsdk-log-close').addEventListener('click', function (e) {
      e.stopPropagation();
      closeLog();
    });
    player.root.querySelector('.pjsk-stage').appendChild(logEl);
    return logEl;
  }

  /** 重演这一轮：从第 0 个片段重新跑一遍 */
  function replay() {
    closeMenu();
    closeLog();
    closeAff();
    closeMap();
    closeStory();
    favorReset();
    // 重播要重新读一遍这一楼：选项可能被选过，也可能是刚手改过的文本。
    // 收口后的正文只剩一支，另一支在 extra 里——先拼回来再播。
    var text = readFromTavern() || readEmbedded() || app.rawText;
    if (text && /<game>/i.test(text)) {
      var full = text;
      if (global.PJSK_BRANCH) {
        global.PJSK_BRANCH.askAgain();
        full = global.PJSK_BRANCH.expand(text) || text;
      }
      void play(full, '重播');
      return;
    }
    var p = app.player;
    if (!p || !p.session) return;
    var inner = p.session.player;
    // jumpTo 要求 run() 已经把模型预载完（finished 才有值），否则只能重新 play
    if (inner && inner.finished) { p.jumpTo(0); return; }
    if (!p.session.started) void p.play();
  }

  /* ---------------- 跳过：直接跳到这一轮的最后一句 ----------------
   * 跳过 ≠ 快进。这里是把时间轴直接挪到本轮的最后一个片段（player.jumpTo），
   * 落点就是最后那句台词——想回头看完就开【记录】，那时候 progressIndex 已经在末尾，
   * 整轮的台词都记进去了。没有用 setFast，因为快进还要等它演完，反而更慢。
   */
  var skipEl = null;        // 「跳过对话？」确认单

  function ensureSkip() {
    if (skipEl) return skipEl;
    skipEl = document.createElement('div');
    skipEl.className = 'pjsdk-confirm';
    skipEl.innerHTML =
      '<div class="pjsdk-confirm-card">'
      + '<div class="pjsdk-confirm-title">跳过对话？</div>'
      + '<div class="pjsdk-confirm-text">直接跳到这一轮的最后一句话。<br>'
      + '没看的台词都在【记录】里，随时可以翻。</div>'
      + '<div class="pjsdk-confirm-ops">'
      + '<button type="button" class="pjsdk-confirm-cancel">取消</button>'
      + '<button type="button" class="pjsdk-confirm-ok">跳过</button>'
      + '</div></div>';
    // 弹窗里的点击一律拦住：冒到舞台上会变成「推进一句」
    skipEl.addEventListener('click', function (e) {
      e.stopPropagation();
      if (e.target === skipEl) closeSkip();
    });
    skipEl.querySelector('.pjsdk-confirm-cancel').addEventListener('click', function (e) {
      e.stopPropagation();
      closeSkip();
    });
    skipEl.querySelector('.pjsdk-confirm-ok').addEventListener('click', function (e) {
      e.stopPropagation();
      closeSkip();
      doSkip();
    });
    var stage = app.player && app.player.root.querySelector('.pjsk-stage');
    (stage || document.body).appendChild(skipEl);
    return skipEl;
  }

  /** 这一轮最后一个片段的下标；还没编译出剧本时是 -1 */
  /** 最后一个「有台词」的片段。跳过要停在这句，不能停在收尾的结束横幅上 */
  function lastSnippet() {
    var scn = app.scenario;
    if (!scn || !scn.Snippets) return -1;
    for (var i = scn.Snippets.length - 1; i >= 0; i--) {
      if (scn.Snippets[i].Action === ACTION_TALK) return i;
    }
    return scn.Snippets.length - 1;
  }

  function askSkip() {
    closeMenu();
    var p = app.player;
    if (!p || !p.session) return;
    var last = lastSnippet();
    if (last < 0) return;
    if (app.progressIndex >= last) { mapToast('已经在最后一句了'); return; }
    ensureSkip().classList.add('open');
  }

  function closeSkip() {
    if (skipEl) skipEl.classList.remove('open');
  }

  function doSkip() {
    var p = app.player;
    if (!p || !p.session) return;
    var inner = p.session.player;
    var last = lastSnippet();
    hideHint();
    closeMenu();
    if (last < 0 || app.progressIndex >= last) { mapToast('已经在最后一句了'); return; }
    // jumpTo 要求 run() 已经把模型预载完（finished 有值），否则只能干等
    if (!inner || !inner.finished) { mapToast('模型还在准备，稍等一下'); return; }
    p.jumpTo(last);
    mapToast('已跳到最后一句话');
  }

  /* ---------------- 更多功能：学年人设（🗓︎一学年 / 二学年） ----------------
   * 世界书里带「🗓︎一学年」「🗓︎二学年」的条目平时是关着的；打开之后 AI 才会按那一年的
   * 经历来演（也就是「三周年人设」那套）。开启任一学年时顺带把「🗓︎(升学后)学生信息」
   * 打开、把「🗓︎(开服时) 学生信息」关掉；两个学年都关就反过来——跟 mvu-1029 里一致。
   */
  var moreEl = null;
  var WB_YEARS = [
    { key: '一学年', desc: '一周年剧情线' },
    { key: '二学年', desc: '二周年剧情线' },
  ];
  var WB_INFO_AFTER = '(升学后)学生信息';      // 任一学年开着 → 用这本
  var WB_INFO_START = '(开服时)学生信息';      // 全关 → 用这本
  var wbState = {};        // 学年 -> true / false / 'loading' / 'missing' / 'noapi'
  var wbCount = {};        // 学年 -> 条目数
  var wbErr = '';

  /** 世界书名跟剧情面板共用一份（story.js 顶部那个 STORY_BOOKS） */
  function wbBook() {
    var b = global.PJSK_STORY_BOOKS;
    return (b && b[0]) || '【live2d-pjsk】_1106';
  }

  /** 条目名归一化：去掉日历 emoji / 变体选择符，抹平空格、下划线与全角括号 */
  function wbNorm(text) {
    return String(text == null ? '' : text)
      .replace(/🗓[\uFE0E\uFE0F]?/g, '')
      .replace(/[\uFE0E\uFE0F]/g, '')
      .replace(/[（(]/g, '(')
      .replace(/[）)]/g, ')')
      .replace(/[～~]/g, '~')
      .replace(/[\s_]+/g, '')
      .trim();
  }

  function wbEntries(wb) {
    return (wb || []).filter(function (e) { return e && typeof e.name === 'string'; });
  }

  /** 某一学年的全部条目：先按「🗓︎+学年」匹配，一条都没有再按归一化名开头找 */
  function wbYearList(wb, year) {
    var re = new RegExp('🗓[\\uFE0E\\uFE0F]?' + year);
    var strict = wbEntries(wb).filter(function (e) { return re.test(e.name); });
    if (strict.length) return strict;
    return wbEntries(wb).filter(function (e) { return wbNorm(e.name).indexOf(year) === 0; });
  }

  function wbFind(wb, title) {
    var key = wbNorm(title);
    var list = wbEntries(wb);
    for (var i = 0; i < list.length; i++) if (wbNorm(list[i].name) === key) return list[i];
    for (var j = 0; j < list.length; j++) if (wbNorm(list[j].name).indexOf(key) >= 0) return list[j];
    return null;
  }

  async function wbSave(name, wb) {
    var replace = thApi('replaceWorldbook');
    if (replace) { await replace(name, wb); return; }
    var update = thApi('updateWorldbookWith');
    if (update) { await update(name, function () { return wb; }); return; }
    throw new Error('世界书写入接口不可用');
  }

  function ensureMore() {
    if (moreEl) return moreEl;
    moreEl = document.createElement('div');
    moreEl.className = 'pjsdk-more';
    moreEl.innerHTML =
      '<div class="pjsdk-more-card">'
      + '<div class="pjsdk-more-title">更多功能</div>'
      + '<div class="pjsdk-more-sub">学年人设：开启后由世界书里「一学年 / 二学年」的那组条目'
      + '替换现在的学生信息，AI 会按那一年的经历来演。</div>'
      + WB_YEARS.map(function (y) {
        return '<div class="pjsdk-more-row" data-year="' + y.key + '">'
          + '<div class="pjsdk-more-label">' + y.key + '人设<small>' + y.desc + '</small></div>'
          + '<button type="button" class="pjsdk-switch" role="switch" aria-checked="false"'
          + ' aria-label="' + y.key + '人设"></button>'
          + '</div>';
      }).join('')
      + '<div class="pjsdk-more-note"></div>'
      + '<div class="pjsdk-more-ops"><button type="button" class="pjsdk-more-close">关闭</button></div>'
      + '</div>';
    // 面板里的点击一律拦住，别冒到舞台上推进剧情
    moreEl.addEventListener('click', function (e) {
      e.stopPropagation();
      if (e.target === moreEl) closeMorePanel();
    });
    moreEl.querySelector('.pjsdk-more-close').addEventListener('click', function (e) {
      e.stopPropagation();
      closeMorePanel();
    });
    [].slice.call(moreEl.querySelectorAll('.pjsdk-more-row[data-year]')).forEach(function (row) {
      row.querySelector('.pjsdk-switch').addEventListener('click', function (e) {
        e.stopPropagation();
        wbToggle(row.getAttribute('data-year'), row.querySelector('.pjsdk-switch'));
      });
    });

    var stage = app.player && app.player.root.querySelector('.pjsk-stage');
    (stage || document.body).appendChild(moreEl);
    return moreEl;
  }

  function moreNote(text) {
    if (!moreEl) return;
    moreEl.querySelector('.pjsdk-more-note').textContent = text || '';
  }

  function moreRender() {
    if (!moreEl) return;
    WB_YEARS.forEach(function (y) {
      var row = moreEl.querySelector('.pjsdk-more-row[data-year="' + y.key + '"]');
      if (!row) return;
      var btn = row.querySelector('.pjsdk-switch');
      var small = row.querySelector('small');
      var st = wbState[y.key];
      var on = st === true;
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-checked', on ? 'true' : 'false');
      btn.disabled = (st === 'loading' || st === 'missing' || st === 'noapi');
      var n = wbCount[y.key] || 0;
      small.textContent = st === 'loading' ? '读取中…'
        : st === 'missing' ? '世界书里没有这一年的条目'
        : st === 'noapi' ? '不在酒馆里（本地预览改不了）'
        : (on ? '已启用 · ' : '未开启 · ') + y.desc + (n ? '（' + n + ' 条）' : '');
    });
    moreNote(wbErr);
  }

  /** 读一遍世界书，把两个开关的真实状态摆上去 */
  async function wbRefresh() {
    var getWb = thApi('getWorldbook');
    var name = wbBook();
    if (!getWb) {
      WB_YEARS.forEach(function (y) { wbState[y.key] = 'noapi'; });
      wbErr = '没读到酒馆助手的世界书接口——本地预览时正常，进酒馆才能开关。';
      moreRender();
      return;
    }
    WB_YEARS.forEach(function (y) { wbState[y.key] = 'loading'; });
    wbErr = '';
    moreRender();
    try {
      var wb = await getWb(name);
      if (!wb || !wb.length) {
        WB_YEARS.forEach(function (y) { wbState[y.key] = 'missing'; });
        wbErr = '世界书「' + name + '」是空的，或者书不叫这个名字。';
        moreRender();
        return;
      }
      WB_YEARS.forEach(function (y) {
        var list = wbYearList(wb, y.key);
        wbCount[y.key] = list.length;
        wbState[y.key] = list.length ? list.some(function (e) { return !!e.enabled; }) : 'missing';
      });
      moreRender();
    } catch (e) {
      WB_YEARS.forEach(function (y) { wbState[y.key] = 'noapi'; });
      wbErr = '读世界书失败：' + ((e && e.message) || e);
      moreRender();
    }
  }

  async function wbToggle(year, btn) {
    if (!year) return;
    var getWb = thApi('getWorldbook');
    if (!getWb) { wbErr = '不在酒馆里，改不了世界书。'; moreRender(); return; }
    var name = wbBook();
    var on = wbState[year] !== true;
    if (btn) { btn.disabled = true; btn.classList.add('busy'); }
    wbErr = '';
    try {
      var wb = await getWb(name);
      var list = wbYearList(wb, year);
      if (!list.length) {
        wbState[year] = 'missing';
        wbErr = '世界书「' + name + '」里没找到「' + year + '」的条目。';
        moreRender();
        return;
      }
      var changed = false;
      list.forEach(function (e) {
        if (!!e.enabled !== on) { e.enabled = on; changed = true; }
      });
      if (changed) await wbSave(name, wb);

      // 联动学生信息：任一学年开着 → (升学后)；全关 → (开服时)
      var anyOn = WB_YEARS.some(function (y) {
        return wbYearList(wb, y.key).some(function (e) { return !!e.enabled; });
      });
      var linkChanged = false;
      [[WB_INFO_AFTER, anyOn], [WB_INFO_START, !anyOn]].forEach(function (pair) {
        var e = wbFind(wb, pair[0]);
        if (e && !!e.enabled !== pair[1]) { e.enabled = pair[1]; linkChanged = true; }
      });
      if (linkChanged) await wbSave(name, wb);

      var msg = on
        ? '已开启' + year + '人设：' + list.length + ' 条已启用，学生信息切到「升学后」。'
        : '已关闭' + year + '人设：' + list.length + ' 条已停用'
          + (anyOn ? '。' : '，学生信息切回「开服时」。');
      // 先重读一遍把开关状态刷成真实值，再把这句话写回去（wbRefresh 会清空 wbErr）
      await wbRefresh();
      wbErr = msg;
      moreNote(wbErr);
    } catch (e) {
      wbErr = '切换失败：' + ((e && e.message) || e);
      moreRender();
      moreNote(wbErr);
    } finally {
      if (btn) { btn.classList.remove('busy'); btn.disabled = false; }
      moreRender();
    }
  }

  function openMore() {
    closeMenu();
    closeSkip();
    ensureMore().classList.add('open');
    void wbRefresh();
  }

  // 注意别叫 closeMore：地图那边的「更多地点」面板已经用了这个名字，
  // 同名函数会被后声明的覆盖掉，closeMap 就关不掉它了
  function closeMorePanel() {
    if (moreEl) moreEl.classList.remove('open');
  }

  /* ---------------- 剧情条：这一轮在演哪条剧情线（左下角） ----------------
   * 值来自 MVU 的 stat_data.story，也就是 AI 写在 <story> 标签里的那一行：
   *   ick一箱：叩响未来！！; 第一话：征兆
   * 没进剧情时是「无; 当前未进入事件」，这时候整条不显示。
   */
  var storyEl = null;

  function ensureStory() {
    if (storyEl) return storyEl;
    storyEl = document.createElement('div');
    storyEl.className = 'pjsdk-storychip';
    storyEl.innerHTML = '<span class="pjsdk-storychip-k">剧情</span>'
      + '<span class="pjsdk-storychip-name"></span>'
      + '<span class="pjsdk-storychip-ch"></span>';
    var stage = app.player && app.player.root.querySelector('.pjsk-stage');
    (stage || document.body).appendChild(storyEl);
    return storyEl;
  }

  function storyHide() {
    if (storyEl) storyEl.classList.remove('show');
  }

  function storyShow(raw) {
    var v = String(raw == null ? '' : raw).replace(/\s+/g, ' ').trim();
    if (!v || /^无\b/.test(v) || /^无[;；]/.test(v)) { storyHide(); return; }
    var parts = v.split(/[;；]/);
    var name = String(parts.shift() || '').trim();
    var ch = parts.join('；').trim();
    if (!name || name === '无') { storyHide(); return; }
    var el = ensureStory();
    el.querySelector('.pjsdk-storychip-name').textContent = name;
    el.querySelector('.pjsdk-storychip-ch').textContent = ch;
    el.classList.add('show');
  }

  /** 从 stat_data 里挖 story：顶层没有就往下找一层（MVU 偶尔挂在分支里） */
  function storyOf(stat) {
    if (!stat || typeof stat !== 'object') return '';
    var v = stat.story;
    if (v === undefined) v = stat.剧情;
    if (v === undefined) {
      var keys = Object.keys(stat);
      for (var i = 0; i < keys.length; i++) {
        var n = stat[keys[i]];
        if (n && typeof n === 'object' && !Array.isArray(n)) {
          if (n.story !== undefined) { v = n.story; break; }
          if (n.剧情 !== undefined) { v = n.剧情; break; }
        }
      }
    }
    if (Array.isArray(v)) v = v[0];                      // MVU 叶子 [值, 说明]
    if (v && typeof v === 'object' && v.value != null) v = v.value;
    if (v == null) return '';
    return String(v);
  }

  /** 读当前楼层，更新左下角那条 */
  async function storyLoad() {
    try {
      var stat = await affReadStat();
      storyShow(storyOf(stat));
    } catch (e) {
      storyHide();
    }
  }

  /* ---------------- 左上角地点牌（借图场景） ----------------
   * -scene：宫益坂公司 前台处(显示：酒店大厅)- 这种写法，画面用的是别处的图。
   * 光靠中间那条横幅，玩家很容易把画面里的「酒店大厅」当成剧情地点，所以
   * 借图场景在左上角**常驻**一块地点牌，写真实地点名，一直挂到换下一个场景。
   *
   * 这块归 boot.js 管，不用播放器自带的 PlaceInfo：那个是转场用的，播完第一句
   * 就收（onFinishTalkWindow -> hidePlace），要的是「整段都在」。
   */
  var placeEl = null;
  var placeTextEl = null;
  var placeShown = '';

  function mountPlacePlate(player) {
    var stage = player.root.querySelector('.pjsk-stage');
    if (!stage || placeEl) return;
    placeEl = document.createElement('div');
    placeEl.className = 'pjsdk-place';
    placeTextEl = document.createElement('div');
    placeTextEl.className = 'pjsdk-place-text';
    placeEl.appendChild(placeTextEl);
    stage.appendChild(placeEl);
  }

  /** 按播放进度刷新：取「已经播到」的最后一条场景标记 */
  function updatePlacePlate(index) {
    if (!placeEl) return;
    var marks = (app.scenario && app.scenario.SceneMarks) || [];
    var cur = null;
    for (var i = 0; i < marks.length; i++) if (marks[i].At <= index) cur = marks[i];
    // 只有借图才挂：正常场景画面就是地点本身，再挂一块反而多余
    var name = cur && cur.Borrowed ? String(cur.Name || '') : '';
    if (!name) {
      if (placeEl.classList.contains('on')) {
        placeEl.classList.remove('on');
        placeShown = '';
      }
      return;
    }
    if (name === placeShown && placeEl.classList.contains('on')) return;
    placeShown = name;
    placeTextEl.textContent = name;
    // 长地名缩字号（跟播放器 PlaceInfo 一样单行放得下，26.67 -> 12）
    placeTextEl.style.fontSize = '';
    for (var fs = 26.67; fs > 12 && placeTextEl.scrollWidth > placeTextEl.clientWidth; fs -= 0.5) {
      placeTextEl.style.fontSize = fs + 'px';
    }
    placeEl.classList.add('on');
  }

  function resetPlacePlate() {
    placeShown = '';
    if (placeEl) placeEl.classList.remove('on');
  }

  /* ---------------- 挥手动作收招 ----------------
   * 播放器播动作是「播一遍、停在最后一帧」：挥手这种开合大的动作会一直举着手，
   * 后面两句不是他在说的时候特别出戏。
   *
   * **只对挥手（shakehand）收招**。别的动作（点头、抱臂、歪头……）收回去反而
   * 像在罚站——玩家也习惯让角色保持那个姿势，所以一律不动。
   *
   * 不能用 motionBusy() 判「演完了」：pjsk 的 clip 普遍带一条 20 秒的保持尾帧
   * （w-happy-shakehand01 实际只演 0~2.6s，之后一直举着手到 22.6s），
   * 管理器会认为它还在播。所以按「真演出」的时长定时。
   * 统计了素材里 7783 个 motion3：95% 在 3.0s 内演完，99% 在 3.35s，最长 3.97s。
   */
  var POSE_RESET_RE = /shakehand/i;   // 只有挥手系列收招
  var POSE_HOLD_MS = 3600;            // 挥手真演出的时长
  // 淡回中立的时长（引擎单位）。引擎的淡入计时跟观感有压缩：
  // 实测 1.2 -> 0.54s、2.5 -> 1.02s、4 -> 1.37s，差不多 0.27 秒/单位。
  // 3.6 大约就是**看得见的 1.3 秒**慢慢放下手，比原来 0.5s 的「啪一下」自然。
  var POSE_FADE_SEC = 3.6;
  var poseToken = {};

  function armPoseReset(charId, index) {
    var m = motionAt(charId, index);
    if (!POSE_RESET_RE.test(m)) return;   // 不是挥手：保持原样
    var stage = affStage();
    var info = app.charByNum[charId];
    var neutral = info && info.defaultMotion;
    var sc = stage && stage.chars && stage.chars.get(charId);
    if (!neutral || !sc) return;
    var cm = sc.cm;
    var token = (poseToken[charId] || 0) + 1;   // 下一句一开口，上一批就作废
    poseToken[charId] = token;
    setTimeout(function () {
      if (poseToken[charId] !== token) return;
      if (!cm || cm.opacity <= 0.02) return;    // 人已经下场：不用管，下次登场会摆好
      // 空动作 = 回到中立；用自己写的淡入，`cm.play()` 写死 0.5s 慢不下来
      if (!playFade(cm, neutral, POSE_FADE_SEC)) {
        try { cm.play(neutral, ''); } catch (e) {}
      }
    }, POSE_HOLD_MS);
  }

  /**
   * 这个角色在这一条片段上用的动作名。
   * 往前找最近一条给他设动作的片段（最多翻 8 条）：
   *   Talk 的 Motions / ChangeMotion 的 LayoutData / 登场的 Apper。
   * 登场句的动作挂在 Apper 上（台词那份是空的），所以要往前翻。
   */
  function motionAt(charId, index) {
    var scn = app.scenario;
    if (!scn || !scn.Snippets) return '';
    var from = Math.max(0, index - 8);
    for (var i = index; i >= from; i--) {
      var s = scn.Snippets[i];
      if (!s) continue;
      var name = '';
      if (s.Action === 1) {
        var ms = (scn.TalkData[s.ReferenceIndex] || {}).Motions || [];
        for (var k = 0; k < ms.length; k++) {
          if (ms[k].Character2dId === charId) { name = ms[k].MotionName || ''; break; }
        }
      } else if (s.Action === 4) {
        var l4 = scn.LayoutData[s.ReferenceIndex];
        if (l4 && l4.Character2dId === charId) name = l4.MotionName || '';
      } else if (s.Action === 2) {
        var l2 = scn.LayoutData[s.ReferenceIndex];
        if (l2 && l2.Character2dId === charId && l2.Type === 2) name = l2.MotionName || '';
      }
      if (name) return name;
    }
    return '';
  }

  /**
   * 用指定淡入时长切到某个动作。
   * 播放器的 `cm.play()` 会把 fadeIn 写死成 0.5s（同一条 0.125s），
   * 这里照它的做法自己起一次，只把淡入时长换掉。
   */
  function playFade(cm, name, sec) {
    try {
      var internal = cm.display.internalModel;
      var pmm = internal.parallelMotionManager;
      var idx = cm.motionIdx && cm.motionIdx.get(name);
      if (!pmm || !pmm[1] || idx == null) return false;
      // 动作对象要从**这条并行轨自己的** manager 上取：它跟主 manager 各自
      // 缓存一份（extendParallelMotionManager），设错对象的话时长生效不了。
      var mgr = pmm[1].manager || internal.motionManager;
      var groups = (mgr && mgr.motionGroups) || (internal.motionManager && internal.motionManager.motionGroups);
      var motion = groups && groups.Motion && groups.Motion[idx];
      if (!motion) return false;
      var st = pmm[1].state;
      // 真正决定「退回去有多快」的是**旧动作的淡出时长**：起新动作时，
      // 引擎用旧动作自己的 FadeOutTime 把它淡掉（素材里普遍 0.5s），
      // 光改新动作的 FadeIn 没用——实测改到 3s 也是 0.6s 就落定。
      if (st.currentGroup === 'Motion' && st.currentIndex != null) {
        var prev = groups && groups.Motion && groups.Motion[st.currentIndex];
        if (prev) prev.setFadeOutTime(sec);
      }
      motion.setFadeInTime(sec);                  // 必须在 startMotion 之前设
      if (st.currentGroup === 'Motion' && st.currentIndex === idx) st.reset();
      pmm[1].startMotion('Motion', idx, 3);       // MotionPriority.FORCE
      return true;
    } catch (e) {
      return false;
    }
  }

  /** 动作行（ChangeMotion）作用在谁身上：引用的是 LayoutData */
  function motionChangeChar(index) {
    var scn = app.scenario;
    var s = scn && scn.Snippets && scn.Snippets[index];
    if (!s || s.Action !== 4) return -1;
    var l = scn.LayoutData[s.ReferenceIndex];
    return l ? l.Character2dId : -1;
  }

  function mountMenu(player) {
    var stage = player.root.querySelector('.pjsk-stage');
    if (!stage) return;

    // 素材地址是构建期才定下来的，两张 UI 图通过 CSS 变量传进去
    player.root.style.setProperty('--pjsdk-circle', 'url("' + ASSET + 'ui/button_circle_h80.png")');
    player.root.style.setProperty('--pjsdk-dots', 'url("' + ASSET + 'ui/icon_menu_story.png")');

    menuBackdrop = document.createElement('div');
    menuBackdrop.className = 'pjsdk-menu-backdrop';
    menuBackdrop.addEventListener('click', function (e) {
      e.stopPropagation();
      closeMenu();
    });

    menuBtn = document.createElement('button');
    menuBtn.type = 'button';
    menuBtn.className = 'pjsdk-menu';
    menuBtn.title = '菜单';
    menuBtn.setAttribute('aria-label', '菜单');
    menuBtn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (menuPanel.classList.contains('open')) closeMenu();
      else openMenu();
    });

    fullBtn = document.createElement('button');
    fullBtn.type = 'button';
    fullBtn.className = 'pjsdk-full';

    fullBtn.setAttribute('aria-label', '全屏');
    fullBtn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      toggleFull();
    });

    menuPanel = document.createElement('div');
    menuPanel.className = 'pjsdk-menu-panel';
    // 里面再包一层：留白放内层，面板本体才能真的 height:0 收干净
    menuPanel.innerHTML =
      '<div class="pjsdk-menu-inner">'
      + '<div class="pjsdk-menu-close" role="button" tabindex="0" aria-label="关闭"></div>'
      + '<button type="button" class="pjsdk-menu-btn" data-k="replay">'
      + '<i class="pjsdk-menu-ic play"></i><span>重新播放</span></button>'
      + '<button type="button" class="pjsdk-menu-btn" data-k="story">'
      + '<i class="pjsdk-menu-ic story"></i><span>剧情</span></button>'
      + '<button type="button" class="pjsdk-menu-btn" data-k="map">'
      + '<i class="pjsdk-menu-ic map"></i><span>地图</span></button>'
      + '<button type="button" class="pjsdk-menu-btn" data-k="aff">'
      + '<i class="pjsdk-menu-ic aff"></i><span>好感</span></button>'
      + '<div class="pjsdk-menu-row">'
      + '<button type="button" class="pjsdk-menu-btn pjsdk-menu-sq" data-k="log">'
      + '<i class="pjsdk-menu-ic log"></i><span>记录</span></button>'
      + '<button type="button" class="pjsdk-menu-btn pjsdk-menu-sq" data-k="skip">'
      + '<i class="pjsdk-menu-ic skip"></i><span>跳过</span></button>'
      + '<button type="button" class="pjsdk-menu-btn pjsdk-menu-sq" data-k="more">'
      + '<i class="pjsdk-menu-ic more"></i><span>更多</span></button>'
      + '</div>'
      + '<div class="pjsdk-menu-speed">'
      + '<div class="pjsdk-menu-speed-label">播放速度</div>'
      + '<div class="pjsdk-menu-chips">'
      + SPEEDS.map(function (v) {
        return '<button type="button" class="pjsdk-chip" data-v="' + v + '">' + v + '×</button>';
      }).join('')
      + '</div></div>'
      + '</div>';

    // 面板里的点击一律不往下传（否则会推进剧情）
    menuPanel.addEventListener('click', function (e) { e.stopPropagation(); });
    menuPanel.querySelector('.pjsdk-menu-close').addEventListener('click', function (e) {
      e.stopPropagation();
      closeMenu();
    });
    menuPanel.querySelector('[data-k="replay"]').addEventListener('click', function (e) {
      e.stopPropagation();
      replay();
    });
    menuPanel.querySelector('[data-k="log"]').addEventListener('click', function (e) {
      e.stopPropagation();
      openLog();
    });
    menuPanel.querySelector('[data-k="skip"]').addEventListener('click', function (e) {
      e.stopPropagation();
      askSkip();
    });
    menuPanel.querySelector('[data-k="more"]').addEventListener('click', function (e) {
      e.stopPropagation();
      openMore();
    });
    menuPanel.querySelector('[data-k="story"]').addEventListener('click', function (e) {
      e.stopPropagation();
      openStory();
    });
    menuPanel.querySelector('[data-k="map"]').addEventListener('click', function (e) {
      e.stopPropagation();
      openMap();
    });
    menuPanel.querySelector('[data-k="aff"]').addEventListener('click', function (e) {
      e.stopPropagation();
      openAff();
    });

    speedChips = [].slice.call(menuPanel.querySelectorAll('.pjsdk-chip'));
    speedChips.forEach(function (chip) {
      chip.addEventListener('click', function (e) {
        e.stopPropagation();
        applySpeed(parseFloat(chip.getAttribute('data-v')));
      });
    });

    stage.appendChild(menuBackdrop);
    stage.appendChild(menuBtn);
    stage.appendChild(fullBtn);
    stage.appendChild(menuPanel);

    // 面板高度＝内容的自然高度（进 DOM 之后才量得出来；开合动画要用）
    var inner = menuPanel.querySelector('.pjsdk-menu-inner');
    menuPanel.style.setProperty('--pjsdk-menu-h', inner.offsetHeight.toFixed(1) + 'px');

    // 小窗口下圆钮太小，命中区补到 44px（视觉尺寸不变）
    fitMenuHitArea(player, menuBtn);
    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(function () { fitMenuHitArea(player, menuBtn); }).observe(player.root);
    }

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (skipEl && skipEl.classList.contains('open')) { closeSkip(); return; }
      if (moreEl && moreEl.classList.contains('open')) { closeMorePanel(); return; }
      if (storyUI() && storyUI().escape && storyUI().escape()) return;
      if (affEl && affEl.classList.contains('open')) { closeAff(); return; }
      if (logEl && logEl.classList.contains('open')) { closeLog(); return; }
      closeMenu();
    });
  }

  function fitMenuHitArea(player, btn) {
    var w = player.root.clientWidth;
    if (!w) return;
    var k = Math.min(w / 1280, (player.root.clientHeight || (w * 9) / 16) / 720) || 1;
    btn.style.setProperty('--pjsdk-menu-pad', (Math.max(0, (44 - 64 * k) / 2) / k).toFixed(1) + 'px');
  }

  /* ---------------- 说话时动动嘴 ----------------
   * 我们没有语音，编译出来是 LipSync=0（文字模式），按游戏逻辑这时嘴是不动的。
   * 这里自己按打字机的节奏推一个「张嘴目标」：模型的 ParamMouthOpenY 每帧都会做
   * 加权平滑（播放器 CharacterModel 里），所以 100ms 一步的方波看着也像在说话。
   *
   * PJSK_SETTINGS.mouth = false 关掉；以后真接了 TTS（voice: true）会自动让位，
   * 让播放器按语音 rms 驱动，免得两边抢同一个参数。
   */

  var MOUTH_MS = 100;

  // 一张一合，幅度随机；偶尔停一拍，免得像节拍器。
  // 模型的平滑会吃掉一部分幅度（目标 0.7 稳定下来只有 0.5 左右），所以这里给得偏大。
  function mouthNext(prev) {
    if (prev > 0.15) return Math.random() < 0.6 ? 0 : 0.18;
    return Math.random() < 0.18 ? 0 : 0.3 + Math.random() * 0.5;
  }

  /** 这个片段是台词就返回说话的角色编号；不是台词返回 -1（别动上一个） */
  function speakerOf(index) {
    var scn = app.scenario;
    if (!scn || !scn.Snippets) return -1;
    var s = scn.Snippets[index];
    if (!s || s.Action !== ACTION_TALK) return -1;
    var t = scn.TalkData[s.ReferenceIndex];
    if (!t) return 0;
    // 心理描写（整句包在（）里，「（…）」也算）：是心里说的话，嘴不动。
    // 返回 0 让上一个说话的人闭嘴；表情/动作照常（那些不归口型管）。
    if (isMonologue(t)) return 0;
    return (t && t.TalkCharacters && t.TalkCharacters[0]) ? t.TalkCharacters[0].Character2dId : 0;
  }

  /** 台词是不是整句心理描写：一歌(...)：（嗯，明天见。）/ 一歌(...)：「（嗯，明天见。）」 */
  function isMonologue(talk) {
    var b = String((talk && talk.Body) || '').trim();
    if (!b) return false;
    // 全角为主，兼容半角括号。只要求「整句被括号包住」——
    // （拿起手机）喂？ 这种半个括号的不算，嘴照常动。
    return /^[（(][\s\S]*[）)]$/.test(b) || /^[「『][（(][\s\S]*[）)][」』]$/.test(b);
  }

  function mountMouth(player) {
    if (S.mouth === false) return;
    var id = 0;       // 正在动嘴的角色
    var target = 0;

    setInterval(function () {
      var s = player.session;
      if (!s || !s.stage || !s.stage.setLipTarget) return;

      // 打字机在跑 = 在「说话」；接了语音就交给播放器自己按 rms 驱动
      var typing = !player.voice && s.player.dialogue.isTyping();
      var want = typing ? app.speakingId : 0;

      if (want !== id) {
        if (id) s.stage.setLipTarget(id, 0);   // 上一个先闭嘴
        id = want;
        target = 0;
      }
      if (!id) return;

      target = mouthNext(target);
      s.stage.setLipTarget(id, target);
    }, MOUTH_MS);
  }

  /* ---------------- 首屏提示（只出现一次） ---------------- */

  var hintEl = null;
  var hintTimer = 0;

  function showHint(player) {
    if (S.hint === false || hintEl || recall(KEY_HINT) === '1') return;
    if (player.auto) return;      // 已经是自动播放了，这句话就不对
    if (!remember(KEY_HINT, '1')) return;   // 记不住就别每次消息都弹一遍
    hintEl = document.createElement('div');
    hintEl.className = 'pjsdk-hint';
    hintEl.textContent = '点击画面继续 · 右下角 AUTO 自动播放';
    player.root.appendChild(hintEl);
    setTimeout(function () { if (hintEl) hintEl.classList.add('in'); }, 40);
    hintTimer = setTimeout(hideHint, 7000);
  }

  function hideHint() {
    if (!hintEl) return;
    var el = hintEl;
    hintEl = null;
    clearTimeout(hintTimer);
    el.classList.remove('in');
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 400);
  }

  /* ---------------- 播放 ---------------- */

  /* 开演前先把这一场要用的模型备好 ----------------
   * 播放器的时间轴是「演到哪一句再去要模型」，而角色上场那一步最多只等 12 秒
   * （bundle 里的 APPEAR_WAIT）。素材在 github raw / 别的 CDN 上时，一个校服模型
   * （moc3 1.4MB + 贴图 1.8MB + 物理 + 动作）经常来不及，于是：
   *   snippet 0 (CharacterLayout) failed: model unavailable: xxx
   * 而且**不会重试**——那一整轮的立绘就没了，只剩台词。
   *
   * 所以关掉播放器的自动开演，这里先把这个场景前几个要出场的服装拉下来，
   * 盯着 modelCache 等它们真的进了缓存，再 play()。
   * 不看 loadCostume 的返回值：它有 30 秒上限，超时返回 null，但底层请求还在跑、
   * 下完照样会写进 modelCache——所以按缓存判断才准。
   * S.warmup = false 可关掉，S.warmupModels 改「先备几个」（默认 3）。
   */
  var WARMUP_LIMIT = 60000;     // 最多等这么久，到点无论备没备齐都开演

  function warmUpThenPlay() {
    var p = app.player;
    var ses = p && p.session;
    var st = ses && ses.stage;
    var scn = ses && ses.scenario;
    var started = false;

    function go(why) {
      if (started) return;
      started = true;
      if (why) console.info('[pjsdk] 开演（' + why + '）');
      try { void p.play(); } catch (e) { console.error('[pjsdk] play 失败', e); }
    }

    if (!st || !scn) { go('播放器没有预热接口'); return; }

    // 这个场景里会出场的服装，按出场顺序去重，只备前几个
    var want = [];
    var seen = {};
    (scn.AppearCharacters || []).forEach(function (c) {
      if (!c || !c.CostumeType || seen[c.CostumeType]) return;
      seen[c.CostumeType] = 1;
      want.push(c);
    });
    var n = Math.max(0, Math.min(Number(S.warmupModels) || 3, want.length));
    if (!n || S.warmup === false) { go('不用预热'); return; }

    var targets = want.slice(0, n);
    var cache = st.modelCache;
    function got() {
      if (!cache) return 0;
      var k = 0;
      for (var i = 0; i < targets.length; i++) if (cache.has(targets[i].CostumeType)) k++;
      return k;
    }
    function setStatus(txt) {
      try { if (p.statusEl && p.statusEl.textContent !== txt) p.statusEl.textContent = txt; } catch (e) { /* 老版本没这个元素 */ }
    }

    if (got() >= n) { go('模型已在缓存'); return; }

    try {
      if (p.showLoading) p.showLoading();
      if (p.startBtn) p.startBtn.hidden = true;
      setStatus('正在准备立绘 0/' + n);
    } catch (e) { /* 同上 */ }

    // 先把下载踢起来（库自己也在下，loadCostume 内部有去重，重复调不会多下）
    if (st.loadCostume) {
      targets.forEach(function (c) {
        try { Promise.resolve(st.loadCostume(c.CostumeType, c.Character2dId)).catch(function () {}); } catch (e) { /* ignore */ }
      });
    }

    var t0 = Date.now();
    var timer = setInterval(function () {
      var k = got();
      if (k >= n) { clearInterval(timer); go('模型就绪'); return; }
      if (Date.now() - t0 > WARMUP_LIMIT) { clearInterval(timer); go('预热超时 ' + (WARMUP_LIMIT / 1000) + ' 秒'); return; }
      setStatus('正在准备立绘 ' + k + '/' + n);
    }, 400);
  }

  async function play(text, label) {
    var parsed = global.PJSK_PARSER.parseMessage(text);
    if (!parsed.events.length && !(parsed.branches && parsed.branches.length)) {
      console.warn('[pjsdk] 没解析出内容');
      return false;
    }
    pending.length = 0;
    // 有两条以上才是「要选」；只剩一条说明这一楼已经收口过（或本来就只有一条路），
    // 直接把它接到公共段后面一次播完，不要再停在半路等选择。
    var hasBranch = !!(parsed.branches && parsed.branches.length >= 2);
    var playEvents = parsed.events;
    if (parsed.branches && parsed.branches.length === 1) {
      playEvents = parsed.events.concat(parsed.branches[0].events);
    }
    var built = global.PJSK_SCENARIO.compile(playEvents, {
      scenarioId: 'pjsdk_' + Date.now(),
      sceneToBg: sceneToBg,
      charToCostume: charToCostume,
      // 收尾横幅的文字：S.endTelop 写 false 就不要，写字符串就换字
      endTelop: hasBranch ? false : S.endTelop,
    });
    app.scenario = built.scenario;
    app.rawText = text;
    app.warnings = parsed.warnings.concat(pending, built.warnings);
    if (app.warnings.length) console.info('[pjsdk] ' + label + ' 提示:', app.warnings);

    // 新的一轮：记录从第一句重新算
    app.progressIndex = 0;
    closeLog();
    favorReset();
    // 这一轮的好感变化 / 当前剧情线：跟下面的模型加载并行算，尽量赶在开口前就绪
    void favorLoad();
    void storyLoad();

    if (!app.player) return false;
    await app.player.load(built.scenario);
    // 分支：登记本次有哪些岔路（放在 load 之后，避免面板早于舞台出现）
    if (global.PJSK_BRANCH) global.PJSK_BRANCH.onScenario(parsed, text);
    return true;
  }

  /**
   * 单独装载一支分支：编译 -> load，不动好感 / 记录 / 重播状态。
   * 分支里如果再写 -scene- 会正常切场景；不写就沿用上一段的开场背景当兜底。
   */
  async function loadBranch(events, label) {
    if (!events || !events.length) return false;
    var built = global.PJSK_SCENARIO.compile(events, {
      scenarioId: 'pjsdk_br_' + Date.now(),
      sceneToBg: sceneToBg,
      charToCostume: charToCostume,
      endTelop: S.endTelop,
      fallbackBg: (app.scenario && app.scenario.FirstBackground) || '',
    });
    if (built.warnings && built.warnings.length) {
      app.warnings = app.warnings.concat(built.warnings);
      console.info('[pjsdk] ' + label + ' 提示:', built.warnings);
    }
    app.scenario = built.scenario;
    app.progressIndex = 0;
    if (!app.player) return false;
    await app.player.load(built.scenario);
    return true;
  }

  async function boot() {
    document.body.classList.add('embed');

    // 旧版产物 / 忘了改地址：先给出最直白的一句
    if (/replace-me|example\.com/i.test(ASSET)) {
      showFatal('素材地址还是占位符', [
        '这段 HTML 里 assetBase 还是 https://REPLACE-ME.example.com/ ，是旧版产物。',
        '',
        '重新跑一次 tools/build_player.py，',
        '把新的 dist-player/regex-replacement.txt 整段替换进酒馆正则。',
      ]);
      return;
    }

    var problems = [];
    var netFail = false;   // 有没有「连不上」这种网络层失败（区别于 404）

    // 素材索引
    async function grab(name) {
      var url = ASSET + name;
      try {
        var r = await fetch(url, { cache: 'no-cache' });
        if (!r.ok) {
          problems.push(name + ' → HTTP ' + r.status
            + (r.status === 404 ? '（文件不存在）' : '') + '  ' + url);
          return null;
        }
        return await r.json();
      } catch (e) {
        netFail = true;
        // 别写「连不上」：CORS 被拦时服务器其实是通的，具体原因交给 diagnose() 判
        problems.push(name + ' → 请求失败  ' + url);
        return null;
      }
    }
    INDEX.models = await grab('models.json');
    INDEX.backgrounds = await grab('backgrounds.json');

    if (!INDEX.models) {
      var lines = problems.concat(['']);
      if (netFail) {
        lines = lines.concat(await diagnose());
      } else {
        lines = lines.concat([
          '原因：地址通了，服务器也有响应，但文件不在那个目录里。',
          '  检查大小写（Models.json 和 models.json 不一样）和子目录层级。',
        ]);
      }
      showFatal('素材没加载到', lines.concat([''], assetHint()));
      return;
    }
    buildCharMap();

    // 词表：解析器靠它区分括号里是动作、表情还是服装
    if (global.PJSK_PARSER && global.PJSK_SCENARIO) {
      var words = Object.keys((global.PJSK_CONFIG && global.PJSK_CONFIG.costumeWords) || {});
      var sp = global.PJSK_SCENARIO.SPECIAL_WORDS || { motions: [], expressions: [] };
      global.PJSK_PARSER.setVocab(
        Object.keys(global.PJSK_SCENARIO.MOTION_CLIP).concat(sp.motions),
        Object.keys(global.PJSK_SCENARIO.FACE_CLIP).concat(sp.expressions),
        words.concat(allCostumeKeys())
      );
    }

    // 播放器本体
    try {
      await new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.type = 'module';
        s.textContent = 'import "' + PLAYER_JS + '"; window.dispatchEvent(new Event("pjsdk-player-ready"));';
        s.onerror = function () { reject(new Error('脚本加载失败（地址不对 / 文件不在 / CORS 没开）')); };
        document.head.appendChild(s);
        global.addEventListener('pjsdk-player-ready', resolve, { once: true });
        setTimeout(function () { reject(new Error('30 秒还没加载完')); }, 30000);
      });
    } catch (e) {
      showFatal('播放器没加载到', [
        PLAYER_JS,
        String((e && e.message) || e),
        '',
        '检查素材目录里有没有 player/bundle.js（从 dist-player/upload/player/ 拷过去）。',
        '',
      ].concat(assetHint()));
      return;
    }

    var factory = global.PJSK_PLAYER && global.PJSK_PLAYER.createPlayer;
    var makeResolver = global.PJSK_PLAYER && global.PJSK_PLAYER.createAssetResolver;
    if (!factory) {
      showFatal('播放器没加载到', [
        PLAYER_JS + ' 加载了，但没有导出 createPlayer。',
        'bundle.js 可能是旧的或者被截断了，重新拷一次 dist-player/upload/player/bundle.js。',
      ]);
      return;
    }

    // 背景我们这边是 webp/png 混着的，播放器默认只找 .png，这里给候选列表
    // 播放器要的 UI 贴图路径是它自己那套目录（scenario/…、menu/…），
    // 而 pjsk-assets/ui 是平铺的，这里对一下名字；对不上的给 1×1 透明图，免得满屏 404
    // （这张图必须是真的全透明：以前那版是半透明蓝，1×1 铺满整个元素后是个蓝方块，
    //   点按模式下「下一句」的提示符就是这么露出来的）
    var BLANK = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR4nGNgAAIAAAUAAXpeqz8AAAAASUVORK5CYII=';
    var UI_MAP = {
      'scenario/holo.png': 'holo.png',
      'scenario/btn_round_h80_wh.png': 'button_round_h80.png',
      'scenario/tex_transition_left.png': 'transition_left.png',
      'scenario/tex_transition_top.png': 'transition_top.png',
      // 对话框右下角的「下一句」提示符（游戏里的青色音符 EndSign）
      'serif_note.png': 'arrow_page_forward.png',
    };

    var assets = makeResolver ? makeResolver(ASSET, {
      background: function (id) {
        var p = encodeURI(id);   // 子目录和中文都要保留
        return [ASSET + 'background/' + p + '.webp', ASSET + 'background/' + p + '.png'];
      },
      ui: function (p) {
        var hit = UI_MAP[p];
        return hit ? ASSET + 'ui/' + hit : BLANK;
      },
    }) : ASSET;

    app.player = factory('#stage', {
      assets: assets,
      // 不交给播放器自动开演：它一开演就按时间轴走，而「角色上场」只等模型 12 秒
      // （bundle 里的 APPEAR_WAIT），素材在远端时经常来不及，这一句的立绘会被
      // **永久丢掉**（控制台：snippet 0 (CharacterLayout) failed: model unavailable）。
      // 改成我们自己先把这个场景的模型拉下来，再调 play()，见 warmUpThenPlay。
      autoplay: false,
      // 默认「点一下进一句」；右下角 AUTO 切自动播放（选择会记在 localStorage）
      auto: initialAuto(),
      fast: !!S.fast,
      voice: false,
      locale: 'zh',
      textScript: 'zh',
      menu: false,
      // true：先把这一轮用到的文件全下完再开演（有进度条）。默认关，让首句尽快出来
      preload: S.preload === true,
      // 不填就用 Live2D 官方地址。想自己托管 Cubism Core 就在这里给 URL
      // （注意 Core 有自己的许可，能不能再分发要先看 Live2D 的条款）
      cubismCoreUrl: S.cubismCoreUrl || undefined,
    });
    app.player.on('error', function (e) { console.error('[pjsdk] player error', e); });
    // 首句可能早于 load 事件，先挂一遍（钩子内部有幂等标记）
    hookDialogueFit(app.player);
    // 所有会出场的模型都建好再开演。默认播放器只等「前 3 句用到的服装」，
    // 其余角色是在第一句播到一半时在后台加载的——那一下会卡零点几秒
    // （奏/瑞希的 moc3 最大，最明显）。放到加载遮罩后面做，代价是开场多转一会儿。
    app.player.on('load', function () {
      var s = app.player.session;
      if (s && s.player && S.waitModels !== false) s.player.waitForAll = true;
      hookDialogueName(s && s.player);
      hookDialogueFit(s && s.player);
      mountPlacePlate(app.player);
      // 自动开演关掉了（见上面 autoplay 那段注释），这里接管开演时机。
      // 用 setTimeout 是因为库在本轮回调**之后**才把「开始」按钮那套摆好，
      // 早一步调 play() 会被它覆盖回去。
      setTimeout(function () {
        var ses = app.player.session;
        if (ses && ses === s && !ses.started) warmUpThenPlay();
      }, 0);
    });
    // 新一轮开演：地点牌先收起来，等 progress 按新的 SceneMarks 重新挂
    app.player.on('play', function () { resetPlacePlate(); });
    app.player.on('play', function () { showHint(app.player); });
    app.player.on('progress', function (e) {
      app.progressIndex = e.index;
      updatePlacePlate(e.index);
      var who = speakerOf(e.index);
      if (who >= 0) {
        app.speakingId = who;   // -1 是布局之类的片段，说话的人不变
        favorMaybeShow(who);    // 这一轮他涨了/掉了就弹一张
        if (who > 0) armPoseReset(who, e.index);   // 挥手演完收招（别的动作不动）
      } else {
        var actWho = motionChangeChar(e.index);
        if (actWho > 0) armPoseReset(actWho, e.index);
      }
      if (global.PJSK_BRANCH) global.PJSK_BRANCH.onProgress(e.index);
    });
    // 动作节拍（2 秒等待）可点击跳过。播放器预留了 inputtedWaitSkip 字段但上游没人置位，
    // 这里接上：舞台点击置 true，50ms 后自动撤掉——等待循环 16ms 一帧肯定读得到，
    // 而推进台词的那一下点击不会泄漏到后面（等下一句播完早过了 50ms）。
    // 不能在片段派发时清（progress 里清）：点击落进换动作片段的派发窗口会被立刻抹掉
    app.player.root.addEventListener('click', function () {
      var inner = app.player.session && app.player.session.player;
      if (!inner) return;
      inner.inputtedWaitSkip = true;
      setTimeout(function () { inner.inputtedWaitSkip = false; }, 50);
    });
    mountAutoButton(app.player);
    mountMenu(app.player);
    mountMouth(app.player);
    applySpeed(initialSpeed());
    // 方便调试 / 测试：PJSK_APP.setAuto(true)
    app.setAuto = function (on) { if (app.player) app.player.setAuto(!!on); };
    // 地图：功能层走弹窗确认，入口是 app.onMapPlace(name, detail)；也可以直接开关面板
    app.openMap = openMap;
    app.closeMap = closeMap;
    app.mapPoints = MAP_POINTS;
    app.mapEvents = [];             // 当前打开期间掷出的随机事件（renderMapEvents 里更新）
