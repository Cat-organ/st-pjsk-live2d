  // ---- 动作池：同基名的纯编号变体 ----
  //
  // 点头的 nod01..nod06 是同一个动作的不同变体，可以互换；
  // 但 tilthead01..08 分别是 歪头 / 偏头 / 仰头 / 侧头 / 抬头 / 转头，
  // 编号代表不同方向，展开会把六个词混成一锅。
  // 所以只展开「基名没被别的词共用」的那些（forward / think / shakehand 同理不展开）。
  var BASE_SHARED = (function () {
    var owner = {};
    var shared = {};
    Object.keys(MOTION_CLIP).forEach(function (w) {
      var cs = Array.isArray(MOTION_CLIP[w]) ? MOTION_CLIP[w] : [MOTION_CLIP[w]];
      var key = cs.join(',');
      cs.forEach(function (c) {
        var m = /^([a-z]+)\d{2}$/.exec(c);
        if (!m) return;
        if (owner[m[1]] == null) owner[m[1]] = key;
        else if (owner[m[1]] !== key) shared[m[1]] = 1;
      });
    });
    return shared;
  })();

  /** nod01 -> nod；armescape01n / nod0301 这种返回空（不参与展开） */
  function clipBase(c) {
    var m = /^([a-z]+)\d{2}$/.exec(c);
    return m ? m[1] : '';
  }

  /**
   * 32 位哈希（FNV-1a + 雪崩）。
   *
   * 之前用 djb2 直接 `h % pool.length`，低位几乎不变：
   * 实测一歌「微笑」60 句全落在同一张脸上，点头只落在 01/03/05。
   * 池子再大也白搭，所以最后要过一遍雪崩把低位打散。
   */
  function hash32(s) {
    var h = 2166136261;
    s = String(s || '');
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    h ^= h >>> 16;
    h = Math.imul(h, 2246822507);
    h ^= h >>> 13;
    h = Math.imul(h, 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  }

  /** 确定性挑一个：同一句永远同一个，不同台词会换 */
  function hashPick(pool, seed) {
    if (pool.length < 2 || !seed) return pool[0];
    return pool[hash32(seed) % pool.length];
  }

  // 动作缺失时的兜底，按「看起来最正常」排序，取第一个有素材的：
  //   nod05  双手交叠、头回正（最像站着点头）
  //   pose03 中立站姿（nod05 没有的 6 个男性角色用它）
  //   nod03 / nod01  前两个都没有时的退路（有些语气下会托下巴/手放胸前）
  // 不用 nod02/04/06：结尾带 11~19° 歪头，20 秒尾帧会一直保持，看着像又出了 bug。
  var FALLBACK_CLIPS = ['nod05', 'pose03', 'nod03', 'nod01'];

  /**
   * 一组候选 clip + 语气 -> 完整 clip 名。动作词和兜底都走这里。
   *
   * available 是这个角色实际有的动作（models.json 的 motions）。各语气的动作并不成套：
   * 初音有 w-normal-greeting01，却没有 w-cute-greeting01。盲写一个不存在的名字，
   * 播放器会静默跳过——模型就停在 A-pose（手臂张开），看着像动作丢了。
   * 所以按「本句语气 → normal → 其它语气」挑第一个真有的；一个都没有就返回空。
   *
   * 池化：同一个词在一个语气下往往有好几个 clip（点头 nod01~nod06、歪头 4 个变体）。
   * 传了 seed（说话人|台词|第几句）就从池里确定性地挑一个——同一句重渲染不闪，
   * 不同台词会换，不会永远只用第一个。没传 seed 时退回「取第一个」，保持老行为。
   */
  function resolveClips(clips, style, tones, available, armDown, seed, noExpand, strict) {
    var t = tones || DEFAULT_TONES;
    var order = [t[TONE_KEY[style] || 'normal'] || t.normal || DEFAULT_TONES.normal];
    var add = function (p) { if (p && order.indexOf(p) < 0) order.push(p); };
    add(t.normal);
    ['cute', 'happy', 'cool', 'adult'].forEach(function (k) { add(t[k]); });
    Object.keys(t).forEach(function (k) { add(t[k]); });

    if (!available || !available.length) return order[0] + '-' + clips[0];

    // strict：按候选顺序优先（兜底用），不哈希、不展开
    if (strict) {
      for (var c0 = 0; c0 < clips.length; c0++) {
        for (var i0 = 0; i0 < order.length; i0++) {
          var f0 = order[i0] + '-' + clips[c0];
          if (available.indexOf(f0) >= 0) return f0;
        }
      }
      return '';
    }

    /** 某个语气前缀下这组候选能用的全部 clip，按候选顺序排（同族展开） */
    function poolFor(prefix) {
      var out = [];
      var push = function (f) { if (out.indexOf(f) < 0) out.push(f); };
      clips.forEach(function (c) {
        var base = clipBase(c);
        if (base && !noExpand && !BASE_SHARED[base]) {
          // nod01 -> nod01..nod06；只收纯编号，nod01r / nod0301 这种组合变体不要
          available.forEach(function (f) {
            if (f.indexOf(prefix + '-') !== 0) return;
            if (clipBase(f.slice(prefix.length + 1)) === base) push(f);
          });
        } else {
          push(prefix + '-' + c);
        }
      });
      return out.filter(function (f) { return available.indexOf(f) >= 0; });
    }

    // 语气优先（本句语气 → normal → 其它），同一语气里优先手臂抬起的。
    // 早期转换把「手臂放下」的变体编成了 01（本该是 14），只按名字选会选错。
    var fallback = [];
    var pickSeed = seed ? seed + '|' + clips.join(',') : '';
    for (var i = 0; i < order.length; i++) {
      var pool = poolFor(order[i]);
      if (!pool.length) continue;
      var up = [];
      var down = [];
      pool.forEach(function (f) {
        if (armDown && armDown.indexOf(f) >= 0) down.push(f);
        else up.push(f);
      });
      if (up.length) return hashPick(up, pickSeed);
      if (!fallback.length) fallback = down;
    }
    return fallback.length ? hashPick(fallback, pickSeed) : '';
  }

  /**
   * 动作词 -> clip，不做兜底。也接受直接写 clip 名（动作包里 200 多个 clip，
   * 中文表只覆盖常用的那些）：
   *   (tilthead03, 酷)        -> w-cool-tilthead03
   *   (w-cool-tilthead03, '') -> w-cool-tilthead03
   */
  function motionClip(word, style, tones, available, armDown, seed, charKey) {
    word = String(word || '').trim();
    if (!word) return '';
    // 角色专属动作：值就是完整 clip 名，不再拼语气前缀
    var cmap = charKey && CHAR_MOTION[charKey];
    var special = cmap && cmap[word];
    if (!special && cmap) {
      // 英文词大小写不敏感（Wonderhoy / wonderhoy）
      var lower = word.toLowerCase();
      Object.keys(cmap).forEach(function (k) {
        if (!special && k.toLowerCase() === lower) special = cmap[k];
      });
    }
    if (special) {
      if (!available || !available.length || available.indexOf(special) >= 0) return special;
      return '';   // 这个角色没这个动作 -> 让调用方走兜底
    }
    if (/^[wmnl]-[a-z0-9]+-/.test(word)) return word;   // 已经带语气前缀
    var clip = MOTION_CLIP[word];
    if (!clip && /^[a-z][a-z0-9_]*$/i.test(word)) clip = word;   // 直接写 clip 名
    if (!clip) return '';
    var clips = Array.isArray(clip) ? clip : [clip];
    return resolveClips(clips, style, tones, available, armDown, seed);
  }

  /**
   * 动作词 -> clip，缺素材时退回「点头」。
   *
   * 为什么兜底：`defaultMotion` 是空动作（`w-normal-default01` 里没有任何曲线），
   * 缺动作时停在 A-pose（手臂张开）；非登场句更糟——上一个动作的尾帧会一直保持
   * （歪头 + 抱臂缺失 = 双手张开还歪着头）。
   * 兜底用 nod01/nod03/nod05，这三个结尾会回正；nod02/04/06 结尾带 11~19° 歪头，
   * 被 20 秒尾帧一保持就露馅。
   */
  function motionName(word, style, tones, available, armDown, seed, charKey) {
    var n = motionClip(word, style, tones, available, armDown, seed, charKey);
    if (n) return n;
    if (String(word || '').trim() === '点头') return '';
    // noExpand + strict：按 FALLBACK_CLIPS 的顺序取第一个，不哈希、不展开
    return resolveClips(FALLBACK_CLIPS, style, tones, available, armDown, '', true, true);
  }

  /**
   * 中文表情词 -> 具体 clip 名。
   *
   * 一个词对应一组视觉可互换的 clip，这里挑一个：
   *   - seed 用「说话人 + 台词 + 第几句」，**确定性**的：
   *     同一句无论重播多少次都是同一个表情（酒馆重渲染楼层不会闪），
   *     不同台词会换，避免连续几句一模一样。
   *   - available 是这个角色实际有的表情（models.json 的 faces），
   *     池里该角色没有的会被跳过——不然选了也是静默失败。
   */
  function faceName(word, seed, available, traits, charKey) {
    word = String(word || '').trim();
    if (!word) return '';
    if (/^face_[a-z0-9_]+$/i.test(word)) return word;   // 直接写 clip 名

    // 角色专属表情优先。查到了就只在这个角色的 clip 里挑；
    // 查到了但这个角色没有素材（空数组）时返回 ''，别退到通用表串味。
    var own = charFacePool(word, available, charKey);
    if (own) {
      if (!own.length) return '';
      return own.length === 1 ? own[0] : hashPick(own, seed);
    }

    var cfg = FACE_CLIP[word];
    if (!cfg) return '';
    // 两种写法：直接数组，或 { clips, onlyTear }
    var pool = Array.isArray(cfg) ? cfg : (cfg.clips || []);
    var onlyTear = !!(cfg && cfg.onlyTear);

    // 1) 该角色实际有的
    var hasAvail = !!(available && available.length);
    var cands = hasAvail
      ? pool.filter(function (c) { return available.indexOf(c) >= 0; })
      : pool.slice();
    if (!cands.length) return '';

    // 2) 按「带泪」过滤。同名 clip 在不同角色上不一样：
    //    初音的 smile_06 带 ParamTear=1.0，瑞希的同名 clip 不带。
    //    普通表情词排除带泪的（不然「微笑」会掉眼泪），「感动」反过来只收带泪的。
    var byTear = cands.filter(function (c) {
      var m = traits && traits[c];
      var hasTear = !!(m && m.indexOf('tear') >= 0);
      return onlyTear ? hasTear : !hasTear;
    });
    if (byTear.length) cands = byTear;   // 全带泪/全不带时不要把自己滤空

    // 没有该角色的表情清单（数据缺失）时不要赌，用池里第一个。
    // 只有确认角色有哪些之后才在池内路由。
    if (!hasAvail) return cands[0];
    if (cands.length === 1) return cands[0];

    return cands[hash32(seed) % cands.length];
  }

  /**
   * @param {Array} events  PJSK_PARSER 的事件流
   * @param {Object} opts
   *   opts.sceneToBg(sceneName, timeName) -> {id, unknown}  场景名+时间 -> 背景 id
   *   opts.charToCostume(name, costumeWord) -> {charId, costume, dir}  角色名(+服装) -> 模型
   *   opts.scenarioId  剧本 id
   * @returns {{scenario: Object, warnings: string[]}}
   */
  function compile(events, opts) {
    opts = opts || {};
    var sceneToBg = opts.sceneToBg || function () { return { id: '', unknown: true }; };
    var charToCostume = opts.charToCostume || function () { return null; };

    var warnings = [];
    var scenario = {
      ScenarioId: opts.scenarioId || 'pjsdk_generated',
      FirstBackground: '',
      FirstBgm: '',
      FirstCharacterLayoutMode: 0,
      AppearCharacters: [],
      TalkData: [],
      LayoutData: [],
      SpecialEffectData: [],
      SoundData: [],
      ScenarioSnippetCharacterLayoutModes: [],
      Snippets: [],
      // 左上角地点牌的时间轴：{ At: snippet 下标, Name: 地点名, Borrowed: 是否借图 }
      // 只有借图（-scene：A(显示：B)-）才显示，用来提示「画面是 B，剧情发生在 A」。
      // 播放器不认识这个字段，纯供 UI 层（boot.js 的 mountPlacePlate）读。
      SceneMarks: [],
    };

    var time = '白天';        // 时段词（白天/傍晚/夜晚）：选图和环境光用它
    var timeLabel = '';       // 字幕上写的那个：-time：18:30- 就显示 18:30
    var scene = '';           // 真实地点名（字幕/转场/投影判断用它）
    var sceneBg = '';         // 借用的背景图名：-scene：A(显示：B)- 里的 B，没写就是空
    var bgSet = false;
    // --clothes 定义的服装：角色键 -> 服装词。台词里不写服装就按这里的来，
    // 台词里写了就以台词为准并更新这份表（换装会持续到下次改写）
    var clothesMap = {};
    // --贴贴--：置起之后，下一句台词时让台上另一个角色滑到说话人身边，
    // 说完回原位。旁白/未收录角色不消耗
    var pendingSnuggle = false;
    // 场景和时间攒到「下一句台词之前」再一起生效。
    // AI 可能先写 -scene 再写 -time，立刻按旧时段选图就会选错变体。
    var dirty = false;
    var lastScene = '';       // 上一次落地的场景，用来判断「从世界里出来」和转场随机种子
    var fstOpen = false;      // 正处在一段全屏文字里
    var dirtyScene = false;
    var dirtyTime = false;   // 这一批里时间变过 -> 字幕要带上时间
    // -黑屏转场-：攒着跟 scene/time 一起落地。同一批里要是正好换场景，
    // 就把那次转场强制成黑屏（不再另外盖一次），免得「黑→亮→黑」闪两下
    var pendingCurtain = false;

    // 在场角色：槽位 0 = 左，1 = 右
    var slots = [null, null];
    var talkSeq = 0;          // 台词序号（旁白也算），用来判断谁闲置太久
    var appeared = {};     // charId|costume -> true
    var appearedInfo = {}; // charId|costume -> { charId, defaultMotion }（登记默认动作用）

    function addSnippet(action, refIndex, wait, delay) {
      scenario.Snippets.push({
        Index: scenario.Snippets.length,
        Action: action,
        ProgressBehavior: wait ? 1 : 0,
        ReferenceIndex: refIndex,
        Delay: delay || 0,
      });
    }

    /** 发一个特殊效果；wait=true 时播放会等它演完 */
    /** 发一个特殊效果；wait=true 时播放会等它演完。intVal/sub 只有个别效果用得上（见 AttachShader） */
    function fx(effectType, stringVal, duration, wait, intVal, sub) {
      scenario.SpecialEffectData.push({
        EffectType: effectType,
        StringVal: stringVal || '',
        StringValSub: sub == null ? '' : String(sub),
        Duration: duration || 0,
        IntVal: intVal || 0,
      });
      addSnippet(6, scenario.SpecialEffectData.length - 1, !!wait);
    }

    /**
     * 主动黑屏转场（-黑屏转场-）：盖上 → 黑屏停一拍 → 退去。
     * 黑屏靠 BlackIn 片段的前置 Delay 停住——fx() 没有 Delay 参数，这里直接拼片段。
     */
    function curtain(holdSec) {
      fx(FX.BlackOut, '', BLACK_OUT_SEC, true);
      scenario.SpecialEffectData.push({
        EffectType: FX.BlackIn, StringVal: '', StringValSub: '', Duration: BLACK_IN_SEC, IntVal: 0,
      });
      addSnippet(6, scenario.SpecialEffectData.length - 1, true, holdSec);
    }

    /** 时段 -> 环境光。Normal 是默认值，不用发 */
    function applyAmbient(timeName) {
      var v = AMBIENT[String(timeName || '').trim()];
      if (v == null || v === FX.AmbientNormal) return;
      // 必须等 ChangeBackground 演完：它结束时会把环境光重置成 Normal
      fx(v, '', 0, true);
    }

    /**
     * 全屏文字的「首行 / 末行」判断有个坑：播放器看的是
     *   SpecialEffectData[Snippets[c-1].ReferenceIndex].EffectType === FullScreenText
     * 但它没检查 Snippets[c-1].Action —— 上一句是台词时，ReferenceIndex 指的是 TalkData，
     * 照样会去 SpecialEffectData 里取。于是台词的第 0 句撞上第 0 个特效，误判成「上一条也是全屏文字」，
     * 结果黑边不出现；最后一行同理，文字永远不消失。
     *
     * 所以每段全屏文字前后各垫一条环境光特效（值等于当前时段，重复设置是无副作用的），
     * 让相邻的 snippet 一定是 Action=6 且类型不是 24。
     */
    function ambientNoop() {
      var v = AMBIENT[String(time || '').trim()];
      fx(v == null ? FX.AmbientNormal : v, '', 0, false);
    }

    function closeFst() {
      if (!fstOpen) return;
      fstOpen = false;
      ambientNoop();
    }

    /** 场景 + 时段 -> 背景。第一次设 FirstBackground，之后发 ChangeBackground */
    /** 把在场角色都收掉（换场景用）。下一句会重新走登场流程 */
    function hideAll() {
      Object.keys(slots).forEach(function (k) {
        var sl = slots[k];
        if (!sl) return;
        // SideFrom 必须是他当前所在的边：播放器 hide() 会先 fitModel(SideFrom)，
        // 写死 left 的话右边的人会先被瞬移到左边，闪一下再淡出。
        var sd = sl.side == null ? SIDE.left : sl.side;
        scenario.LayoutData.push({
          Type: 3,                        // LayoutType.Hide
          SideFrom: sd, SideFromOffsetX: 0,
          SideTo: sd, SideToOffsetX: 0,
          DepthType: 0,
          Character2dId: sl.charId,
          CostumeType: '',
          MotionName: '',
          FacialName: '',
          MoveSpeedType: 0,
        });
        addSnippet(2, scenario.LayoutData.length - 1, true);
        slots[k] = null;                  // 清空站位：下一句重新登场
      });
    }

    /**
     * 换场景时用哪种转场。三种：
     *   sekai  —— 场景名里带「世界」，或从「世界」出来：SekaiOut/In（白场 + 粒子）
     *   side   —— 侧幕，从左向右，只在换场景时用（时间变更不用）
     *   black  —— 黑屏，主力
     * 选法按「上一处 -> 这一处」哈希，同一段文本重渲染结果不变，不同场景之间才有变化。
     */
    function pickTransition(sceneName, fromScene, timeChanged, bgName, forceBlack) {
      // 主动写了 -黑屏转场-：这次换场景就老老实实走黑屏，不掷侧幕
      if (forceBlack) return 'black';
      if (opts.transition === 'black' || opts.transition === 'side' || opts.transition === 'sekai') {
        return opts.transition;
      }
      if (isSekaiScene(sceneName) || isSekaiScene(fromScene) || isSekaiScene(bgName)) return 'sekai';
      // 时间跳跃是「跨段」的，一律用黑屏；侧幕只留给同一段时间里的换位置（教室 → 走廊）。
      if (timeChanged) return 'black';
      return (hash32(String(fromScene) + '>' + String(sceneName)) % 100) < SIDE_CHANCE ? 'side' : 'black';
    }

    /** 找不到背景图时的提示：开场说「用兜底图」，之后说「沿用上一张」 */
    function noBgWarning(sceneName, bgName, first) {
      var tail = first ? '，用兜底图' : '，沿用上一张';
      if (bgName) {
        return '场景「' + sceneName + '」指定的背景「' + bgName + '」不在素材里' + tail;
      }
      return '场景「' + sceneName + '」没有对应背景图' + tail
        + '（可在场景名后写 (显示：已有地点) 指定用哪张图）';
    }

    function applyScene(sceneName, timeName, warn, sceneChanged, timeChanged, bgName, timeText, forceBlack) {
      // 背景按「显示的那张图」查；字幕、转场、投影判断都按真实地点名走
      var r = sceneToBg(bgName || sceneName, timeName);
      var noBg = !!r.unknown;   // 素材里没有这张图
      if (!bgSet) {
        scenario.FirstBackground = r.id;
        bgSet = true;
        // 开场不加横幅：手动模式下 Telop 会等点击，进来先看到空白等点一下很怪。
        // 而且开场本来就没有「切换」这个动作，直接出背景和角色更自然。
        lastScene = sceneName;
        // 开场就借图的话，地点牌从头挂着（下标 0 = 第一条片段）
        scenario.SceneMarks.push({ At: 0, Name: sceneName, Borrowed: !!bgName });
        if (noBg && warn) warnings.push(noBgWarning(sceneName, bgName, true));
        applyAmbient(timeName);
        return;
      }

      // 换场景的顺序照抄游戏：人物退场 → 遮罩盖上 → 换背景 → 环境光 → 遮罩退去 → 字幕 → 下一句登场。
      // 先把上一句的对话框关掉：播放器只在 WhenFinishCloseWindow 时 hide()，
      // 不设的话背景都换完了、下面还挂着上一句的台词。
      var lastTalk = scenario.TalkData[scenario.TalkData.length - 1];
      if (lastTalk) lastTalk.WhenFinishCloseWindow = 1;
      hideAll();

      var kind = pickTransition(sceneName, lastScene, timeChanged, bgName, forceBlack);

      // 地点牌的落点：从转场第一帧（黑屏盖上）就算「到这儿了」，
      // 牌在遮罩后面滑进来，等画面亮起来时已经在位。
      var markAt = scenario.Snippets.length;

      // ① 遮罩盖上。盖住之后换背景就不用再看淡入淡出了，Duration 给 0。
      if (kind === 'sekai') fx(FX.SekaiOut, '', SEKAI_SEC, true);
      else if (kind === 'side') fx(FX.LeftOut, '', SIDE_OUT_SEC, true);
      else fx(FX.BlackOut, '', BLACK_OUT_SEC, true);

      // ② 换背景 + 环境光（换背景会把环境光重置成 Normal，顺序不能反）。
      //    素材里没有这张图就**保留上一张**：跳一张无关的兜底教室图比不换更让人出戏，
      //    转场和地点字幕照常出，观众知道「换地方了」，只是画面没新图可用。
      if (!noBg) fx(FX.ChangeBackground, r.id, 0, true);
      applyAmbient(timeName);

      // ③ 遮罩退去
      if (kind === 'sekai') fx(FX.SekaiIn, '', SEKAI_SEC, true);
      else if (kind === 'side') fx(FX.LeftIn, '', SIDE_IN_SEC, true);
      else fx(FX.BlackIn, '', BLACK_IN_SEC, true);

      // ④ 字幕：时间和地点各出一条，时间在前（「几小时后」→「十字路口」）。
      //    黑屏/世界转场用横幅 Telop；侧幕是快速转场，地点改用不抢戏的左上角地点牌。
      if (opts.sceneTitle !== false) {
        if (timeChanged && timeName) fx(FX.Telop, timeText || timeName, 0, true);
        if (sceneChanged && sceneName) {
          if (bgName) {
            // 借图（-scene：宫益坂公司 前台处(显示：酒店大厅)-）：
            // 中间横幅照常出，说明「换地方了」；左上角再挂一块**常驻**地点牌，
            // 不然画面是酒店大厅、剧情写的是公司前台，观众会认错地方。
            // 常驻靠下面的 SceneMarks，UI 层按进度显示/收起。
            fx(FX.Telop, sceneName, 0, true);
          } else {
            fx(kind === 'side' ? FX.PlaceInfo : FX.Telop, sceneName, 0, true);
          }
        }
      }

      if (sceneChanged) {
        scenario.SceneMarks.push({ At: markAt, Name: sceneName, Borrowed: !!bgName });
      }

      if (noBg && warn) warnings.push(noBgWarning(sceneName, bgName, false));
      lastScene = sceneName;
      // 人已经清场了，投影顺手摘掉：等下一句登场时再按新场景重挂
      syncHolo();
    }

    /** 把攒下来的 scene/time 落到时间轴上；没有场景时只调环境光 */
    function flushScene() {
      if (!dirty && !pendingCurtain) return;
      var sceneChanged = dirtyScene;
      var timeChanged = dirtyTime;
      var wantCurtain = pendingCurtain;
      dirty = false;
      dirtyScene = false;
      dirtyTime = false;
      pendingCurtain = false;
      // 只写了 -黑屏转场-（场景和时间都没动）：单纯盖一次黑幕，不走换场景那套
      if (wantCurtain && !sceneChanged && !timeChanged) {
        if (bgSet) {
          var lastTalk = scenario.TalkData[scenario.TalkData.length - 1];
          if (lastTalk) lastTalk.WhenFinishCloseWindow = 1;
          curtain(CURTAIN_HOLD_SEC);
        }
        return;
      }
      if (!scene) {
        applyAmbient(time);
        // 只写了 -黑屏转场-、没换场景：就在这儿盖一次黑幕
        if (wantCurtain && bgSet) {
          var prevTalk = scenario.TalkData[scenario.TalkData.length - 1];
          if (prevTalk) prevTalk.WhenFinishCloseWindow = 1;
          curtain(CURTAIN_HOLD_SEC);
        }
        // 只改了时间：单独出一条时间字幕（-time：几小时后-）。
        // 第一句之前还没有背景，这时候出字幕会挂在黑底上，所以要求场景已经定过。
        if (bgSet && timeChanged && time && opts.sceneTitle !== false) {
          fx(FX.Telop, timeLabel || time, 0, true);
        }
        return;
      }
      applyScene(scene, time, true, sceneChanged, timeChanged, sceneBg, timeLabel, wantCurtain);
    }

    function ensureAppear(info) {
      var k = info.charId + '|' + info.costume;
      if (appeared[k]) return;
      appeared[k] = true;
      appearedInfo[k] = { charId: info.charId, defaultMotion: info.defaultMotion || '' };
      scenario.AppearCharacters.push({ Character2dId: info.charId, CostumeType: info.costume });
    }

    function layout(type, info, side, motionName) {
      scenario.LayoutData.push({
        Type: type,
        SideFrom: side,
        SideFromOffsetX: 0,
        SideTo: side,
        SideToOffsetX: 0,
        DepthType: 0,
        Character2dId: info.charId,
        CostumeType: type === 2 ? info.costume : '',
        // 登场就得摆好姿势，否则会停在模型的 A-pose。
        // 优先用这一句台词自己的动作（带全套手臂参数）；没有就退回这个角色的默认动作
        // （build_index.py 算好的 defaultMotion，男角色是 m-normal-tilthead01 之类）。
        MotionName: type === 2 ? (motionName || info.defaultMotion || '') : '',
        FacialName: 'face_normal_01',
        MoveSpeedType: 0,
      });
      // Progress=WaitFinished：换人/换装要等上一句台词演完才发生。
      // 写成 Now 的话播放器会在上一句还停在屏幕上时就提前把模型换掉。
      addSnippet(2, scenario.LayoutData.length - 1, true);
    }

    /** 台上还有谁、站在哪边 */
    function slotOf(charId) {
      for (var i = 0; i < 2; i++) {
        if (slots[i] && slots[i].charId === charId) return i;
      }
      return -1;
    }

    function stageCount() {
      return (slots[0] ? 1 : 0) + (slots[1] ? 1 : 0);
    }

    /** 让某个人下场（不动其他人） */
    function hideSlot(i) {
      var sl = slots[i];
      if (!sl) return;
      layout(3, sl, sl.side);
      slots[i] = null;
    }

    /**
     * 把台上的人「收起来再放到新位置」。
     *
     * 游戏里换位不是滑过去的：人先消失，再从新位置淡入。
     * 用 Hide(3) + Apper(2) 两个片段还原：Apper 的 CostumeType 留空，
     * 播放器会复用已经加载好的模型（不重新建），MotionName 写回这个角色的
     * 默认动作，重新出现时是中立站姿，不会带着上一句抬手的尾帧。
     */
    function recastSlot(i, side) {
      var sl = slots[i];
      if (!sl || sl.side === side) return;
      // 从哪边下就从哪边下（SideFrom 写错会先瞬移过去再淡出）
      scenario.LayoutData.push({
        Type: 3,                              // LayoutType.Hide
        SideFrom: sl.side, SideFromOffsetX: 0,
        SideTo: sl.side, SideToOffsetX: 0,
        DepthType: 0,
        Character2dId: sl.charId,
        CostumeType: '',
        MotionName: '',
        FacialName: '',
        MoveSpeedType: 0,
      });
      addSnippet(2, scenario.LayoutData.length - 1, true);

      scenario.LayoutData.push({
        Type: 2,                              // LayoutType.Apper
        SideFrom: side, SideFromOffsetX: 0,
        SideTo: side, SideToOffsetX: 0,
        DepthType: 0,
        Character2dId: sl.charId,
        CostumeType: '',                      // 空 = 复用现有模型，只换位置
        // 动作和表情都留空：引擎的 play('') 会跳过，角色带着刚才的姿势淡入。
        // 写 defaultMotion 会把人打回待机——「一个人说话 → 另一个人登场让位」
        // 时特别明显：A 明明还在抱臂，一挪到左边就变成双手交叠了。
        MotionName: '',
        FacialName: '',
        MoveSpeedType: 0,
      });
      addSnippet(2, scenario.LayoutData.length - 1, true);
      sl.side = side;
    }

    /**
     * 按台上人数重排：一个人就站中间，两个人才分左右。
     * 游戏里就是这样——单人场景是居中的，第二个人一开口，原来那个才让到一边。
     * 让位不是滑过去，而是「退场 → 从新位置出场」（recastSlot）。
     */
    function reflow() {
      var idx = [];
      for (var i = 0; i < 2; i++) if (slots[i]) idx.push(i);
      if (idx.length === 1) {
        recastSlot(idx[0], SIDE.center);
      } else if (idx.length === 2) {
        recastSlot(idx[0], SIDE.left);
        recastSlot(idx[1], SIDE.right);
      }
      syncHolo();
    }

    /* ---------------- 虚拟歌手的投影（AttachCharacterShader / hologram） ----------------
     * 游戏里歌姬不是本人到场，是「手机投影」出来的：模型套一层全息着色器
     * （发白、偏青、半透明、带扫描线闪烁），进了「世界」才是本体。
     * 所以这里不靠 AI 写指令，按「场景 + 台上是不是歌姬」自动挂/摘：
     *   非「世界」场景 + 台上是 21~26 号角色  -> hologram
     *   进了「世界」，或者歌姬都下去了          -> none（摘掉）
     * 播放器那边 AttachCharacterShader(22) 会走 Live2DHologram 的移植版。
     */
    var holoOn = {};        // charId -> 服装：投影挂在哪套模型上（换装=新模型，要重挂）

    /** models.json 里 21~26 是六位虚拟歌手；团队分身是 21xx */
    function isVocaloid(info) {
      var n = info && (info.baseCharId || info.charId) || 0;
      if (n >= 100) n = Math.floor(n / 100);
      return n >= 21 && n <= 26;
    }

    function syncHolo() {
      var want = {};        // charId -> 服装
      // 借图的情况也要看：点名的场景是现实、借的图是「世界」，歌姬照样是本体
      if (!isSekaiScene(scene) && !isSekaiScene(sceneBg)) {
        for (var i = 0; i < 2; i++) {
          if (slots[i] && slots[i].virtual) want[slots[i].charId] = slots[i].costume;
        }
      }
      var ids = Object.keys(want);
      for (var k = 0; k < ids.length; k++) {
        var id = ids[k];
        if (holoOn[id] === want[id]) continue;   // 同一套模型已经挂着
        holoOn[id] = want[id];
        // StringValSub 非空 = 还要播那圈粒子（fx/hologram：光柱、星点、两侧三角形）
        fx(FX.AttachShader, 'hologram', 0, false, +id, '1');
      }
      // 台上没人该挂（进了「世界」，或者歌姬都下去了）：一次摘干净。
      // 模型会留在缓存里复用，所以必须真的摘，不然换个场景还会带着投影回来。
      // 每个挂过的角色都要单独发一条 none：播放器按 IntVal 停掉各自的粒子（hologram@<id>）
      if (!ids.length && Object.keys(holoOn).length) {
        var olds = Object.keys(holoOn);
        holoOn = {};
        for (var j = 0; j < olds.length; j++) fx(FX.AttachShader, 'none', 0, false, +olds[j], '');
      }
    }

    function pickSlot(info) {
      var here = slotOf(info.charId);
      if (here >= 0) return { slot: here, reused: true };
      for (var j = 0; j < 2; j++) {
        if (!slots[j]) return { slot: j, reused: false };
      }
      // 都占着：换掉最久没说话的那个
      var victim = slots[0].lastSeq <= slots[1].lastSeq ? 0 : 1;
      return { slot: victim, reused: false };
    }

    /**
     * 预扫一遍：每句台词有没有对应模型。
     * 旁白/路人说话时台上不该有人，但单句旁白夹在两句台词中间时不退场，
     * 否则人物会「闪一下」——所以要看前后最近的两句是不是都有模型。
     * 无台词的动作行（act）也算「有模型」：那一拍人会站在台上。
     */
    var hasModel = [];
    var prevModeled = [];
    var nextModeled = [];
    (function () {
      var isLineish = function (ev) {
        return ev.type === 'line' || ev.type === 'narration' || ev.type === 'act';
      };
      events.forEach(function (ev, i) {
        hasModel[i] = (ev.type === 'line' || ev.type === 'act')
          && !!ev.speaker && !!charToCostume(ev.speaker, '');
      });
      var last = null;
      events.forEach(function (ev, i) {
        prevModeled[i] = last;
        if (isLineish(ev)) last = hasModel[i];
      });
      last = null;
      for (var i = events.length - 1; i >= 0; i--) {
        nextModeled[i] = last;
        if (isLineish(events[i])) last = hasModel[i];
      }
    })();

    /** 旁白 / 路人说话：台上的人先撤掉 */
    function clearStageForVoiceOnly(i) {
      if (opts.characterPresence === false) return;
      if (stageCount() === 0) return;
      // 夹在两句有模型的台词中间的单句旁白：留着人，别闪
      if (prevModeled[i] === true && nextModeled[i] === true) return;
      for (var k = 0; k < 2; k++) hideSlot(k);
    }

    /** 动作词 -> clip 名（带兜底和提示）。台词行和动作行共用 */
    function resolveMotion(words, style, info, seed) {
      var name = '';
      (words || []).forEach(function (w) {
        var strict = motionClip(w, style, info.tones, info.motions, info.armDown, seed, info.key);
        if (strict) { name = strict; return; }
        // 缺素材就退回点头，别让模型停在 A-pose 或上一个动作的尾帧
        var fb = motionName(w, style, info.tones, info.motions, info.armDown, seed, info.key);
        if (fb) {
          name = fb;
          warnings.push('动作「' + w + '」没有对应 clip，改用兜底动作');
        } else if (w) {
          warnings.push('动作「' + w + '」没有对应 clip，已忽略');
        }
      });
      return name;
    }

    /** 表情词 -> clip 名；没有匹配的词返回 ''（调用方决定默认值） */
    function resolveFace(words, seed, info) {
      var name = '';
      (words || []).forEach(function (w) {
        var n = faceName(w, seed, info.faces, info.faceTraits, info.key);
        if (n) name = n;
      });
      return name;
    }

    /** --clothes 的角色键：按 charId 归一，别名（星乃一歌/ichika）和分身（mmj_miku）都能对上 */
    function clothesKey(name) {
      var info = charToCostume(name, '');
      return info ? String(info.charId) : String(name || '').trim();
    }

    /** --clothes：一歌-校服;志步-便服-- 的值：分号分角色，短横连「角色-服装」 */
    function applyClothes(value) {
      String(value || '').split(/[;；]/).forEach(function (part) {
        var p = part.trim();
        if (!p) return;
        var dash = p.split(/[-－—]/);
        var name = (dash.shift() || '').trim();
        var word = dash.join('-').trim();
        if (!name || !word) {
          warnings.push('--clothes 里「' + p + '」要写成 角色-服装');
          return;
        }
        clothesMap[clothesKey(name)] = word;
      });
    }

    /** 这句台词该用哪套服装：台词里写的 > --clothes 定义的 > 默认 */
    function costumeFor(ev) {
      var word = ev.costume || clothesMap[clothesKey(ev.speaker)] || '';
      if (ev.costume) clothesMap[clothesKey(ev.speaker)] = ev.costume;
      return word;
    }

    events.forEach(function (ev, evIndex) {
      if (ev.type === 'meta') {
        if (ev.key === 'time') {
          // 数字时间先折算成时段词：背景变体、环境光只认那三个。
          // 字幕保留原样（-time：18:30- 就写 18:30，写「傍晚」还是「傍晚」）
          var rawTime = String(ev.value == null ? '' : ev.value).trim();
          var tk = timeKindOf(rawTime);
          time = tk || rawTime;
          timeLabel = (/[0-9０-９]/.test(rawTime) && tk) ? rawTime : time;
          dirty = true;
          dirtyTime = true;
        } else if (ev.key === 'scene') {
          // -scene：宫益坂公司 前台处(显示：酒店大厅)-
          // 字幕写前者，背景图查后者；只写地点名时两者相同
          var sp = splitScene(ev.value);
          scene = sp.name;
          sceneBg = sp.bg;
          dirty = true;
          dirtyScene = true;
        } else if (ev.key === 'clothes') {
          // 服装定义：不占时间轴，只改后续台词的默认取装。
          // 在场角色要等下一句台词/动作行才会真的换上
          applyClothes(ev.value);
        } else if (ev.key === 'fulltext') {
          // 黑底全屏文字：先把场景/时间的变更落地，再关掉上一句的对话框
          flushScene();
          if (!fstOpen) {
            ambientNoop();      // 见 ambientNoop 的注释：给「首行」判断垫一条
            fstOpen = true;
          }
          var prevTalk = scenario.TalkData[scenario.TalkData.length - 1];
          if (prevTalk) prevTalk.WhenFinishCloseWindow = 1;
          fx(FX.FullScreenText, ev.value, 0, true);
        }
        return;
      }

      // 开关式指令：-回忆切入- / -回忆切出- / -震屏-
      if (ev.type === 'flag') {
        closeFst();
        flushScene();
        if (ev.key === 'flashbackIn' || ev.key === 'flashbackOut') {
          // 游戏里回忆切入/切出都套一层闪白：白场盖上 → 换滤镜 → 白场退去。
          // 滤镜切换是瞬间的，套在白场里就不会看到颜色「跳」一下。
          fx(FX.WhiteOut, '', FLASH_OUT_SEC, true);
          fx(ev.key === 'flashbackIn' ? FX.FlashbackIn : FX.FlashbackOut, '', 0, false);
          fx(FX.WhiteIn, '', FLASH_IN_SEC, true);
        } else if (ev.key === 'shake') {
          fx(FX.ShakeScreen, '', SHAKE_SECONDS, true);
        } else if (ev.key === 'curtain') {
          // 挂起，等下一句台词前跟 scene/time 一起落地（见 flushScene）：
          // 同一批里换了场景就用黑屏转场，没换就单独盖一次黑幕
          pendingCurtain = true;
          dirty = true;
        } else if (ev.key === 'snuggle') {
          // 贴贴本身没有画面，等下一句台词时才动
          pendingSnuggle = true;
        }
        return;
      }

      // 台词之前把场景定下来
      closeFst();
      flushScene();

      // 无台词的动作行（一歌(开朗-高兴;开心;默认)）：只演动作，不出对话框。
      // 编译成 ChangeMotion(4)：播放器换动作/表情但不动对话框，Delay 给这一拍留时间。
      if (ev.type === 'act') {
        var actInfo = charToCostume(ev.speaker, costumeFor(ev));
        if (!actInfo) {
          warnings.push('未收录角色「' + ev.speaker + '」，动作行已忽略');
          return;
        }
        actInfo.style = ev.style || '';
        var actSeed = ev.speaker + '|act|' + talkSeq;
        var actM = resolveMotion(ev.motions, ev.style, actInfo, actSeed);
        var actF = resolveFace(ev.expressions, actSeed, actInfo) || 'face_normal_01';

        var actSeq = talkSeq++;
        // 动作行也算一拍：闲置太久的人照样退场
        for (var ai = 0; ai < 2; ai++) {
          var actSitting = slots[ai];
          if (!actSitting || actSitting.charId === actInfo.charId) continue;
          if (actSeq - actSitting.lastSeq >= IDLE_LINES) hideSlot(ai);
        }
        var actPick = pickSlot(actInfo);
        var actCur = slots[actPick.slot];
        var actCostumeChanged = !!(actPick.reused && actCur && actCur.costume !== actInfo.costume);
        var actAppeared = false;

        if (!actPick.reused || actCostumeChanged) {
          // 不在台上（或要换装）：走登场流程，动作由 Apper 带着摆好
          if (actCur) layout(3, actCur, actCur.side);
          ensureAppear(actInfo);
          var actOther = slots[1 - actPick.slot];
          var actSide = actOther ? (actPick.slot === 0 ? SIDE.left : SIDE.right) : SIDE.center;
          layout(2, actInfo, actSide, actM);
          slots[actPick.slot] = {
            charId: actInfo.charId, costume: actInfo.costume, lastSeq: actSeq, side: actSide,
            virtual: isVocaloid(actInfo),
            defaultMotion: actInfo.defaultMotion || '',
          };
          actAppeared = true;
        } else {
          slots[actPick.slot].lastSeq = actSeq;
        }

        reflow();

        if (!actAppeared) {
          // ChangeMotion(4)：换动作/表情但不动对话框。必须 WaitFinished——
          // 播放器派发不等待台词播完（只有 WaitFinished 有屏障），Now 的 ChangeMotion

    var d = stageEl().querySelector('.pjsk-dialogue')
      || document.querySelector('.pjsk-dialogue');
    if (!d) return;

      'background:linear-gradient(to bottom,rgba(10,12,20,0) 30%,rgba(10,12,20,.1) 62%,rgba(10,12,20,.2) 100%);',
      'font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;pointer-events:auto;}',
      '.pjsdk-choice.open{display:block}',

      'transition:background .14s ease,border-color .14s ease,transform .14s ease,box-shadow .14s ease;}',

  function hideChoice() {
    if (!st.panel) return;
    var el = st.panel;
    st.panel = null;
    el.classList.remove('open');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
    hushDialogue(false);
  }

  function showChoice() {
    if (st.panel || !st.list.length) return;
    ensureStyle();
    clearGate();
    st.ready = false;

    var box = document.createElement('div');
    box.className = 'pjsdk-choice';
    var list = document.createElement('div');
    list.className = 'pjsdk-choice-list';
    box.appendChild(list);

    st.list.forEach(function (b, i) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pjsdk-choice-opt';
      btn.style.animationDelay = (i * 80) + 'ms';

    commit(id);

        console.warn('[pjsdk] 分支播放失败', e);

    st.options = (parsed && parsed.options) || [];

    st.raw = raw || '';

    st.fired = false;
    st.waiting = false;
    st.ready = false;
    st.lineDone = false;
    clearGate();
    st.chosen = '';
    st.committed = '';
    st.autoPick = '';
    hideChoice();

    var saved = '';
    var idx = currentMesId();
    if (idx >= 0) {
      var ex = liveExtra(idx);
      var meta = ex && ex.pjsk_option;
      var ask0 = !!st.askAgain;
      if (meta && meta.chosen) {
        if (ask0) {
          // 重播：以上次的选择为默认，只是仍然把面板弹出来。
          // 这样玩家什么都不点直接关掉，也不会把线悄悄改回第一支。
          saved = String(meta.chosen);
          st.others = Array.isArray(meta.branches) ? meta.branches : [];
        } else if (meta.hash && meta.hash !== hashOf(st.raw)) {

    var last = typeof app.lastSnippet === 'function' ? app.lastSnippet() : (total - 1);

    var wasAuto = !!(app.player && app.player.auto);

    var el = document.querySelector('.pjsk-dlg-body');
    var prev = null;
    var stable = 0;
    var t0 = Date.now();
    var iv = setInterval(function () {
      var cur = el ? (el.textContent || '') : '';

        st.lineDone = true;
        armGate(wasAuto);
      }

  }

  /* ---------------- 自检（只给测试用，不挂 UI） ---------------- */

  function envReport() {
    var idx = currentMesId();
    var ctx = ctxOf();
    var lines = [];
    lines.push('在酒馆里：' + (tavernReady() ? '是' : '否（只演不改对话）'));
    lines.push('楼层 id：' + (idx < 0 ? '拿不到' : idx) + (findMesEl() ? '（DOM 定位）' : ''));
    lines.push('getChatMessages：' + (typeof global.getChatMessages === 'function' ? '有' : '没有'));
    lines.push('setChatMessages：' + (typeof global.setChatMessages === 'function' ? '有' : '没有'));
    lines.push('酒馆上下文：' + (ctx ? '有（chat ' + ctx.chat.length + ' 条）' : '没有'));
    lines.push('写回方式：' + (st.how || '还没写过'));
    if (idx >= 0) {
      try {
        var m = (typeof global.getChatMessages === 'function')
          ? global.getChatMessages(idx, { include_swipes: true })[0]
          : (ctx && ctx.chat[idx]);
        if (m) {
          lines.push('mes 长度：' + String(m.message || m.mes || '').length);
          lines.push('mes 开头：' + String(m.message || m.mes || '').replace(/\s+/g, ' ').slice(0, 60));
          var ex = m.extra || {};
          lines.push('已收口到：' + ((ex.pjsk_option && ex.pjsk_option.chosen) || '还没选'));
        }
      } catch (e) {
        lines.push('读取失败：' + ((e && e.message) || e));
      }
    }
    lines.push('本轮分支：' + (st.list.length ? st.list.map(function (b) { return b.id; }).join(' / ') : '没有'));
    return lines.join('\n');
  }

  global.PJSK_BRANCH = {
    init: function (app) {
      st.app = app;
      // 只绑一次：点舞台 = 弹选项（打字时放行给播放器）
      if (!st.bound) {
        st.bound = true;
        document.addEventListener('click', onStageClick, true);
      }
    },
    onScenario: onScenario,
    onProgress: onProgress,
    showChoice: showChoice,
    commit: commit,
    /** 重播前把另一支拼回来；返回 '' 表示没有别的支 */
    expand: expand,
    /** 「重新播放」时调用：这一次不自动接上次的分支，重新问一遍 */
    askAgain: function () { st.askAgain = true; },
    _state: st,
    _report: envReport,
  };
})(window);

    var h = document.createElement('div');
    h.style.cssText = 'font-weight:700;font-size:17px;color:#ff7b7b;margin-bottom:10px';
    h.textContent = title;
    card.appendChild(h);

    (lines || []).forEach(function (t) {
      var p = document.createElement('div');
      if (/^(https?:\/\/|models\.json|backgrounds\.json|.*→)/.test(t)) {
        p.style.cssText = 'font-family:ui-monospace,Consolas,monospace;font-size:13px;color:#c9b8bd';
      }
      p.textContent = t || '\u00a0';
      card.appendChild(p);
    });

    if (STAMP) {
      var s = document.createElement('div');
      s.style.cssText = 'margin-top:14px;padding-top:10px;border-top:1px solid #33222a;color:#7d6b70;font-size:12px';
      s.textContent = '构建时间 ' + STAMP + '（如果这不是你刚构建的，说明酒馆里的正则还是旧的）';
      card.appendChild(s);
    }

    wrap.appendChild(card);
    document.body.appendChild(wrap);
  }

  function assetHint() {
    return [
      '当前素材根目录：' + ASSET,
      '要改的话：tools/build_player.py --asset-base https://你的域名/pjsk-assets/ 然后重新粘贴正则。',
      '素材目录里必须有 models.json / backgrounds.json / model_manifest.json / player/bundle.js。',
    ];
  }

  /** 素材根目录是不是本机地址 */
  function isLocalAsset() {
    return /^https?:\/\/(127\.0\.0\.1|localhost|\[::1\])(:|$)/i.test(ASSET);
  }

  /**
   * fetch 失败时主动分辨原因。
   *
   * 只看 e.message 的话，「服务没起」「CORS 没开」「被代理拦走」「混合内容」
   * 全都显示成同一句 Failed to fetch，看的人根本不知道该改哪儿——
   * 而这四种的修法完全不同。
   */
  async function diagnose() {
    var httpsPage = typeof location !== 'undefined' && location.protocol === 'https:';
    var assetHttp = /^http:\/\//i.test(ASSET);

    // 混合内容：https 页面请求 http 素材，浏览器直接拦，请求连发都发不出去
    if (httpsPage && assetHttp) {
      return [
        '原因：酒馆是 https，素材是 http —— 浏览器按混合内容拦掉了，请求根本没发出去。',
        '  办法一：酒馆也用 http://localhost:8000 打开。',
        '  办法二：素材上云（https），再用 build_player.py 重新构建。',
      ];
    }

    // 用 no-cors 再探一次：只关心「连不连得上」，不看 CORS 头。
    // 能拿到 opaque 响应说明服务器活着，问题就出在 CORS。
    var reachable = false;
    try {
      await fetch(ASSET + 'models.json?probe=' + Date.now(), { mode: 'no-cors', cache: 'no-store' });
      reachable = true;
    } catch (e) { reachable = false; }

    if (reachable) {
      return [
        '原因：服务器连得上，但响应里没有 CORS 头 —— 浏览器不让读内容。',
        '  nginx：add_header Access-Control-Allow-Origin "*";',
        '  OSS / COS：控制台里开「跨域设置」，允许 GET 和你的来源。',
      ];
    }

    if (isLocalAsset()) {
      return [
        '原因：连不上本地服务（素材地址是本机）。',
        '  1) 服务没启动 —— 在 pjsk-data 目录跑：python game-renderer/serve.py 8931',
        '  2) 开着代理 / 加速器，把 127.0.0.1 也代理走了 —— 加进直连白名单，或关掉全局模式。',
        '  3) 端口不一致 —— serve.py 后面那个数字要和素材地址里的端口相同。',
      ];
    }

    return [
      '原因：连不上素材服务器（' + ASSET + '）。',
      '  域名写错 / 服务器没起 / 端口没开 / 被防火墙挡。',
      '  先用浏览器直接打开这个地址，能下到文件说明是 CORS 问题，打不开说明服务本身有问题。',
    ];
  }

  /* ---------------- 角色 ---------------- */

  // 26 个角色的 Character2dId 就是编号；模型目录名里带着
  function buildCharMap() {
    var chars = (INDEX.models && INDEX.models.characters) || {};
    Object.keys(chars).forEach(function (dir) {
      var info = chars[dir];
      var num = parseInt(info.num, 10);
      if (!num) return;
      var costumes = info.costumes || {};
      var def = info.default || '';
      if (!def) {
        var keys = Object.keys(costumes);
        def = keys.length ? costumes[keys[0]] : '';
      }
      app.charMap[dir] = {
        charId: num,
        key: info.key || '',                // ichika / saki …（Profile 头像的文件名）
        motionKey: info.motionKey || '',    // 01ichika / 20mizuki …（动作 / 表情目录名，专属词表用它做键）
        name: info.name || dir,
        costumes: costumes,
        default: def,
        tones: info.tones || null,          // 语气前缀（w-/m-/n-），按角色不同
        defaultMotion: info.defaultMotion || '',
        faces: info.faces || [],            // 这个角色实际有的表情 clip，供候选池过滤
        faceTraits: info.faceTraits || {},  // 带泪 / 带汗 / 脸红标记，按角色不同
        armDown: info.armDown || [],        // 手臂放下的动作，选 clip 时跳过
        motions: info.motions || [],        // 实际有的动作 clip（某个语气缺这个动作时换语气）
      };
      app.charByNum[num] = app.charMap[dir];
    });

    // 配角（剧情路人）的别名写在 models.json 的 aliases 里，名单在
    // game-renderer/data/mob_characters.json。这里注册进 config 的别名表，
    // resolveCharacter 才能把「白石谦」翻成 _mob/sub_anfather。
    var extra = {};
    Object.keys(chars).forEach(function (dir) {
      var info = chars[dir];
      var names = (info.aliases || []).slice();
      if (info.name) names.push(info.name);
      names.forEach(function (n) {
        if (n && !(n in extra)) extra[n] = dir;
      });
    });
    if (global.PJSK_CONFIG && global.PJSK_CONFIG.registerAliases) {
      app.aliasCount = global.PJSK_CONFIG.registerAliases(extra);
    }
  }

  /** 所有角色出现过的服装后缀，给解析器判断括号里的词是不是服装 */
  function allCostumeKeys() {
    var seen = {};
    Object.keys(app.charMap).forEach(function (dir) {
      Object.keys(app.charMap[dir].costumes).forEach(function (k) { seen[k] = 1; });
    });
    return Object.keys(seen);
  }

  function resolveDir(name) {
    var C = global.PJSK_CONFIG;
    if (C && C.resolveCharacter) return C.resolveCharacter(name);
    return null;
  }

  /**
   * 角色名 + 服装词 -> 用哪个模型
   * @param {String} speaker      「一歌」
   * @param {String} costumeWord  「校服」/「便服」/「casual」…（可为空，用默认）
   */
  /**
   * 虚拟歌手的团体别名：mmj_miku / vbs_miku / at25_miku …
   * 同一个歌手在 5 个团体里是不同模型，世界书里可以直接当不同角色写。
   * 返回 [基础角色名, 服装后缀]；不是别名返回 null。名字大小写不敏感。
   */
  function resolveAlias(name) {
    var map = (global.PJSK_CONFIG && global.PJSK_CONFIG.charAliases) || {};
    var n = String(name || '').trim();
    if (!n) return null;
    if (map[n]) return map[n];
    var lower = n.toLowerCase();
    for (var k in map) {
      if (k.toLowerCase() === lower) return map[k];
    }
    return null;
  }

  // 团队别名 -> 稳定的 persona 序号。Character2dId = 角色编号 * 100 + 序号，
  // 这样本体（21）和 MMJ 版（2101）、VBS 版（2102）在播放器里是三个不同的人，
  // 可以同屏，不会互相替换模型。
  var TEAM_INDEX = { mmj: 1, vbs: 2, ws: 3, ln: 4, at25: 5, x: 6 };
  function teamIndexOf(name) {
    var m = /^(mmj|vbs|ws|ln|at25|x)_/i.exec(String(name || '').trim());
    return m ? TEAM_INDEX[m[1].toLowerCase()] : 0;
  }

  function charToCostume(speaker, costumeWord) {
    // 先看是不是团体别名，是的话换成基础角色 + 默认服装
    var alias = resolveAlias(speaker);
    var baseName = alias ? alias[0] : speaker;
    var aliasCostume = alias ? alias[1] : '';
    var aliasSuffix = alias ? (alias[2] || '') : '';

    var dir = resolveDir(baseName);
    var c = dir && app.charMap[dir];
    if (!c) return null;

    // 别名给了默认服装，但用户显式写了服装词时以用户为准。
    // 例外：「默认」不该覆盖别名的团体版本——mmj_miku(;默认) 要的是偶像服，
    // 不是把 mmj 变回本体。写具体服装词（便服/校服…）时才覆盖。
    var costume = c.default;
    var wanted = String(costumeWord || '').trim();
    if (!wanted || wanted === '默认') wanted = aliasCostume;
    if (wanted) {
      var pick = global.PJSK_CONFIG && global.PJSK_CONFIG.pickCostume;
      var hit = pick ? pick(c.costumes, wanted) : '';
      if (hit) {
        costume = hit;
      } else {
        pending.push('「' + speaker + '」没有「' + wanted + '」这套服装，用默认的'
          + '（可用：' + Object.keys(c.costumes).join(' ') + '）');
      }
    }
    if (!costume) return null;

    // 团队版是不同的人：给一个独立的 Character2dId（21 -> 2101/2102/…）
    var team = (alias && aliasCostume) ? teamIndexOf(speaker) : 0;
    var personaId = team ? c.charId * 100 + team : c.charId;
    // 对话框名字：本体只显示基础名，分身加括号后缀（前端会把括号部分缩小）
    var displayName = alias ? (c.name + (aliasSuffix ? '(' + aliasSuffix + ')' : '')) : '';
    app.charByNum[personaId] = c;   // 记录页的头像按 personaId 查

    return {
      charId: personaId,
      baseCharId: c.charId,
      key: c.motionKey || c.key,
      displayName: displayName,
      costume: costume,
      dir: dir,
      tones: c.tones,
      defaultMotion: c.defaultMotion,
      faces: c.faces,
      motions: c.motions,
      faceTraits: c.faceTraits,
      armDown: c.armDown,
    };
  }

  /**
   * 对话框名字里的括号后缀（初音未来(MMJ)）要小一号。
   * 播放器把名字当纯文本写进 textContent，所以这里包一层：
   * 主名一个 span，括号一个 .pjsk-name-sub。
   * 描边层是 ::before + attr(data-text)：主名的 data-text 只写主名，
   * 括号自己带一份 data-text，由 .pjsk-name-sub::before 单独描边——
   * 不然括号没有描边，压在浅色背景上几乎看不清。
   */
  /**
   * 对话框文字自适应字号。
   *
   * 播放器的对话框是固定 1280×720 的 DOM 覆盖层：正文从 top:572px 往下排，
   * 26.67px / 行高 1.2 约等于每行 32px，窗口只剩 148px；再长就被
   * `.pjsk-stage{overflow:hidden}` 直接切掉（实测一段 104 字的旁白就出画）。
   *
   * 这里挂在 dialogue.show(name, body)：它拿到的是**整句**，所以在打字机开始
   * 之前就能算好字号，不会边打边缩。用一块隐藏探针量真实高度，别在可见节点上
   * 反复试。符号能压到 FIT_MIN 还装不下就先那样（宁可溢出，不要缩成看不清）。
   */
  var FIT_BASE = 26.67;   // 播放器 CSS 里的正文字号
  var FIT_MIN = 14;       // 最小字号
  var fitProbe = null;

  function measureBody(el, host, text, size) {
    if (!fitProbe || fitProbe.parentNode !== host) {
      fitProbe = document.createElement('div');
      fitProbe.className = 'pjsk-dlg-body pjsdk-probe';
      fitProbe.style.cssText =
        'position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none;';
      host.appendChild(fitProbe);
    }
    fitProbe.style.width = el.offsetWidth + 'px';   // 跟可见节点同宽，换行才一致
    fitProbe.style.fontSize = size + 'px';
    fitProbe.textContent = text;
    return fitProbe.offsetHeight;
  }

  function fitDialogueBody(d, body) {
    var el = d.bodyEl || document.querySelector('.pjsk-dlg-body');
    if (!el || !el.parentNode) return;
    var text = String(body == null ? '' : body);
    if (!text) { el.style.fontSize = ''; return; }

    var avail = el.parentNode.clientHeight - el.offsetTop - 12;
    if (!(avail > 0)) { el.style.fontSize = ''; return; }

    if (measureBody(el, el.parentNode, text, FIT_BASE) <= avail) {
      el.style.fontSize = '';     // 正常长度，用播放器原本的字号
      return;
    }
    var lo = FIT_MIN, hi = FIT_BASE;
    for (var i = 0; i < 10; i++) {
      var mid = (lo + hi) / 2;
      if (measureBody(el, el.parentNode, text, mid) <= avail) lo = mid;
      else hi = mid;
    }
    el.style.fontSize = (Math.floor(lo * 2) / 2) + 'px';
  }

  function hookDialogueFit(pl) {
    var d = pl && pl.dialogue;
    if (!d || d.__fitHooked || typeof d.show !== 'function') return;
    d.__fitHooked = true;
    var el = d.bodyEl || document.querySelector('.pjsk-dlg-body');
    if (el) {
      // 长英文 / 链接没有空格可断，不设这个会横向顶出去（描边层 ::before 会跟着继承）
      el.style.overflowWrap = 'anywhere';
      el.style.wordBreak = 'break-word';
    }
    var orig = d.show.bind(d);
    d.show = function (name, body, instant) {
      try { fitDialogueBody(d, body); } catch (e) { /* 字号失败不影响播放 */ }
      return orig(name, body, instant);
    };
  }

  function hookDialogueName(pl) {
    var d = pl && pl.dialogue;
    if (!d || d.__nameHooked || typeof d.show !== 'function') return;
    d.__nameHooked = true;
    var orig = d.show.bind(d);
    d.show = function (name, body, instant) {
      var p = orig(name, body, instant);
      var m = /^(.*?)\(([^()]*)\)$/.exec(String(name || ''));
      if (!m) return p;
      var el = d.nameEl;
      el.textContent = '';
      var a = document.createElement('span');
      a.textContent = m[1];
      var b = document.createElement('span');
      b.className = 'pjsk-name-sub';
      b.textContent = '(' + m[2] + ')';
      b.dataset.text = b.textContent;   // 括号自己的描边
      el.appendChild(a);
      el.appendChild(b);
      el.dataset.text = m[1];   // 主名的描边只覆盖主名
      return p;
    };
  }

  /* ---------------- 场景 ---------------- */

  // 时段名 -> 变体键。白天是默认值，必须在这里有映射，
  // 否则「白天」查不到 key，会掉到「取第一个变体」，
  // 而排序后第一个常常是傍晚或夜晚的图。
  // 雨夜/雨后/雪景/阴天 是素材里真实存在的时段后缀（住宅街_雨夜.webp …），
  // 雨夜算夜晚（环境光也按夜晚染），其余算白天。
  var TIME_KEY = {
    白天: 'day', 日间: 'day', 早上: 'day', 清晨: 'day', 上午: 'day', 中午: 'day',
    下午: 'day', 正午: 'day', 午后: 'day', 阴天: 'day', 雨后: 'day', 雪景: 'day',
    傍晚: 'sunset', 黄昏: 'sunset', 夕阳: 'sunset', 日落: 'sunset',
    夜晚: 'night', 深夜: 'night', 夜里: 'night', 晚上: 'night',
    凌晨: 'night', 半夜: 'night', 午夜: 'night', 雨夜: 'night',
  };

  // 文件名里表示时段的后缀，按文件名直接匹配时用来挑变体。
  // 注意别用单字「晚」：它会命中「傍晚」，把黄昏的图当成夜晚的。
  var TIME_WORDS = {
    night: ['夜晚', '深夜', '夜里', '晚上', '午夜', '夜', 'night'],
    sunset: ['黄昏', '傍晚', '夕阳', '日落', 'sunset'],
    day: ['白天', '早上', '清晨', '上午', '中午', '日间', 'day'],
  };

  function bgFiles() {
    return (INDEX.backgrounds && INDEX.backgrounds.files) || [];
  }

  function stripExt(f) {
    return String(f || '').replace(/\.[a-z0-9]+$/i, '');
  }

  function baseName(p) {
    return String(p || '').replace(/^.*\//, '');
  }

  // 去掉扩展名的文件名 -> 相对路径。背景可以放在子目录里，靠这张表还原。
  var bgIdx = null;
  function bgIndex() {
    if (bgIdx) return bgIdx;
    bgIdx = {};
    var files = bgFiles();
    for (var i = 0; i < files.length; i++) {
      var stem = stripExt(baseName(files[i]));
      if (!(stem in bgIdx)) bgIdx[stem] = files[i];
    }
    return bgIdx;
  }

  // 同一张表的归一化版：全半角、空格、中点都抹掉。bgIndex 按原名查
  // （scenes 表里写的是原路径），模糊匹配走这张——「天台 _黄昏」
  // 「？？？的「世界」」这类写法不规范的文件名也能用「地点_时段」拼出 key。
  var bgNormIdx = null;
  function bgNormIndex() {
    if (bgNormIdx) return bgNormIdx;
    var C = global.PJSK_CONFIG;
    var norm = (C && C.normalize) || function (s) { return String(s || '').trim(); };
    bgNormIdx = {};
    var files = bgFiles();
    for (var i = 0; i < files.length; i++) {
      var stem = norm(stripExt(baseName(files[i])));
      if (!(stem in bgNormIdx)) bgNormIdx[stem] = files[i];
    }
    return bgNormIdx;
  }

  /** 背景文件名（可带子目录、可带扩展名）-> 播放器要的 id；素材里没有就返回 '' */
  function bgId(value) {
    var v = String(value || '').trim();
    if (!v) return '';
    var idx = bgIndex();
    if (!idx || !Object.keys(idx).length) return stripExt(v);   // 索引没加载到，先按原样试
    if (v.indexOf('/') >= 0) return idx[stripExt(baseName(v))] ? stripExt(v) : '';
    var hit = idx[stripExt(baseName(v))];
    return hit ? stripExt(hit) : '';
  }

  /**
   * 场景名直接对上文件名（不带扩展名）。
   * 素材按「大类/子类/地点_时段」命名（公园/乃乃木公园_白天.webp），
   * 所以 scenes 表基本不用维护：-scene：乃乃木公园 + -time：白天 就拼出 乃乃木公园_白天。
   * 匹配顺序（前面的赢）：
   *   ① 地点_时段 拼名精确命中（规范命名的主体，雨夜/雪景/阴天/雨后 也算时段）
   *   ② 场景名本身就是文件名（购物中心 / 滑雪场 这种不带时段的图）
   *   ③ 前缀变体（神山高中 教室 -> 教室_白天 / 教室_傍晚）里按时段挑
   * 挑不到想要的时段就退白天，再退排序第一个。
   */
  function findBgByName(sceneName, timeName) {
    var files = bgFiles();
    if (!files.length) return '';
    var C = global.PJSK_CONFIG;
    var norm = (C && C.normalize) || function (s) { return String(s || '').trim(); };
    var n = norm(sceneName);
    if (!n) return '';
    var t = norm(timeName);
    var idx = bgNormIndex();

    // ① 「地点_时段」拼名。必须最先：排序更靠前的兄弟变体
    //    （乃乃木公园 樱花 / 神社 祭典_白天 / 摩天轮_清晨）会把正主挡住；
    //    滑雪场.webp 和 滑雪场_夜晚.webp 并存时，-time：夜晚 也必须选后者。
    //    空格变体紧跟其后：归一化会抹掉空格，`住宅街 雨夜` 的键就是 住宅街雨夜——
    //    命名规则收紧后 `_` 只跟白天/傍晚/夜晚，天气时段（雨夜/雨后）都是空格变体。
    var want = TIME_KEY[timeName] || '';
    var CANON = { day: '白天', sunset: '傍晚', night: '夜晚' };
    if (t) {
      var joined = idx[n + '_' + t] || idx[n + t];
      if (joined) return joined;
    }

    // ② 前缀变体（神山高中 教室 -> 教室_白天 / 教室_傍晚）。
    //    地点自身的变体（神社_白天）排在子场景变体（神社 祭典_白天）前面：
    //    写 -scene：神社 想要的是神社本尊，不是祭典。
    var directs = [];
    var others = [];
    for (var i = 0; i < files.length; i++) {
      var bn = norm(stripExt(baseName(files[i])));
      if (bn.indexOf(n) !== 0) continue;
      (bn.charAt(n.length) === '_' ? directs : others).push(files[i]);
    }
    var variants = directs.concat(others);
    if (!variants.length) return '';

    // ③ 时段词不是规范后缀（雨夜/雪景/深夜/早上…）时用桶的规范词再拼一次：
    //    -time：雨夜 找不到专用图就退 _夜晚（滑雪场只有裸图和 _夜晚，也要落到夜晚图）。
    //    必须在④之前：不能让裸图把有时段变体的请求截走。
    if (want) {
      var canon = idx[n + '_' + norm(CANON[want])];
      if (canon) return canon;
    }

    // ④ 场景名就是完整文件名（购物中心 / 露天舞台）。放在③后面：
    //    它是「什么时段都行」的那张，但只兜没有任何更精确匹配的情况。
    if (idx[n]) return idx[n];

    // ⑤ 按时段词挑（早上 -> 白天，深夜 -> 夜晚）：变体名里没有时段原词
    //     但有时段同义词时靠它。注意别用单字「晚」：会命中「傍晚」。
    if (want) {
      var words = TIME_WORDS[want] || [];
      for (var v = 0; v < variants.length; v++) {
        var bv = norm(stripExt(baseName(variants[v])));
        for (var w = 0; w < words.length; w++) {
          if (bv.indexOf(norm(words[w])) >= 0) return variants[v];
        }
      }
    }

    // ⑥ 天气词：「下雨 / 下雪」不是时段，但素材里有 雨夜 / 雨后 / 阴雨 / 雪景 变体。
    //     已知是夜晚就选雨夜版，否则避开夜晚版（雨夜留给夜里，白天下雨选雨后/阴雨）。
    var wx = /[雨雪阴]/.exec(String(timeName || ''));
    if (wx) {
      var cands = [];
      for (var c = 0; c < variants.length; c++) {
        var cv = norm(stripExt(baseName(variants[c])));
        if (cv.indexOf(wx[0]) >= 0) cands.push(variants[c]);
      }
      if (cands.length) {
        var wantNight = want === 'night';
        for (var c2 = 0; c2 < cands.length; c2++) {
          var cc = norm(stripExt(baseName(cands[c2])));
          if (wantNight ? cc.indexOf('夜') >= 0 : cc.indexOf('夜') < 0) return cands[c2];
        }
        return cands[0];
      }
    }

    // 这个场景没有对应时段的图（比如「中央街」只有白天/傍晚，要的是夜晚）：
    // 退白天而不是退 variants[0]——按文件名排序时第一个常常是傍晚。
    var dayWords = TIME_WORDS.day;
    for (var d = 0; d < variants.length; d++) {
      var dv = norm(stripExt(baseName(variants[d])));
      for (var k = 0; k < dayWords.length; k++) {
        if (dv.indexOf(norm(dayWords[k])) >= 0) return variants[d];
      }
    }
    return variants[0];
  }

  function fallbackBg() {
    var f = (global.PJSK_CONFIG && global.PJSK_CONFIG.fallbackScene) || '';
    if (f) {
      var hit = bgIndex()[stripExt(baseName(f))];
      if (hit) return stripExt(hit);
    }
    // 兜底图也不在了（素材改名中），就用第一张
    var first = bgFiles()[0];
    return first ? stripExt(first) : stripExt(f);
  }

  function sceneToBg(sceneName, timeName) {
    var C = global.PJSK_CONFIG || {};
    var scenes = C.scenes || {};
    var norm = C.normalize || function (s) { return String(s || '').trim(); };
    var entry = scenes[sceneName];
    if (!entry) {
      var n = norm(sceneName);
      var keys = Object.keys(scenes);
      for (var i = 0; i < keys.length; i++) {
        if (norm(keys[i]) === n) { entry = scenes[keys[i]]; break; }
      }
    }

    var fb = fallbackBg();
    if (!entry) {
      // 表里没有：按文件名直接找（素材改名后靠这条）
      var byName = findBgByName(sceneName, timeName);
      if (byName) return { id: stripExt(byName), unknown: false };
      return { id: fb, unknown: true };
    }

    var file = '';
    if (typeof entry === 'string') {
      file = entry;
    } else if (entry.url) {
      file = entry.url;
    } else {
      var variant = TIME_KEY[timeName] || null;
      file = (variant && entry[variant]) || entry.day || entry.sunset || entry.night || '';
    }

    // 表里写着但素材里已经没有了（改名中很常见）：用兜底图，并让上层给出提示
    var id = bgId(file);
    if (!id) return { id: fb, unknown: true };
    return { id: id, unknown: false };
  }

  // 挂出来给测试用（test/bg-roundtrip.js 全量验证背景解析）
  app.sceneToBg = sceneToBg;

  /* ---------------- 取文本 ---------------- */

  function readEmbedded() {
    var el = document.getElementById('pjsdk-raw');
    if (!el) return '';
    var t = ((el.value != null ? el.value : el.textContent) || '').trim();
    return /<game>/i.test(t) ? t : '';
  }

  function readFromTavern() {
    try {
      if (typeof global.getCurrentMessageId !== 'function') return '';
      if (typeof global.getChatMessages !== 'function') return '';
      var arr = global.getChatMessages(global.getCurrentMessageId());
      var msg = arr && arr[0];
      if (!msg) return '';
      // 只认 mes：选项收口后 mes 里就是选中的那一支，
      // 另一支在 extra 里，重播时才拼回来。
      var t = msg.message || msg.mes || '';
      return /<game>/i.test(t) ? t : '';
    } catch (e) {
      return '';
    }
  }

  /* ---------------- 播放方式：点击推进 / 自动播放 ----------------
   * 默认是「点一下画面进一句」（跟游戏里一样），右下角的 AUTO 切到自动播放。
   *
   * 酒馆里每条 AI 消息都是一个独立的 iframe，所以选择记在 localStorage 里：
   * 点开 AUTO 之后，后面几条消息也保持自动播放，不用每条都点一次。
   * 想固定住就用 PJSK_SETTINGS：auto: true 永远自动 / auto: false 永远点击 /
   * rememberAuto: false 不记忆（每次都从点击推进开始）。
   */

  var KEY_AUTO = 'pjsdk.auto';
  var KEY_HINT = 'pjsdk.hint';
  var KEY_SPEED = 'pjsdk.speed';

  /** 写 localStorage；存不了（无痕模式、沙箱 iframe）返回 false */
  function remember(key, value) {
    try {
      localStorage.setItem(key, value);
      return true;
    } catch (e) {
      return false;
    }
  }

  function recall(key) {
    try {
      return localStorage.getItem(key);
    } catch (e) {
      return null;
    }
  }

  /** 初始模式：S.auto 写了就听它的，否则用上次的选择，再否则点击推进 */
  function initialAuto() {
    if (S.auto === true) return true;
    if (S.auto === false) return false;
    if (S.rememberAuto === false) return false;
    return recall(KEY_AUTO) === '1';
  }

  var autoBtn = null;

  // 点亮/熄灭全靠 CSS（播放器会给自己挂 .auto 类），这里只同步无障碍属性
  function syncAutoButton() {
    if (!autoBtn || !app.player) return;
    var on = !!app.player.auto;
    autoBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    autoBtn.title = on ? '自动播放：开（点击关闭）' : '自动播放：关（点击开启）';
  }

  /**
   * 舞台是按 1280x720 缩放显示的：缩到很小时按钮只有十几像素高，鼠标都难点。
   * 视觉尺寸不动（要跟游戏原版对齐），只把命中区补到至少 44 CSS 像素高。
   */
  function fitAutoHitArea(player, btn) {
    var w = player.root.clientWidth;
    if (!w) return;
    var k = Math.min(w / 1280, (player.root.clientHeight || (w * 9) / 16) / 720) || 1;
    var pad = Math.max(0, (44 - 32 * k) / 2) / k;   // 换算回舞台坐标
    btn.style.setProperty('--pjsdk-auto-pad', pad.toFixed(1) + 'px');
  }

  /**
   * 右下角那颗 AUTO。挂在对话框里，所以对话框收起 / 隐藏时它跟着走，
   * 也不用自己算舞台缩放——父节点已经是 1280x720 的坐标系了。
   */
  function mountAutoButton(player) {
    var host = player.root.querySelector('.pjsk-dialogue') || player.root.querySelector('.pjsk-stage');
    if (!host) return;

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pjsdk-auto';
    btn.innerHTML = '<span class="pjsdk-auto-ico"></span><span class="pjsdk-auto-txt">AUTO</span>';
    btn.addEventListener('click', function (e) {
      // 这一下别冒到舞台的「点按推进」上，否则会连带跳过一句
      e.preventDefault();
      e.stopPropagation();
      player.setAuto(!player.auto);
      if (S.rememberAuto !== false) remember(KEY_AUTO, player.auto ? '1' : '0');
      hideHint();
    });

    host.appendChild(btn);
    autoBtn = btn;
    syncAutoButton();
    player.on('mode', syncAutoButton);

    fitAutoHitArea(player, btn);
    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(function () { fitAutoHitArea(player, btn); }).observe(player.root);
    }
  }

  /* ---------------- 右上角菜单：重新播放 / 记录 ----------------
   * 按钮照游戏原版（白圆 + 三个点），面板照 ScenarioMenu（贴右上角、半透明
   * #444466、左下圆角）。里面只有两项：
   *   重新播放 —— 从第一句重演这一轮
   *   记录     —— 本轮已经播到的台词，带角色头像
   */

  var ACTION_TALK = 1;   // Snippets[].Action: Talk

  // 头像在 pjsk-assets/Profile/<组合>/<名字>.webp，组合按角色编号分段
  // （21-26 是虚拟歌手，Profile 里没有他们的头像，退成首字圆）
  var PROFILE_UNITS = [
    [1, 4, 'ln'], [5, 8, 'mmj'], [9, 12, 'vbs'], [13, 16, 'ws'], [17, 20, '25'],
  ];

  function unitFolder(num) {
    for (var i = 0; i < PROFILE_UNITS.length; i++) {
      var u = PROFILE_UNITS[i];
      if (num >= u[0] && num <= u[1]) return u[2];
    }
    return '';
  }

  function profileUrl(charId) {
    var c = app.charByNum[charId];
    if (!c || !c.key) return '';
    var unit = unitFolder(c.charId);
    if (!unit) return '';
    return ASSET + 'Profile/' + unit + '/' + c.key.charAt(0).toUpperCase() + c.key.slice(1) + '.webp';
  }

  /**
   * 本轮「已经播到」的台词。progress 给的是 Snippets 的下标，
   * Talk 片段的 ReferenceIndex 指回 TalkData，所以按它取交集就行——
   * 没播到的句子不会提前出现在记录里。
   *
   * 每条带上它在 Snippets 里的下标：记录面板的「前往本句」要拿这个喂 jumpTo()。
   */
  function seenTalks() {
    var scn = app.scenario;
    if (!scn || !scn.TalkData) return [];
    var upto = app.progressIndex;
    var seen = {};
    if (typeof upto === 'number') {
      for (var i = 0; i <= upto && i < scn.Snippets.length; i++) {
        var s = scn.Snippets[i];
        if (s.Action === ACTION_TALK) seen[s.ReferenceIndex] = 1;
      }
    }
    var at = {};
    for (var k = 0; k < scn.Snippets.length; k++) {
      var sn = scn.Snippets[k];
      if (sn.Action === ACTION_TALK && at[sn.ReferenceIndex] == null) at[sn.ReferenceIndex] = k;
    }
    var out = [];
    scn.TalkData.forEach(function (t, idx) {
      if (!t.Body) return;
      if (typeof upto === 'number' && !seen[idx]) return;
      out.push({ talk: t, snippet: at[idx] == null ? -1 : at[idx] });
    });
    return out;
  }

  /** 头像：有 Profile 图就用图，没有（虚拟歌手 / 旁白）退成首字圆 */
  function logFace(charId, name) {
    var url = charId ? profileUrl(charId) : '';
    if (!url) {
      var d = document.createElement('div');
      d.className = 'pjsdk-log-face' + (name ? '' : ' blank');
      d.textContent = name ? name.charAt(0) : '';
      return d;
    }
    var img = document.createElement('img');
    img.className = 'pjsdk-log-face';
    img.alt = '';
    img.src = url;
    img.addEventListener('error', function () {
      var d = document.createElement('div');
      d.className = 'pjsdk-log-face';
      d.textContent = name.charAt(0);
      if (img.parentNode) img.parentNode.replaceChild(d, img);
    });
    return img;
  }

  function logRow(entry, onGo) {
    var t = entry.talk;
    var row = document.createElement('div');
    row.className = 'pjsdk-log-row';

    var id = (t.TalkCharacters && t.TalkCharacters.length) ? t.TalkCharacters[0].Character2dId : 0;
    var name = t.WindowDisplayName || '';
    row.appendChild(logFace(id, name));

    var main = document.createElement('div');
    main.className = 'pjsdk-log-main';
    if (name) {
      var n = document.createElement('div');
      n.className = 'pjsdk-log-name';
      n.textContent = name;
      main.appendChild(n);
    }
    var body = document.createElement('div');
    body.className = 'pjsdk-log-text';
    body.textContent = t.Body;
    main.appendChild(body);

    row.appendChild(main);

    // 「前往本句」：跳回这句重演。jumpTo 会用 [0, seq) 的片段把舞台重建到那一刻，
    // 所以背景 / 站位 / 环境光都能对上，不是单纯把光标挪走。
    var go = document.createElement('button');
    go.type = 'button';
    go.className = 'pjsdk-log-go';
    go.textContent = '前往本句';
    go.disabled = !(entry.snippet >= 0);
    go.addEventListener('click', function (e) {
      e.stopPropagation();
      if (onGo) onGo(entry);
    });
    row.appendChild(go);
    return row;
  }

  var menuBtn = null;
  var fullBtn = null;
  var menuPanel = null;
  var menuBackdrop = null;
  var logEl = null;

  /* ---------------- 播放速度 ----------------
   * 打字机（60ms/字）、翻页停顿、淡入淡出全都挂在播放器同一个 Clock 上：
   * Clock.sleep(ms) 实际等的是 ms / scale，所以改 scale 就是整体快慢。
   * Live2D 的动作走 ticker，不受影响——速度只改「文字和等待」。
   */
  var SPEEDS = [0.5, 0.75, 1, 1.5];
  var speedChips = [];

  /** S.speed 写死就听它的，否则用上次的选择，再否则 1× */
  function initialSpeed() {
    var forced = parseFloat(S.speed);
    if (forced > 0) return forced;
    var stored = parseFloat(recall(KEY_SPEED));
    return stored > 0 ? stored : 1;
  }

  function applySpeed(v) {
    if (!app.player || !app.player.clock) return;
    app.player.clock.scale = v;
    for (var i = 0; i < speedChips.length; i++) {
      var on = parseFloat(speedChips[i].getAttribute('data-v')) === v;
      speedChips[i].classList.toggle('on', on);
    }
    if (S.rememberSpeed !== false) remember(KEY_SPEED, String(v));
  }

  function openMenu() {
    if (!menuPanel) return;
    menuBackdrop.classList.add('open');
    menuPanel.classList.add('open');
    menuBtn.classList.add('hidden');   // 圆钮让位给面板里的 ✕（同一个位置）
    if (fullBtn) fullBtn.classList.add('hidden');   // 面板会盖住它，干脆藏起来
  }

  function closeMenu() {
    if (!menuPanel) return;
    menuPanel.classList.remove('open');
    menuBackdrop.classList.remove('open');
    menuBtn.classList.remove('hidden');
    if (fullBtn) fullBtn.classList.remove('hidden');
  }

  function closeLog() {
    if (logEl) logEl.classList.remove('open');
  }

  /* ---------------- 全屏 ----------------
   * 播放器在酒馆里是 iframe（srcdoc），requestFullscreen 能不能成，取决于
   * 外面有没有给 iframe 加 allow="fullscreen"。失败不静默，弹一句说明原因。
   * 全屏后根节点尺寸变了，播放器自己的 ResizeObserver 会重算 fit()，不用管。
   */
  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }

  /** 一次性小提示（不占用 hintEl，那条是「点画面继续」专用的） */
  function toast(msg) {
    var host = (app.player && app.player.root) || document.body;
    var el = document.createElement('div');
    el.className = 'pjsdk-hint';
    el.textContent = msg;
    host.appendChild(el);
    setTimeout(function () { el.classList.add('in'); }, 30);
    setTimeout(function () {
      el.classList.remove('in');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
    }, 2800);
  }

  function toggleFull() {
    var d = document;
    var doc = d.documentElement;
    if (fsElement()) {
      var exit = d.exitFullscreen || d.webkitExitFullscreen;
      if (exit) { try { exit.call(d); } catch (e) { /* 已经退出了 */ } }
      return;
    }
    var req = doc.requestFullscreen || doc.webkitRequestFullscreen;
    if (!req) { toast('这个环境不支持全屏'); return; }
    try {
      var p = req.call(doc);
      if (p && typeof p.catch === 'function') {
        p.catch(function () { toast('全屏被浏览器拦了：iframe 需要 allow="fullscreen"'); });
      }
    } catch (e) {
      toast('全屏被浏览器拦了：iframe 需要 allow="fullscreen"');
    }
  }

  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
    document.addEventListener(ev, function () {
      if (fullBtn) fullBtn.classList.toggle('on', !!fsElement());
    });
  });

  /* ── 世界地图 ────────────────────────────────────────────────────────
   * 坐标是 worldmap.png（2048×1323）上的像素，跟 pjsk-assets/worldmap/
   * worldmap_positions.json 同一份数据；x/y/w/h 是每个地点精灵的位置。
   *
   * 面板按 1280 宽铺满、贴底放：上面切掉的 100 多像素是天空，地点一个不少。
   * 每个地点是一个 <button>，点开「前往」弹窗；确认后才算「用户决定前往」，
   * 发一条用户消息进酒馆（createChatMessages + /trigger），同时发
   * CustomEvent('pjsdk:place') 和 app.onMapPlace(name, detail) 给功能层。
   *
   * 随机事件：每次打开地图重掷——一部分地点头顶出现「角色头像胶囊」
   * （照地图.jpg 的事件 UI）。池子是 20 名主力（按团队分段），本轮对话里
   * 登过场的角色不参与；同团队的成员更容易凑在一起。带事件的地点，
   * 弹窗里多一行「谁也在这里」，发出的提示词也多一段偶遇说明。
   */
  /* 世界地图贴图走图床（与状态栏共用同一批资源）：底图 worldmap.png + 7 个地点精灵。
     以前读 ASSET + 'worldmap/'（本地素材服务器），现在单独一个基址，
     换仓库/换分支只改这一行；以后要退回本地，把它改成 ASSET + 'worldmap/' 即可。
     也可以在 PJSK_SETTINGS 里写 mapAssetBase 覆盖。 */
  var MAP_ASSET_BASE = String(S.mapAssetBase
    || 'https://raw.githubusercontent.com/Cat-organ/my-image-pjsk/refs/heads/main/image/worldmap/')
    .replace(/\/?$/, '/');

  function mapUrl(file) {
    return MAP_ASSET_BASE + file;
  }

  var MAP_W = 2048;
  var MAP_H = 1323;
  var MAP_POINTS = [
    { id: 1, name: '宫益坂女子学园', file: 'worldMap_宫益坂女子学园.png', x: 794, y: 960, w: 652, h: 332 },
    { id: 2, name: '全向十字路口', file: 'worldMap_全向十字路口.png', x: 559.75, y: 514, w: 466.43, h: 348 },
    { id: 3, name: '中央街', file: 'worldMap_中央街.png', x: 66, y: 463, w: 402, h: 236 },
    { id: 4, name: '神山高校', file: 'worldMap_神山高校.png', x: 543, y: 256, w: 472, h: 238 },
    { id: 5, name: '购物中心', file: 'worldMap_购物中心.png', x: 1043, y: 271, w: 241, h: 272 },
    { id: 6, name: '音乐商店', file: 'worldMap_音乐商店.png', x: 1314, y: 606, w: 134, h: 233 },
    { id: 7, name: '菲尼克斯乐园', file: 'worldMap_菲尼克斯乐园.png', x: 1368.2, y: 143, w: 725.76, h: 389.34 },
  ];

  // ── 随机事件 ──
  // 池子就是 PROFILE_UNITS 那 20 个人（1~4 ln、5~8 mmj、9~12 vbs、13~16 ws、
  // 17~20 at25），团队分段直接复用 unitFolder()，头像复用 profileUrl()。
  var MAP_EVENT_PLACE_CHANCE = 0.4;   // 每个地点出事件的概率（期望 ~2.8 个）
  var MAP_EVENT_TEAM_BIAS = 0.55;     // 后续成员优先从已选角色的团队里补的概率

  // 地点限制（按地点名索引）：
  // - MAP_PLACE_EXCLUDE 禁入名单：宫益坂女子学园是女校、校规严，正常男性混不进去
  //   （11 彰人 / 12 冬弥 / 13 司 / 16 类，正好是 20 人里的全部男性）
  // - MAP_PLACE_ONLY 驻留名单：「世界」的每个区域只有对应组合的角色能出现；
  //   空数组 = 特殊剧情地点，不出事件（？？？的「世界」）
  var MAP_PLACE_EXCLUDE = {
    '宫益坂女子学园': [11, 12, 13, 16],
  };
  var MAP_PLACE_ONLY = {
    '舞台的「世界」': [5, 6, 7, 8],          // mmj
    '教室的「世界」': [1, 2, 3, 4],          // ln
    '街道的「世界」': [9, 10, 11, 12],       // vbs
    '？？？的「世界」': [],                   // 特殊剧情地点：无事件
    '空无一人的「世界」': [17, 18, 19, 20],   // 25时
    '奇幻乐园的「世界」': [13, 14, 15, 16],   // ws
  };

  // 「更多地点」面板：主地图摆不下的可前往区域，分两组选项卡。
  // 事件规则跟主地图完全一样（同一份池子、一人一地、本轮角色排除），
  // 出现率单独调低——19 个地点都按 40% 掷会把 20 人池子抽干，排后面的组总没事件
  var MAP_EVENT_EXTRA_CHANCE = 0.3;
  var EXTRA_PLACES = [
    {
      group: '其他区域',
      names: [
        'Vivid Street', '宫益坂地区', '神山路', '住宅街', '电玩城', '医院', '神社',
        '涩谷公园', '乃乃木公园', 'WEEKEND GARAGE', 'carino carina咖啡厅', '咖啡厅', '企鹅咖啡厅',
      ],
    },
    {
      group: '「世界」',
      names: [
        '舞台的「世界」', '教室的「世界」', '街道的「世界」', '？？？的「世界」',
        '空无一人的「世界」', '奇幻乐园的「世界」',
      ],
    },
  ];
  // 摊平成 { id, name, group }；id 形如 'e0-3'（组-序号），跨打开保持稳定
  var EXTRA_PLACE_LIST = [];
  EXTRA_PLACES.forEach(function (g, gi) {
    g.names.forEach(function (name, ni) {
      EXTRA_PLACE_LIST.push({ id: 'e' + gi + '-' + ni, name: name, group: g.group });
    });
  });

  /** 本轮对话登过场的角色（说话 + 登场/动作行都算），返回 1~20 里要排除的编号 */
  function roundCharNums() {
    var seen = {};
    var scn = app.scenario;
    if (scn) {
      (scn.TalkData || []).forEach(function (t) {
        (t.TalkCharacters || []).forEach(function (c) { seen[c.Character2dId] = 1; });
      });
      (scn.LayoutData || []).forEach(function (l) {
        if (l && l.Character2dId) seen[l.Character2dId] = 1;
      });
    }
    // 虚拟歌手（21+）和配角（101+）本来就不在池子里，这里只留 1~20
    return Object.keys(seen).map(Number).filter(function (id) {
      return id >= 1 && id <= 20;
    });
  }

  /** 人数 1~4，偏向 2 人（提示词的示例就是「(角色A)和(角色B)」）；maxCount 压上限 */
  function pickEventCount(maxCount) {
    var weights = [2, 4, 2, 1];   // 1人 / 2人 / 3人 / 4人
    var top = Math.max(1, Math.min(4, maxCount || 4));
    var total = 0;
    for (var i = 0; i < top; i++) total += weights[i];
    var r = Math.random() * total;
    for (var j = 0; j < top; j++) {
      if (r < weights[j]) return j + 1;
      r -= weights[j];
    }
    return top;
  }

  /** 从 available（编号数组）里挑一批：同团队的更容易凑在一起；banned 里的编号不要 */
  function pickEventChars(available, banned, maxCount) {
    var picked = [];
    var avail = available.filter(function (n) { return !(banned && banned[n]); });
    var want = Math.min(pickEventCount(maxCount), avail.length);
    while (picked.length < want && avail.length) {
      var num = null;
      if (picked.length && Math.random() < MAP_EVENT_TEAM_BIAS) {
        var team = unitFolder(picked[(Math.random() * picked.length) | 0]);
        var mates = avail.filter(function (n) { return unitFolder(n) === team; });
        if (mates.length) num = mates[(Math.random() * mates.length) | 0];
      }
      if (num == null) num = avail[(Math.random() * avail.length) | 0];
      picked.push(num);
      avail.splice(avail.indexOf(num), 1);
    }
    return picked;
  }

  /** 地点限制 → 禁入表。EXCLUDE 是黑名单；ONLY 是白名单（白名单外全禁，空数组=无事件） */
  function bannedAt(p) {
    var banned = {};
    var exclude = MAP_PLACE_EXCLUDE[p.name];
    if (exclude) {
      exclude.forEach(function (n) { banned[n] = 1; });
      return banned;
    }
    var only = MAP_PLACE_ONLY[p.name];
    if (only) {
      for (var n = 1; n <= 20; n++) {
        if (only.indexOf(n) < 0) banned[n] = 1;
      }
    }
    return banned;
  }

  /**
   * 掷一次本轮地图的事件（主地图 + 「更多地点」面板一起掷）：
   * [{ id, place, chars: [编号], extra? }]，extra=1 是面板里的地点。
   * 主地图至少保证一个；面板地点允许一个都没有（池子被抽干时往后排的自然没事件）。
   */
  function rollMapEvents() {
    var events = [];
    if (S.mapEvents === false) return events;
    var excluded = {};
    roundCharNums().forEach(function (n) { excluded[n] = 1; });
    var available = [];
    for (var n = 1; n <= 20; n++) {
      if (!excluded[n] && app.charByNum[n] && app.charByNum[n].key) available.push(n);
    }
    if (!available.length) return events;

    // 先决定哪些地点出事件，再打乱顺序统一分配——按列表顺序掷的话，池子不够时
    // 排后面的地点（「世界」组）总是被抽干
    var cands = [];
    MAP_POINTS.forEach(function (p) {
      if (Math.random() < MAP_EVENT_PLACE_CHANCE) cands.push(p);
    });
    EXTRA_PLACE_LIST.forEach(function (p) {
      if (Math.random() < MAP_EVENT_EXTRA_CHANCE) cands.push(p);
    });
    for (var i = cands.length - 1; i > 0; i--) {   // Fisher-Yates 洗牌
      var j = (Math.random() * (i + 1)) | 0;
      var t = cands[i]; cands[i] = cands[j]; cands[j] = t;
    }
    // 自适应人数上限：出事件的地点多的时候少带几个人，让排后面的也有得掷
    var cap = Math.max(1, Math.floor(available.length / Math.max(1, cands.length)));

    var isMain = {};
    MAP_POINTS.forEach(function (p) { isMain[p.id] = 1; });
    cands.forEach(function (p) {
      var chars = pickEventChars(available, bannedAt(p), cap);
      if (!chars.length) return;   // 可用的全被地点限制禁掉了（如 ？？？）/ 池子见底
      // 同一人同一张地图只出现一个地方：掷完就从池子里划掉
      chars.forEach(function (n) { available.splice(available.indexOf(n), 1); });
      var ev = { id: p.id, place: p.name, chars: chars };
      if (!isMain[p.id]) ev.extra = 1;
      events.push(ev);
    });

    // 主地图至少保证一个（全被禁的倒霉情况换地点重试几次）
    if (!events.some(function (e) { return !e.extra; })) {
      for (var k = 0; k < 4; k++) {
        var p = MAP_POINTS[(Math.random() * MAP_POINTS.length) | 0];
        var chars = pickEventChars(available, bannedAt(p), 4);
        if (chars.length) {
          events.push({ id: p.id, place: p.name, chars: chars });
          break;
        }
      }
    }
    return events;
  }

  /** 提示词里的「(A)和(B)」；三个人以上是「(A)、(B)和(C)」 */
  function joinNames(names) {
    if (names.length === 1) return names[0];
    return names.slice(0, -1).join('、') + '和' + names[names.length - 1];
  }

  /** 发进酒馆的内置提示词；带事件角色时多一段偶遇说明 */
  function mapIntentPrompt(place, names) {
    if (names && names.length) {
      return '<!--用户决定前往【' + place + '】区域，本区域中(' + joinNames(names) +
        ')也在这里，设计一个随机偶遇事件 -->';
    }
    return '<!--用户决定前往【' + place + '】区域 -->';
  }

  var mapEl = null;
  var mapEventByPlace = {};       // place id -> 事件角色编号（本次打开期间有效）
  var mapDialog = null;
  var mapDialogTitle = null;
  var mapDialogWho = null;
  var mapDialogInput = null;
  var mapDialogCtx = null;
  var moreBtn = null;
  var moreBackdrop = null;
  var morePanel = null;

  function closeMap() {
    if (mapEl) mapEl.classList.remove('open');
    closeMore();
    closePlaceDialog();
  }

  function closeMore() {
    if (morePanel) morePanel.classList.remove('open');
    if (moreBackdrop) moreBackdrop.classList.remove('open');
  }

  function toggleMore() {
    var opening = !morePanel.classList.contains('open');
    morePanel.classList.toggle('open', opening);

  function openMap() {
    closeMenu();
    closeLog();
    closeAff();
    closeStory();
    if (!app.player) return;

  /* ── 剧情面板 ────────────────────────────────────────────────────────
   * 面板本体在 story.js（story.core.js 是从 剧情模块/ 生成的选择界面）。
   * 这里只管：菜单入口、关掉别的面板、Esc 关闭。
   */

  function storyUI() {
    return global.PJSK_STORY_UI || null;
  }

  function closeStory() {
    var ui = storyUI();
    if (ui && ui.isOpen()) ui.close();
  }

  function openStory() {
    closeMenu();
